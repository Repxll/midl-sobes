<script>
CH.push({id:'ai', title:'ИИ в работе дизайнера и дизайн ИИ-продуктов', lessons:[
 {id:'ai-1', title:'ИИ-инструменты как часть процесса', ask:true,
  open:{q:'Расскажите, как вы используете ИИ-инструменты в своём процессе: где помогли, где ошиблись, как проверяете результат.', hint:['Конкретные инструменты и этапы: синтез, черновики, прототипы, тексты','Как проверяете и где не доверяете','Пример ошибки ИИ, которую вы поймали']},
  summary:[
   'По опросу Figma (февраль 2026) 73% дизайн-менеджеров видят растущую потребность в навыках ИИ-инструментов, 79% — в проектировании ИИ-продуктов. От мидла ждут умения писать промпты и оценивать результат.',
   'Где ИИ реально помогает: синтез интервью и отзывов, черновики текстов, генерация вариантов для «разгона», быстрые прототипы (Figma Make, v0, Lovable), подготовка презентаций.',
   'Где опасно: «финальные» экраны из генератора (одинаковое портфолио), выдуманные данные в синтезе, нарушение NDA при загрузке материалов.',
   'Правило: ИИ ускоряет, суждение остаётся за вами. Нанимающие хотят видеть процесс: что попросили, что получили, что отбросили и почему.',
  ], q:[
   {t:'Какое использование ИИ покажет уровень мидла?', o:['Собрать в Figma Make несколько готовых кейсов для портфолио, чтобы показать владение современными инструментами','Прогнать расшифровки 8 интервью через модель для первичной группировки, сверить с исходниками и сформулировать инсайты самому','Сгенерировать 10 вариантов главного экрана и взять самый сильный визуально, чтобы сэкономить время на эскизах','Делать синтез интервью только вручную, потому что модель не знает контекста продукта и всё равно ошибётся'], c:1, e:['Сгенерированные кейсы выглядят одинаково и не показывают вашего мышления, поэтому нанимающие считают это красным флагом.','Модель ускоряет рутину, а сверка с исходниками и собственные выводы показывают то суждение, которого ждут от мидла.','Выбор по визуальной силе без критерия задачи и пользователя — это вкусовщина, а не продуктовое суждение.','Полный отказ от ИИ замедляет работу и читается как отставание от рынка, где проверка результатов модели уже ожидаемый навык.'], d:1},
   {t:'Что такое Figma Make в контексте работы дизайнера?', o:['ИИ-плагин Figma, который по описанию генерирует иконки и иллюстрации в стиле вашей дизайн-системы','Режим Figma для разработчиков, где из макетов выгружаются стили, отступы и CSS-код компонентов','Инструмент Figma, который по промпту и макетам собирает работающий прототип или приложение','Функция Figma, которая автоматически собирает библиотеку компонентов и токенов из готовых макетов'], c:2, e:['Генерацией иконок занимаются отдельные плагины, а Figma Make собирает работающий прототип по промпту.','Это описание Dev Mode, который помогает передавать макеты в разработку, а не создаёт приложение.','Figma Make по промпту и макетам собирает живой прототип, удобный для быстрой проверки гипотез до разработки.','Сборка библиотеки из макетов — задача дизайн-системы и плагинов, а Figma Make делает работающие прототипы.'], d:1},
   {t:'Вы загрузили в публичную нейросеть расшифровки интервью с клиентами банка. Что не так?', o:['Ничего критичного, если в расшифровках нет номеров карт и паролей, а история чатов в сервисе отключена','Проблема в качестве: публичные модели плохо знают банковскую терминологию и могут исказить смысл ответов','Ошибка лишь в том, что это не согласовали с продактом; если он не против, можно продолжать так же','Возможное нарушение NDA и закона о персональных данных: нужно обезличить данные и брать разрешённые инструменты'], c:3, e:['Персональные данные — это не только карты и пароли, а реальные настройки хранения публичного сервиса вы не контролируете.','Качество вторично: главный риск здесь — утечка клиентских данных и нарушение договорённостей о конфиденциальности.','Устного согласия продакта недостаточно, потому что политика безопасности и закон о персональных данных действуют независимо от него.','Данные клиентов защищены NDA и законом, поэтому их обезличивают и загружают только в одобренные компанией инструменты.'], d:2},
   {t:'Что такое «суждение о результате ИИ» на практике?', o:['Внимательно перечитывать результат и править стиль и формулировки, если в целом он выглядит вполне правдоподобно','Сверять факты с источниками, оценивать уместность решения для задачи и пользователя, отбрасывать неподходящее','Перегенерировать ответ несколько раз и брать вариант, который повторяется чаще всего, как самый надёжный','Использовать самую мощную модель с подробным промптом, чтобы свести ошибки к минимуму без лишней проверки'], c:1, e:['Правдоподобный текст может содержать выдуманные факты, а правка стиля не проверяет содержание.','Так навык описывают в вакансиях: проверка фактов, оценка уместности и готовность отбросить результат.','Повторяемость ответа не гарантирует его верность, модель может стабильно воспроизводить одну и ту же ошибку.','Даже лучшая модель ошибается, поэтому мощность и качество промпта не заменяют проверку человеком.'], d:2},
   {t:'ИИ в синтезе интервью выдал инсайт с цитатой, которой нет ни в одной расшифровке. Что это и что делать?', o:['Вероятно, модель перефразировала несколько реплик; можно оставить цитату, пометив её как обобщённую','Это галлюцинация: сверить каждый инсайт с исходниками и не использовать цитаты, которых там нет','Попросить модель указать, из какой расшифровки цитата, и оставить её, если модель назовёт конкретный файл','Оставить инсайт, но убрать цитату: сам вывод может быть верным, даже если формулировку модель придумала'], c:1, e:['Выдуманная цитата, поданная как обобщённая, всё равно вводит команду в заблуждение о словах пользователей.','Цитаты нет в исходниках, значит модель её выдумала, и теперь каждый инсайт нужно сверить с расшифровками.','Модель может уверенно назвать файл и повторить выдумку, поэтому проверять нужно по самим исходникам.','Инсайт, опирающийся на несуществующую цитату, не подтверждён данными и может привести к ложным решениям.'], d:2},
   {t:'Какой из промптов даст полезный черновик текста ошибки для банковского приложения?', o:['«Ты опытный UX-писатель в топовом банке. Напиши текст ошибки для экрана перевода по лучшим практикам, коротко и ясно»','«Ошибка перевода: нет связи с банком получателя, деньги не списаны, можно повторить через минуту; тон спокойный, до 2 предложений»','«Напиши 10 вариантов текста ошибки сервера для банковского приложения в разных тонах, от строгого до дружелюбного»','«Напиши текст ошибки 503 при переводе: Service Unavailable, таймаут шлюза; объясни пользователю техническую причину»'], c:1, e:['Роль и «лучшие практики» не заменяют фактов: модель не знает причину ошибки, судьбу денег и следующий шаг пользователя.','В промпте есть контекст, факты, следующий шаг, тон и формат, поэтому черновик получится конкретным и пригодным.','Много вариантов без фактов о ситуации дают одинаково общие тексты, из которых всё равно нечего выбрать.','Технические детали без описания последствий для пользователя дадут текст с жаргоном вместо понятного объяснения.'], d:3},
  ]},
 {id:'ai-2', title:'Как проектировать ИИ-функции', ask:true,
  open:{q:'Вас просят спроектировать «ИИ-помощника» в приложении. Какие особенности таких интерфейсов вы заложите?', hint:['Ожидания и границы: что умеет, что нет','Состояния: думает, пишет, ошибся, не уверен','Контроль человека, правка результата, обратная связь']},
  summary:[
   'Главные отличия ИИ-интерфейсов: недетерминированность (ответ может быть разным и неверным), задержка (нужны состояния «думает», «пишет»), пустой промпт («что мне писать?»).',
   'Проектируйте доверие: показывайте источники, уверенность, границы возможностей; дайте легко править и отменять результат; собирайте обратную связь (полезно/нет).',
   'Человек контролирует действие: ИИ предлагает, пользователь подтверждает — особенно там, где есть деньги, данные и необратимость.',
   'Этика: справедливость, прозрачность и возможность оспорить решение, если ИИ влияет на доступ к услугам (кредит, модерация).',
  ], q:[
   {t:'Пользователь открыл ИИ-помощника и видит пустое поле «Спросите что-нибудь». Что улучшить?', o:['Оставить как есть: это привычный паттерн чат-ботов, а подсказки перегрузят минималистичный экран','Сменить плейсхолдер на более дружелюбный, например «Чем могу помочь сегодня?», чтобы оживить помощника','Добавить примеры запросов и подсказки о возможностях, чтобы снять проблему пустого промпта','Показать при первом входе онбординг из пяти экранов о том, как устроена модель и что она умеет'], c:2, e:['Пустое поле — типичный провал активации: пользователь не знает, что спросить, и уходит.','Дружелюбный тон не отвечает на вопрос «что тут можно сделать», поэтому проблема пустого промпта остаётся.','Примеры запросов и подсказки о возможностях — базовый паттерн, который снимает страх пустого поля.','Длинный онбординг пролистывают, а подсказки нужны в момент ввода, прямо рядом с полем.'], d:1},
   {t:'ИИ в банковском приложении предлагает перевести деньги по голосовому запросу. Какой принцип важнее всего?', o:['Скорость: переводить сразу после команды, а при ошибке давать кнопку отмены на несколько секунд','Подтверждение человеком: перед переводом показать распознанные сумму и получателя и запросить согласие','Точность: дообучить модель распознавания так, чтобы ошибки стали редкими и подтверждение не требовалось','Краткость: озвучить итог перевода голосом, не загромождая экран суммой и реквизитами получателя'], c:1, e:['Отправленный перевод часто нельзя отозвать, поэтому кнопка отмены не защищает от ошибки распознавания.','Где есть деньги и необратимость, человек должен увидеть проверяемые детали и явно подтвердить действие.','Даже редкая ошибка распознавания стоит пользователю денег, поэтому подтверждение нужно при любой точности.','Без суммы и получателя на экране пользователь не сможет проверить, что именно поняла модель.'], d:1},
   {t:'Какой из вариантов повышает доверие к ответу ИИ?', o:['Уверенный экспертный тон без оговорок, чтобы пользователь не сомневался в ответе','Подробный ответ со всеми деталями, чтобы было видно, что модель разобралась','Ответ от лица консультанта без пометки, что это ИИ, чтобы снизить скепсис','Ссылки на источники, пометка неуверенности и кнопка «не то» для обратной связи'], c:3, e:['Уверенный тон при неизбежных ошибках разрушает доверие сильнее, чем честная оговорка.','Объём текста не делает ответ проверяемым, а лишь усложняет поиск ошибок.','Скрывать участие ИИ — этическая проблема, и при раскрытии доверие теряется полностью.','Прозрачность источников и уверенности плюс канал обратной связи — основа доверия к ИИ.'], d:2},
   {t:'Ответ ИИ генерируется 15 секунд. Что спроектировать?', o:['Скелетон на месте ответа до конца генерации, а затем весь текст целиком одним блоком','Состояние «думает», потоковый вывод текста по мере генерации и кнопку остановки','Блокирующее окно с прогресс-баром, чтобы пользователь не отправил запрос повторно','Сообщение «Ответ будет готов через 15 секунд» с таймером обратного отсчёта'], c:1, e:['Пятнадцать секунд скелетона без видимого прогресса воспринимаются как зависание, и пользователь уходит.','Стриминг показывает прогресс сразу, а кнопка остановки даёт контроль — это стандарт ИИ-интерфейсов.','Блокировка экрана лишает пользователя контроля и не даёт прервать неудачный запрос.','Время генерации непредсказуемо, и ошибающийся таймер подрывает доверие сильнее, чем его отсутствие.'], d:2},
   {t:'ИИ-функция автоматически отклоняет заявки на кредит. Какое требование к интерфейсу обязательно?', o:['Мгновенный ответ и вежливое сообщение без деталей, чтобы не раскрывать логику модели','Объяснение причины отказа и возможность оспорить решение или обратиться к человеку','Предложение подать заявку снова через 30 дней и подборка других продуктов банка','Ссылка на общие условия кредитования с требованиями к заёмщикам и порядком рассмотрения'], c:1, e:['Отказ без объяснения лишает человека возможности понять и исправить ситуацию и не отвечает этическим требованиям.','Прозрачность причины и право на обжалование — этический и регуляторный минимум для автоматических решений.','Повторная заявка без понимания причины отказа, скорее всего, закончится тем же результатом.','Общие условия не объясняют, почему отказали именно этому человеку, и не дают способа оспорить решение.'], d:2},
   {t:'Продакт хочет, чтобы ИИ-помощник «отвечал на всё». Что скажет дизайнер?', o:['Согласиться, но добавить под ответами дисклеймер о том, что ответы ИИ могут содержать неточности','Обозначить границы: вне своей зоны помощник честно говорит «не могу» и передаёт вопрос человеку','Подключить самую сильную модель и веб-поиск, чтобы помощник действительно отвечал на любые вопросы','Запустить без ограничений, а по логам вопросов позже решить, какие темы стоит закрыть для помощника'], c:1, e:['Мелкий дисклеймер не спасает доверие, когда помощник уверенно ошибается в важном для пользователя вопросе.','Границы возможностей — часть дизайна ИИ-продукта: честное «не могу» и путь к человеку сохраняют доверие.','Даже сильная модель с поиском ошибается и выходит за рамки компетенции продукта, обещание «всё» невыполнимо.','Запуск без границ означает, что первые ошибки увидят реальные пользователи, а доверие потом трудно вернуть.'], d:3},
  ]},
 {id:'ai-3', title:'Прототипы и «вайб-кодинг» на собесе', ask:false,
  open:{q:'Как бы вы собрали кликабельный прототип за час, чтобы проверить гипотезу до разработки?', hint:['Figma Make / v0 / Lovable или прототип в Figma','Что именно проверяете и с кем','Что прототип не проверяет']},
  summary:[
   'Некоторые компании добавляют раунд с ИИ-прототипированием: 30–60 минут собрать работающий прототип в Figma Make, v0, Lovable или Cursor, рассуждая вслух. Оценивают не код, а постановку задачи, объём MVP и проверку результата.',
   'Прототип нужен, чтобы увидеть недостатки до разработки: дизайнеры отмечают, что живой прототип вскрывает проблемы, которых не видно в макете.',
   'Умейте объяснить, что прототип не проверяет: производительность, реальные данные, edge cases, доступность.',
   'Для портфолио полезно короткое видео процесса: как ставили задачу ИИ, какие решения принимали сами. Это ценят больше полированного кейса.',
  ], q:[
   {t:'На раунде с ИИ-прототипированием вас оценивают в первую очередь по…', o:['Чистоте и структуре сгенерированного кода, ведь его потом будут дорабатывать','Тому, насколько законченным и близким к продакшену выйдет прототип за отведённое время','Тому, как вы ставите задачу, ограничиваете объём и проверяете результат ИИ','Выбору инструмента: знаете ли вы, где лучше Figma Make, а где Cursor или v0'], c:2, e:['Код прототипа не идёт в продакшен, поэтому его чистота не является предметом оценки.','Полировка за час обычно съедает время, которое нужно на постановку задачи и проверку результата.','Оценивают мышление: постановку задачи, ограничение объёма MVP и проверку того, что выдал ИИ.','Знание инструментов полезно, но выбор инструмента не показывает, как вы думаете о задаче.'], d:1},
   {t:'Что из этого НЕ стоит проверять кликабельным прототипом?', o:['Понятность сценария оформления заказа','Находимость ключевого действия на главном экране','Производительность приложения под нагрузкой','Реакцию людей на формулировки кнопок'], c:2, e:['Понятность сценария как раз хорошо проверяется на кликабельном прототипе с пользователями.','Находимость ключевого действия — типичная задача юзабилити-теста на прототипе.','Прототип не отражает реальную архитектуру и данные, поэтому производительность на нём не проверить.','Реакцию на формулировки удобно и дёшево проверить на прототипе до разработки.'], d:1},
   {t:'Как лучше показать работу с ИИ в портфолио?', o:['Указать в резюме список ИИ-инструментов и уровень владения каждым','Выложить лучшие сгенерированные экраны с пометкой, где они сделаны','Видео или кейс: задача, промпты, что приняли и отбросили, итог','Не упоминать ИИ, чтобы работа воспринималась полностью вашей'], c:2, e:['Список инструментов — пустое заявление, которое не показывает, как вы ими пользуетесь.','Сгенерированные экраны похожи друг на друга и не показывают ваших решений.','Процесс с решениями показывает суждение, и именно его ценят нанимающие.','Отсутствие ИИ в портфолио сейчас тоже читается как минус, а скрывать процесс незачем.'], d:2},
   {t:'У вас 45 минут на прототип в Figma Make. С чего начать?', o:['С подробного промпта на всё приложение, чтобы за одну генерацию получить максимум экранов','С одного сценария и критерия проверки, затем минимальный прототип только этого сценария','С загрузки дизайн-системы и стилей, чтобы прототип сразу выглядел как реальный продукт','С изучения возможностей Figma Make, чтобы понять ограничения инструмента до старта'], c:1, e:['Большой объём съест всё время, а прототип в итоге не проверит ни одной гипотезы.','Ограничение объёма до одного сценария с критерием проверки — главный оцениваемый навык.','Визуальная точность не важна для проверки гипотезы и отнимает время у сценария.','Изучать инструмент нужно до раунда, а на нём время уходит на задачу и проверку.'], d:2},
   {t:'Прототип из Figma Make показал пользователям, что они не понимают шаг выбора тарифа. Что дальше?', o:['Сразу выделить рекомендуемый тариф цветом и считать проблему решённой без повторной проверки','Зафиксировать находку, переформулировать шаг и проверить снова, затем перенести решение в макеты','Передать прототип в разработку как есть, а шаг выбора тарифа доработать уже после релиза','Не делать выводов: прототип собран быстро, и в продакшен-версии проблема может исчезнуть'], c:1, e:['Визуальная правка без повторной проверки может не решить проблему понимания, а лишь замаскировать её.','Прототип нужен для итераций до разработки: нашли, исправили, перепроверили и перенесли в макеты.','Прототип не продакшен-код, а найденную проблему дешевле исправить до разработки, чем после релиза.','Найденная проблема и есть ценность прототипа, игнорировать её значит потерять смысл проверки.'], d:2},
   {t:'Разработчик на собесе спрашивает: «Вы вайб-кодите прототипы — значит, нам можно брать ваш код?». Какой ответ правильный?', o:['«Да, код рабочий и уже проверен на пользователях, его можно взять за основу и доработать по ходу»','«Нет: это прототип для проверки гипотез, без edge cases и доступности; в продакшен идёт ваша реализация»','«Можно взять отдельные компоненты, если они совпадают с дизайн-системой, а остальное лучше переписать с нуля»','«Это вопрос к техлиду: я отвечаю за дизайн, а как устроен код прототипа, для меня не так важно»'], c:1, e:['Проверка на пользователях подтверждает сценарий, а не качество кода, который не готов к продакшену.','Понимание границ прототипа и уважение к реализации разработчиков — то, что хотят услышать.','Даже совпадающие визуально компоненты прототипа обычно не имеют состояний, доступности и нужной архитектуры.','Дизайнер должен понимать, что он отдаёт команде, и уметь объяснить ограничения своего прототипа.'], d:3},
  ]},
]});
</script>
<script>
CH.push({id:'behavior', title:'Поведенческие вопросы, зарплата и оффер', lessons:[
 {id:'behavior-1', title:'Провалы, конфликты и слабости', ask:true,
  open:{q:'Расскажите о конфликте с продактом или разработчиком и как вы его разрешили.', hint:['STAR: ситуация, задача, действия, результат','Что сделали вы, а не «мы»','Чему научились и что изменили в подходе']},
  summary:[
   'STAR: Situation (контекст) → Task (ваша задача) → Action (что сделали вы) → Result (что вышло и чему научились). Две–три минуты, конкретика, без «мы».',
   'Про провал говорите честно, но с выводом: что изменили в подходе и как это проявилось в следующем проекте.',
   'Конфликт показывайте как расхождение целей, а не людей: «мы по-разному понимали приоритет», и решение — через данные, тест или компромисс с фиксацией рисков.',
   'Слабая сторона — реальная, рабочая и с планом: «Долго полирую первую идею — теперь ставлю таймер и делаю три направления до детализации».',
  ], q:[
   {t:'Какой ответ про слабую сторону звучит убедительно?', o:['«Я перфекционист»','«Слабостей нет»','«Не люблю людей»','«Раньше сразу уходил в детали первой идеи. Теперь на старте делаю 3 грубых направления и показываю команде до проработки»'], c:3, e:['Клише, которое все считывают.','Красный флаг.','Нет.','Реальная слабость и работающий план.'], d:1},
   {t:'Рассказывая о конфликте, кандидат долго описывает, какой плохой был продакт. Что чувствует интервьюер?', o:['Сочувствие','Опасение, что так же будут говорить о его команде','Интерес','Ничего'], c:1, e:['Нет.','Обвинения — красный флаг.','Нет.','Нет.'], d:1},
   {t:'Что в STAR чаще всего пропускают кандидаты?', o:['Ситуацию','Задачу','Результат и вывод','Ничего не пропускают'], c:2, e:['Обычно есть.','Обычно есть.','История обрывается на действии без результата и урока.','Пропускают.'], d:2},
   {t:'«Расскажите о ситуации, когда вы ошиблись в оценке сроков». Какой ответ сильнее?', o:['«Сроки всегда срывают разработчики»','«Обещал макеты за 3 дня без учёта согласований, сдал через 8; теперь закладываю время на ревью и называю срок после разговора с продактом и разработчиком»','«Такого не было»','«Один раз опоздал на 10 минут»'], c:1, e:['Обвинение.','STAR с выводом, который изменил подход.','Красный флаг.','Не про оценку сроков.'], d:2},
   {t:'Интервьюер: «Что бы о вас сказал ваш последний продакт?». Что ответить?', o:['«Что я лучший дизайнер»','Честную оценку с конкретикой: сильная сторона, которую он отмечал, и зона роста, над которой мы работали','«Не знаю, спросите его»','«Он бы промолчал»'], c:1, e:['Неправдоподобно.','Самооценка через чужие глаза показывает зрелость.','Уход от вопроса.','Нет.'], d:2},
   {t:'Вы рассказываете про конфликт: вы были правы, продакт настоял, фича провалилась. Как закончить историю, чтобы не выглядеть злорадствующим?', o:['«Я же говорил»','Выводом о себе: как в следующий раз лучше доносили риски до решения — данные, прототип, письменная фиксация','«Продакта уволили»','Промолчать про результат'], c:1, e:['Злорадство — красный флаг.','Урок о своём влиянии, а не о чужой ошибке.','Нет.','Результат нужен.'], d:3},
  ]},
 {id:'behavior-2', title:'Мотивация и вопросы интервьюеру', ask:true,
  open:{q:'Какие вопросы вы зададите интервьюеру в конце встречи и зачем?', hint:['Кто владеет дизайн-системой, как устроены исследования и критика','Как ставятся задачи и кто меряет результат','Что считается успехом на испытательном сроке']},
  summary:[

   {t:'Как подготовиться к вопросу «что думаете о нашем продукте»?', o:['Сказать, что продукт отличный','Пройти продукт как пользователь, найти 2–3 конкретных наблюдения и одну гипотезу улучшения','Прочитать отзывы в сторе','Промолчать'], c:1, e:['Пусто.','Конкретные наблюдения — сильнее слов о мотивации.','Полезно, но недостаточно.','Нет.'], d:1},

   {t:'Что спросить, чтобы понять, будет ли у дизайнера влияние в команде?', o:['«Какой у вас кофе?»','«Как принимаются решения по дизайну, и когда в последний раз дизайнер изменил продуктовое решение?»','«Сколько дизайнеров в компании?»','«Есть ли дресс-код?»'], c:1, e:['Нет.','Вопрос про реальную практику, а не декларации.','Число не говорит о влиянии.','Нет.'], d:2},
   {t:'«Где вы видите себя через два года?» Какой ответ лучше?', o:['«На вашем месте»','«Не думал об этом»','«Хочу вести направление или сложный продукт как мидл+/сеньор; для этого нужны задачи с метриками и исследованиями — у вас они есть»','«В другой компании»'], c:2, e:['Шутка, которая не всегда заходит.','Отсутствие планов.','Конкретное направление, связанное с вакансией.','Нет.'], d:2},
   {t:'Интервью окончено, вы задали 5 вопросов, ответы вас насторожили: нет исследований, решения принимает CEO, критики нет. Что делать?', o:['Промолчать и ждать оффер','Уточнить прямо: как компания видит роль дизайнера и планирует ли это менять; решать по ответу, а не по бренду','Отказаться сразу','Согласиться на всё'], c:1, e:['Так попадают в плохие места.','Вопросы интервьюеру защищают вас; используйте их до конца.','Можно, но сначала уточнить.','Нет.'], d:3},
  ]},
 {id:'behavior-3', title:'Зарплата и оффер', ask:true,
  open:{q:'Какие у вас зарплатные ожидания и как вы их обосновываете?', hint:['Вилка, а не одна цифра; опора на рынок и свой уровень','Что входит: оклад gross/net, бонусы, ДМС, формат','Готовность обсудить после понимания задач']},
  summary:[
   'Исследуйте рынок перед встречей: отфильтруйте активные вакансии на hh по городу, грейду и формату и возьмите вилку из 10–15 свежих вакансий — она меняется быстро, проверяйте накануне собеса.',
   'Называйте вилку, а не одну цифру, и опирайтесь на рынок и свой уровень. Нижняя граница — та, на которую вы реально готовы.',
   'Уточняйте состав оффера: оклад gross/net, премии, ДМС, оборудование, формат (офис/гибрид/удалёнка), испытательный срок и его критерии.',
   'Торг — нормальная часть процесса. Аргументы: рынок, альтернативные предложения, ваш измеримый вклад. Без ультиматумов.',

   {t:'HR спрашивает об ожиданиях по зарплате на первом звонке. Как ответить?', o:['«Сколько дадите»','Назвать вилку с опорой на рынок и уровень, уточнив, что готовы обсуждать после понимания задач','Назвать максимальную цифру без объяснений','Отказаться отвечать'], c:1, e:['Так вы отдаёте инициативу.','Вилка с обоснованием — норма.','Без аргументов выглядит случайно.','Затягивает процесс и раздражает.'], d:1},
   {t:'В оффере оклад ниже вашей вилки на 15%. Что сделать?', o:['Сразу отказаться','Сразу согласиться','Пожаловаться в соцсетях','Поблагодарить, уточнить состав (премии, пересмотр через полгода, ДМС) и аргументированно попросить пересмотреть цифру'], c:3, e:['Рано, есть поле для диалога.','Оставляете деньги на столе.','Нет.','Торг с аргументами — нормальная практика.'], d:2},
   {t:'Что означает «зарплата 200 000 gross»?', o:['На руки 200 000','До вычета НДФЛ: на руки меньше','Включая премии','Годовая сумма'], c:1, e:['Нет.','Gross — до налога.','Нет.','Нет.'], d:1},
   {t:'Откуда взять актуальную вилку для своей позиции?', o:['Из статьи двухлетней давности','Из 10–15 активных вакансий на hh с фильтром по городу, грейду и формату, плюс разговоры с коллегами','Спросить у HR на первом звонке','Из зарплаты друга'], c:1, e:['Устарело.','Актуальные источники и несколько точек.','HR не расскажет рынок.','Одна точка — не рынок.'], d:1},
   {t:'У вас два оффера: 180 000 с сильной командой и ростом, 220 000 без дизайн-процесса и с одним дизайнером на всё. Вы хотите расти до сеньора. Как рассуждать?', o:['Всегда брать больше денег','Оценить, что даёт рост: среда, ментор, процессы; попробовать поднять первый оффер аргументом второго; выбирать по цели на 2 года','Всегда брать команду','Подбросить монетку'], c:1, e:['Деньги без роста — потолок через год.','Решение через цель и честный торг.','Не всегда.','Нет.'], d:3},
   {t:'Что обязательно уточнить про испытательный срок?', o:['Ничего, это формальность','Длительность, критерии успеха, кто оценивает и когда будет обратная связь','Можно ли его пропустить','Будет ли премия за него'], c:1, e:['Нанимающие говорят: собес пройти проще, чем испытательный.','Критерии и обратная связь снижают риск несовпадения ожиданий.','Нет.','Нет.'], d:2},
  ]},
]});

<script>
CH.push({id:'job', title:'Как получить приглашение на собес', lessons:[
 {id:'job-1', title:'Резюме дизайнера, которое читают', ask:false,
  open:{q:'Перепишите один пункт из своего текущего резюме так, чтобы он показывал влияние, а не обязанность.', hint:['Начните с проблемы: что было не так у пользователя или бизнеса','Опишите, что сделали именно вы, а не команда в целом','Закончите результатом: цифра, если она реальная, или доказательство — тест, запуск, использование']},
  summary:[
   'Объём — одна-две страницы. Наверху заголовок с ролью и доменом, например «Продуктовый дизайнер, финтех», и сразу ссылка на портфолио с 3–5 кейсами.',
   'По каждому месту работы — 2–4 пункта о влиянии по схеме «проблема → что сделал → результат». Цифры только реальные, иначе доказательства: тесты, запуск, использование.',
   'Рекрутеры ищут по ключевым словам на hh и в ATS, поэтому берите формулировки из вакансии и адаптируйте резюме под каждую. Инструменты — одной строкой.',
   'Два года в одной компании — покажите рост зоны ответственности внутри неё. Не делайте резюме-картинку: фото и сложная вёрстка в PDF ломают распознавание текста.',
  ], q:[
   {t:'Какой пункт в резюме лучше всего показывает влияние дизайнера?', o:['«Переделал онбординг: по юзабилити-тестам пользователи стали реже застревать на шаге с документами»','«Отвечал за дизайн онбординга, личного кабинета и ряда внутренних сервисов компании»','«Работал в кросс-функциональной команде, тесно взаимодействовал с разработкой и аналитиками»','«Создавал макеты в Figma, вёл UI-кит и готовил спецификации для передачи в разработку»'], c:0, e:['Здесь есть проблема, конкретное действие и подтверждённый тестами результат.','Это перечень зон ответственности, из которого не видно, что изменилось благодаря вам.','Описание формата работы есть у любого дизайнера и не говорит о вашем вкладе.','Это список обязанностей и инструментов, а не результат вашей работы.'], d:1},
   {t:'Где в резюме разместить ссылку на портфолио?', o:['В конце, после образования и курсов, отдельным блоком','Только в сопроводительном письме, чтобы не перегружать резюме','В самом верху, рядом с заголовком и контактами','В описании последнего места работы, рядом с проектами'], c:2, e:['До конца документа рекрутер может не дочитать, и ссылка останется незамеченной.','Письмо читают не всегда, а резюме пересылают нанимающему менеджеру без него.','Портфолио — главный аргумент дизайнера, поэтому его должно быть видно сразу.','Внутри описания опыта ссылка теряется среди текста и её легко пропустить.'], d:1},
   {t:'У вас нет доступа к продуктовым метрикам. Как описать результат проекта?', o:['Поставить примерные проценты роста, раз их всё равно никто не проверит','Привести доказательства: итоги юзабилити-тестов, факт запуска, долю команд, принявших компонент','Написать «улучшил пользовательский опыт», не уточняя, в чём именно это выразилось','Убрать раздел с результатами и оставить только перечень выполненных задач по проекту'], c:1, e:['Выдуманные цифры легко вскрываются уточняющими вопросами на собеседовании.','Проверяемые факты показывают влияние даже без доступа к аналитике.','Общая формулировка без деталей ничего не сообщает о реальном вкладе.','Список задач превращает резюме в перечень обязанностей без видимого влияния.'], d:2},
   {t:'Зачем адаптировать резюме под конкретную вакансию?', o:['Чтобы скрыть часть опыта, который может показаться работодателю недостаточно сильным','Чтобы резюме выглядело по-новому при каждом отклике и выделялось среди остальных','Чтобы увеличить объём документа за счёт дополнительных пунктов под каждое требование','Чтобы ключевые слова совпадали с поиском рекрутера, а нужный опыт был наверху'], c:3, e:['Скрывать опыт не нужно: задача адаптации — расставить акценты, а не умалчивать.','Новизна оформления не влияет на решение рекрутера, важна релевантность.','Раздувание объёма мешает: резюме должно оставаться на одну-две страницы.','Поиск на hh и фильтры ATS работают по словам, а рекрутер читает первые строки.'], d:2},
   {t:'Вы два года работаете в одной компании. Как показать рост в резюме?', o:['Перечислить все проекты за два года одним списком в хронологическом порядке','Указать только последнюю должность, чтобы не акцентировать внимание на стаже','Разбить опыт на этапы и показать, как расширялась зона: от фичи к целому сценарию','Добавить побольше курсов и сертификатов, чтобы компенсировать работу в одном месте'], c:2, e:['Длинный список без структуры не показывает, как менялся уровень задач.','Скрывая путь, вы теряете самый сильный аргумент — рост ответственности.','Этапы с растущей зоной наглядно показывают развитие внутри одной компании.','Курсы не заменяют доказательств роста на реальных продуктовых задачах.'], d:2},
   {t:'Вы сделали красивое резюме в PDF: две колонки, иконки навыков, фото, текст в кривых. Чем это грозит?', o:['Ничем: дизайнеру визуальное резюме только добавляет очков в глазах рекрутера','Распознавание текста сломается, и резюме не найдут поиском по ключевым словам','Рекрутер решит, что вы графический, а не продуктовый дизайнер, и только','Файл будет слишком тяжёлым для отправки через форму отклика на сайте компании'], c:1, e:['Оценивают содержание и портфолио, а сложная вёрстка мешает его прочитать.','Парсер hh и ATS не читает текст в кривых и путается в колонках, ключевых слов не будет.','Такое впечатление возможно, но главная проблема — текст не попадает в поиск.','Вес файла редко становится проблемой, в отличие от нечитаемого текста.'], d:3},
  ]},
 {id:'job-2', title:'Профиль на hh и сопроводительное письмо', ask:false,
  open:{q:'Напишите сопроводительное письмо к вакансии продуктового дизайнера в сервисе, которым вы пользуетесь.', hint:['Начните с того, почему именно этот продукт и эта команда','Добавьте 1–2 результата, связанных с их задачами, и ссылку на самый близкий кейс','Закончите наблюдением или вопросом об их продукте — это показывает, что вы разобрались']},
  summary:[
   'Профиль на hh: понятный заголовок и желаемая должность, теги навыков из вакансий, короткий блок «О себе». Зарплату можно указать или оставить пустой — оба варианта рабочие, но пустое поле не отсекает вас фильтрами.',
   'Кроме hh, заведите профиль на Хабр Карьере, а для международных компаний — в LinkedIn. Везде одна роль и одна ссылка на портфолио.',
   'Сопроводительное письмо — 5–7 предложений: почему эта компания, 1–2 результата по теме, ссылка на релевантный кейс, наблюдение о продукте. Шаблон узнаётся сразу.',
   'Рекомендация часто работает лучше холодного отклика: спросите бывших коллег, загляните в дизайн-сообщества и телеграм-каналы с вакансиями. Рекрутерам отвечайте быстро и по делу.',
  ], q:[
   {t:'Какой заголовок профиля на hh лучше всего работает для поиска?', o:['«Дизайнер интерфейсов»','«Продуктовый дизайнер (UX/UI), e-commerce»','«Креативный специалист с горящими глазами»','«Дизайнер / иллюстратор / моушен / SMM»'], c:1, e:['Слишком общее слово: под него попадает графический, интерьерный и любой другой дизайн.','Роль, ключевые слова и домен совпадают с тем, как рекрутер ищет кандидатов.','Рекрутеры не ищут по таким словам, и роль из заголовка не понятна.','Набор разных ролей размывает фокус и выглядит как поиск любой работы.'], d:1},
   {t:'Сколько должно быть в сопроводительном письме?', o:['Одна фраза «Добрый день, прошу рассмотреть моё резюме на вакансию»','Около страницы с подробным рассказом о каждом проекте и о себе','Только ссылка на портфолио без текста, чтобы не тратить время рекрутера','Пять-семь предложений: мотивация, 1–2 результата, кейс и наблюдение'], c:3, e:['Такое письмо ничего не добавляет к резюме и выглядит как массовый отклик.','Длинный текст не дочитывают: подробности есть в резюме и портфолио.','Без пары предложений непонятно, почему вы выбрали именно эту вакансию.','Короткое письмо по делу читается быстро и показывает, что вы разобрались.'], d:1},
   {t:'Что лучше всего показывает в письме, что вы изучили продукт компании?', o:['Конкретное наблюдение о сценарии в их приложении и вопрос о том, как они его решают','Фраза о том, что вы давно следите за компанией и цените её ценности и миссию','Перечисление всех продуктов компании и даты её основания из раздела «О нас»','Комплимент интерфейсу приложения и обещание сделать его ещё красивее и удобнее'], c:0, e:['Конкретика по сценарию показывает, что вы пользовались продуктом и думаете о нём.','Общие слова о ценностях пишут все, они не доказывают знакомства с продуктом.','Факты из раздела «О нас» показывают, что вы читали сайт, а не разбирались в продукте.','Обещание «сделать красивее» без конкретики звучит поверхностно и неуважительно к команде.'], d:2},
   {t:'Нужно ли заполнять поле зарплаты в профиле на hh?', o:['Обязательно, иначе рекрутеры вообще не увидят ваше резюме в поиске','Никогда: указанная сумма всегда работает против кандидата на переговорах','Можно оставить пустым, чтобы не выпадать из фильтров; сумму обсудить в переписке','Лучше указать заметно ниже рынка, чтобы получать больше приглашений'], c:2, e:['Резюме без зарплаты тоже находят в поиске, это поле не обязательное.','Иногда указанная сумма полезна — она отсекает неподходящие предложения.','Пустое поле не отсекает фильтрами, а сумму вы назовёте, когда поймёте задачи.','Заниженная сумма закрепляет низкий якорь и мешает потом на переговорах.'], d:2},
   {t:'Рекрутер пишет вам в телеграм о вакансии, которая вам не подходит. Как лучше ответить?', o:['Не отвечать: если вакансия неинтересна, тратить время на такую переписку незачем','Коротко поблагодарить, объяснить, что ищете, и попросить иметь вас в виду','Согласиться на собеседование, чтобы потренироваться, и отказаться в конце','Попросить сразу назвать максимальную зарплату, а потом уже решить'], c:1, e:['Молчание обрывает контакт, а этот рекрутер может вести и подходящие вакансии.','Вежливый ответ с вашими критериями превращает рекрутера в источник вакансий.','Так вы тратите время команды и портите себе репутацию на небольшом рынке.','Без интереса к вакансии вопрос о зарплате выглядит потребительски.'], d:2},
   {t:'Вы давно не искали работу. Как получить рекомендацию в нужную компанию?', o:['Найти сотрудников компании в соцсетях и попросить порекомендовать вас без личного знакомства','Ждать, пока кто-то из знакомых сам предложит вакансию, и не отвлекать людей','Написать в общий чат сообщества просьбу порекомендовать вас в любую компанию','Написать бывшим коллегам и знакомым из сообществ, где они работают, и попросить совета'], c:3, e:['Незнакомому человеку сложно рекомендовать того, чью работу он не видел.','Пассивное ожидание редко работает: люди не знают, что вы ищете работу.','Размытая просьба без конкретной компании и роли почти никогда не срабатывает.','Знакомые знают вашу работу, и разговор о совете часто превращается в рекомендацию.'], d:3},
  ]},
 {id:'job-3', title:'Поиск: какие вакансии выбирать и как вести воронку', ask:false,

   'Откликайтесь волнами по 15–30 релевантных вакансий, а не на 200 сразу: так проще адаптировать резюме и понять, что работает.',

   'Закладывайте на поиск 4–8 недель. Собеседуйтесь в ранние или поздние слоты, берите отгулы, не сообщайте текущему работодателю до оффера и старайтесь собрать офферы к одним срокам.',
  ], q:[
   {t:'Какая фраза в вакансии — зелёный флаг для продуктового дизайнера?', o:['«Проводим исследования с пользователями, развиваем дизайн-систему»','«Ищем дизайнера, который будет отрисовывать макеты по ТЗ менеджера»','«Нужен дизайнер на всё: сайт, приложение, баннеры, презентации»','«Динамичная среда, много задач, быстрые дедлайны и свобода действий»'], c:0, e:['Исследования и дизайн-система говорят о зрелом дизайн-процессе в команде.','Работа по ТЗ означает, что дизайнер не участвует в продуктовых решениях.','Один дизайнер на все задачи — признак нехватки ресурсов и отсутствия фокуса.','Такие слова ничего не говорят о процессе и часто маскируют хаос в команде.'], d:1},
   {t:'Как лучше организовать отклики, если вы начинаете поиск?', o:['Откликнуться сразу на 200 вакансий, чтобы получить как можно больше ответов','Откликаться только в одну компанию мечты и ждать её решения, прежде чем идти дальше','Отправлять волнами по 15–30 релевантных откликов и смотреть, что срабатывает','Откликаться только на вакансии, которые пришли от рекрутеров в личные сообщения'], c:2, e:['Массовый отклик без адаптации даёт мало ответов и не показывает, что нужно исправить.','Одна компания — слишком большой риск: процесс может затянуться или закончиться отказом.','Волны позволяют адаптировать резюме и по ответам понять, где слабое место.','Так вы пропускаете большинство подходящих вакансий на открытом рынке.'], d:1},
   {t:'Вы отправили 25 откликов и получили два ответа. Что исправлять в первую очередь?', o:['Готовиться к тестовым заданиям, потому что дальше будут сложные этапы','Расширить поиск на все вакансии со словом «дизайнер» без фильтрации по домену','Ждать: на рынке сейчас мало вакансий, и проблема явно не в вас','Резюме и первые экраны портфолио: на этапе первичного отбора смотрят именно их'], c:3, e:['Подготовка к следующим этапам не поможет, если вы до них не доходите.','Нерелевантные отклики только снизят долю ответов и отнимут время.','Без проверки резюме и портфолио вы не узнаете, где именно теряете отклики.','Низкая доля ответов говорит о проблеме на входе воронки, то есть в резюме и портфолио.'], d:2},
   {t:'Вас регулярно приглашают, но отказывают после показа портфолио. Что это значит?', o:['Резюме слабое, его нужно полностью переписать с нуля','Кейсы не убеждают: нужно усилить структуру, роль и результаты','Проблема в зарплатных ожиданиях, их надо срочно снизить','Вам просто не везёт, стоит увеличить количество откликов'], c:1, e:['Резюме работает: раз вас зовут на собеседования, проблема на следующем этапе.','Отказы на этапе портфолио указывают на кейсы: роль, логика решений, результат.','Зарплату обычно обсуждают раньше, и отказ после портфолио с ней не связан.','Больше откликов приведут к тем же отказам, если не исправить кейсы.'], d:2},
   {t:'Как проходить собеседования, если вы пока работаете?', o:['Сразу предупредить руководителя, что ищете работу, чтобы быть честным','Проводить собеседования в рабочее время, отлучаясь с созвонов команды','Брать ранние или поздние слоты и отгулы, а о поиске молчать до оффера','Уволиться заранее, чтобы целиком сосредоточиться на поиске'], c:2, e:['Раннее объявление может испортить отношения, если оффер так и не появится.','Срывать рабочие встречи — риск для репутации и отношений в команде.','Так вы сохраняете текущую работу и спокойно проходите этапы.','Без дохода поиск превращается в стресс и ослабляет позицию на переговорах.'], d:2},
   {t:'Одна компания дала оффер со сроком ответа три дня, вторая ещё на финальном этапе. Что разумнее?', o:['Принять первый оффер сразу, чтобы его не отозвали, а вторую компанию предупредить потом','Отказаться от первого оффера и полностью сосредоточиться на компании, которая нравится больше','Попросить первую компанию подождать неделю, второй сообщить об оффере и попросить ускориться','Ничего не говорить ни одной компании и дождаться, пока ситуация решится сама собой'], c:2, e:['Поспешное согласие лишает вас выбора, а отказ после принятия оффера портит репутацию.','Отказ без альтернативы оставляет вас ни с чем, если вторая компания не сделает оффер.','Честная просьба о сроках — обычная практика и помогает собрать офферы к одной дате.','Молчание приведёт к тому, что первый срок истечёт, а вторая компания не узнает о спешке.'], d:3},
  ]},
]});
</script>
<script>
// ---------- state ----------
const KEY = 'midl-sobes-v2';
let S = { setup:null, progress:{}, q:{}, wrong:{}, days:{}, daily:null, practice:[], mocks:[], custom:[], stories:{}, cvs:[], tasks:[], updatedAt:0 };
let db=null, dbDoc=null, uid=null, sampleFn=null, aiReady=false;
let L=null, ONB=null, dbTimer=null, dbChain=Promise.resolve();

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoOf = d => { const x=new Date(d); x.setHours(0,0,0,0); const off=x.getTimezoneOffset(); return new Date(x.getTime()-off*60000).toISOString().slice(0,10); };
const todayISO = () => isoOf(new Date());
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return isoOf(d); };
const daysUntil = iso => { if(!iso) return null; const a=new Date(todayISO()+'T00:00:00'); const b=new Date(iso+'T00:00:00'); return Math.round((b-a)/86400000); };
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const fmtDate = iso => { const d=new Date(iso+'T00:00:00'); return `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const plural = (n,a,b,c) => { const m=n%100, k=n%10; return m>=11&&m<=14?c:k===1?a:k>=2&&k<=4?b:c; };
const dayWord = n => `${n} ${plural(n,'день','дня','дней')}`;
const lessonWord = n => `${n} ${plural(n,'урок','урока','уроков')}`;
const qWord = n => `${n} ${plural(n,'вопрос','вопроса','вопросов')}`;
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; };

function migrate(o){ if(Array.isArray(o.days)){ const d={}; o.days.forEach(x=>d[x]=1); o.days=d; } if(o.wrong){ for(const k of Object.keys(o.wrong)){ if(typeof o.wrong[k]==='number') o.wrong[k]={n:o.wrong[k],streak:0,at:0}; } } return o; }
function loadLocal(){ try{ let raw=localStorage.getItem(KEY); if(!raw){ const old=localStorage.getItem('midl-sobes-v1'); if(old){ const o=JSON.parse(old); if(o?.setup){ o.setup.pace=o.setup.pace||2; } raw=JSON.stringify(o); } } if(raw){ const o=JSON.parse(raw); if(o&&typeof o==='object') S={...S,...migrate(o)}; } }catch(e){} }
function persistLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function pushDb(){ if(!dbDoc) return; clearTimeout(dbTimer); dbTimer=setTimeout(()=>{ const body=JSON.parse(JSON.stringify(S)); dbChain=dbChain.then(()=>dbDoc.set(body)).catch(()=>{}); },700); }
function save(){ S.updatedAt=Date.now(); persistLocal(); pushDb(); }

// ---------- derived ----------
const allChapters = () => CH.concat(S.custom||[]);
const chapterOf = lid => allChapters().find(c=>c.lessons.some(l=>l.id===lid));
const chapterById = id => allChapters().find(c=>c.id===id);
const lessonById = lid => { for(const c of allChapters()){ const l=c.lessons.find(x=>x.id===lid); if(l) return l; } return null; };
const isAsk = l => l.id.startsWith('custom-') ? true : ASK.has(l.id);
const target = () => TARGETS.find(t=>t.id===(S.setup?.target||2)) || TARGETS[1];
const focusIds = () => { const set=new Set(); (S.setup?.pains||[]).forEach(p=>{ const pp=PAINS.find(x=>x.id===p); pp&&pp.ch.forEach(c=>set.add(c)); }); return set; };
function orderedChapters(){ const f=focusIds(); const base=ORDER.map(id=>CH.find(c=>c.id===id)).filter(Boolean); const focus=base.filter(c=>f.has(c.id)), rest=base.filter(c=>!f.has(c.id)); return (S.custom||[]).concat(focus,rest); }
const chapterOpens = c => (c.open||[]).concat(c.lessons.map(l=>l.open).filter(Boolean));
const allLessons = () => orderedChapters().flatMap(c=>c.lessons);
const lessonDone = l => !!S.progress[l.id]?.passed;
const doneCount = () => allLessons().filter(lessonDone).length;
const remaining = () => allLessons().filter(l=>!lessonDone(l));
const perDay = () => Math.max(1, Math.min(4, S.setup?.pace || 2));
const todayCount = () => S.days[todayISO()]||0;
const dLeft = () => S.setup?.date ? daysUntil(S.setup.date) : null;
const finalDays = () => { const d=dLeft(); return d!==null && d<=3 && d>=0 && doneCount()>0; };
const lessonMinutes = l => Math.max(3, Math.round(1 + sampleSize(l) * 0.9));
function sampleSize(l){ const t=target(); const pool=l.q.filter(q=>(q.d||1)<=t.maxD); return Math.min(t.n, pool.length); }
function streak(){ let n=0; for(let i=0;i<400;i++){ const d=addDays(-i); if(S.days[d]) n++; else if(i===0) continue; else break; } return n; }
function accuracy(){ let c=0,t=0; Object.values(S.q).forEach(p=>{c+=p.ok;t+=p.n;}); return t?Math.round(100*c/t):null; }
const wrongList = () => Object.entries(S.wrong||{}).map(([qid,w])=>{ const [lid,idx]=qid.split('#'); const l=lessonById(lid); const q=l&&l.q[+idx]; return q?{qid,lid,q,lesson:l,w}:null; }).filter(Boolean).sort((a,b)=>(a.w.at||0)-(b.w.at||0));

// pick n questions from a lesson for the current target; shuffle options
function sampleQs(l){
  const t=target(); const pool=l.q.map((q,i)=>({...q, qid:l.id+'#'+i})).filter(q=>(q.d||1)<=t.maxD);
  let pick=[]; const byD=d=>shuffle(pool.filter(q=>(q.d||1)===d));
  if(t.id>=3 && byD(3).length) pick.push(byD(3)[0]);
  if(t.id>=2 && byD(2).length) pick.push(byD(2)[0]);
  const rest=shuffle(pool.filter(q=>!pick.includes(q)));
  while(pick.length<t.n && rest.length) pick.push(rest.shift());
  return shuffle(pick).map(prepQ);
}
function prepQ(q){ const perm=shuffle([0,1,2,3]); return {...q, o:perm.map(i=>q.o[i]), e:perm.map(i=>q.e[i]), c:perm.indexOf(q.c), oc:q.c}; }
const qById = qid => { const [lid,idx]=qid.split('#'); const l=lessonById(lid); const q=l&&l.q[+idx]; return q?{...q,qid}:null; };

// ---------- routing ----------
function go(h){ if(location.hash!==('#'+h)) location.hash=h; else render(); }
function route(){ const h=(location.hash||'').replace(/^#/,''); if(!S.setup && h!=='setup') return {v:'setup'}; const [v,...rest]=h.split('-'); const id=rest.join('-'); if(['lesson','topic','story'].includes(v)&&id) return {v,id}; if(['setup','plan','topics','review','review_run','daily','practice','vacancy','mock','mock_run','stories','stories_run','cv','tasks','task_run'].includes(h)) return {v:h}; return {v:'deck'}; }
window.addEventListener('hashchange', ()=>{ const r=route(); if(!['lesson','review_run','daily','topic','mock_run'].includes(r.v)) L=null; stopTimer(); render(); });

// ---------- shared ----------
const mentor = text => `<div class="mentor"><div class="ava">${I.mentor}</div><div class="bubble">${text}</div></div>`;
const topbar = (back, pct, meta, cls) => `<div class="top"><button class="iconbtn" data-act="${back}" aria-label="${back==='exit'?'Выйти':'Назад'}">${back==='exit'?I.close:I.back}</button><div class="hair" aria-hidden="true"><i class="${cls||''}" style="width:${pct}%"></i></div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;
const weekRow = () => { const cells=[]; for(let i=6;i>=0;i--){ const d=addDays(-i); const dt=new Date(d+'T00:00:00'); const on=!!S.days[d]; cells.push(`<span class="d ${on?'on':''} ${i===0?'today':''}" title="${d}">${on?I.check:WD[dt.getDay()]}</span>`); } return `<div class="week" aria-label="Последняя неделя">${cells.join('')}</div>`; };

// ---------- onboarding ----------
function startOnb(){ const s=S.setup; ONB={ step:0, preset:s?(s.date?'custom':'none'):null, date:s?.date||null, pace:s?.pace||null, target:s?.target||null, pains:(s?.pains||[]).slice(), vac:'' }; if(s?.date){ ONB.preset='custom'; } }
function paceOptions(days){ const total=allLessons().length - doneCount(); const need=days?Math.max(1,Math.min(4,Math.ceil(total/days))):1; const opts=[]; const mk=(k,name)=>{ const fin=Math.ceil(total/k); let s; if(!days) s=`${k} в день · весь план за ${dayWord(fin)}`; else if(fin<=days) s=`${k} в день · весь план за ${dayWord(fin)}, запас ${dayWord(days-fin)} на повтор`; else s=`${k} в день · до собеса успеете ${Math.round(100*Math.min(1,(k*days)/total))}% плана`; return {k,name,s,rec:k===need}; }; const ks=[...new Set([Math.max(1,need-1),need,Math.min(4,need+1)])]; const names=['Спокойно','В темпе','Интенсив']; ks.forEach((k,i)=>opts.push(mk(k,ks.length===3?names[i]:k<need?'Спокойно':k===need?'В темпе':'Интенсив'))); return opts; }
function renderSetup(){
  if(!ONB) startOnb();
  const o=ONB, steps=5, pct=Math.round(100*(o.step+1)/steps);
  let body='', foot='';
  if(o.step===0){
    const d=o.date?daysUntil(o.date):null;
    body=`<div class="onb-title"><h1>Когда собес?</h1><p class="muted">Разложим уроки так, чтобы успеть</p></div>
      <div class="goals">${DATE_PRESETS.map(p=>`<button class="goal" aria-pressed="${o.preset===p.id}" data-act="onb-preset" data-arg="${p.id}"><div><b>${p.t}</b><span>${p.d?`≈ ${dayWord(p.d)}`:'план без дедлайна, 1 урок в день'}</span></div><span class="chk">${I.check}</span></button>`).join('')}</div>
      <div class="row" style="justify-content:center"><label class="small muted" for="exact">Точная дата</label><input type="date" id="exact" min="${addDays(0)}" value="${o.preset==='custom'&&o.date?o.date:''}" data-act="onb-date"></div>
      ${o.preset&&o.preset!=='none'&&o.date?`<div class="bignum"><b class="mono">${d}</b><span>${plural(d,'день','дня','дней')}</span><div class="when">Собес — ${fmtDate(o.date)}</div></div>`:o.preset==='none'?`<div class="bignum"><b class="mono">—</b><span>дату можно добавить позже в настройках</span></div>`:''}`;
    foot=`<button class="btn primary wide" data-act="onb-next" ${o.preset?'':'disabled'}>Дальше</button>`;
  } else if(o.step===1){
    const days=o.date?Math.max(1,daysUntil(o.date)):null; const opts=paceOptions(days);
    body=`<div class="onb-title"><h1>В каком темпе?</h1><p class="muted">${days?`До собеса ${dayWord(days)}, в плане ${lessonWord(allLessons().length-doneCount())} по 4–5 минут`:'Дедлайна нет — выберите, сколько уроков в день вам комфортно'}</p></div>
      <div class="goals" style="grid-template-columns:1fr">${opts.map(p=>`<button class="goal" aria-pressed="${o.pace===p.k}" data-act="onb-pace" data-arg="${p.k}">${p.rec?'<span class="rec">Рекомендуем</span>':''}<div><b>${p.name}</b><span>${p.s}</span></div><span class="chk">${I.check}</span></button>`).join('')}</div>`;
    foot=`<button class="btn primary wide" data-act="onb-next" ${o.pace?'':'disabled'}>Беру этот темп</button>`;
  } else if(o.step===2){
    const t=TARGETS.find(x=>x.id===o.target);
    body=`<div class="onb-title"><h1>На что вы целитесь?</h1><p class="muted">Под это настроим сложность вопросов и порог зачёта</p></div>
      <div class="goals">${TARGETS.map(t=>`<button class="goal" aria-pressed="${o.target===t.id}" data-act="onb-target" data-arg="${t.id}">${t.rec?'<span class="rec">Рекомендуем</span>':''}<div><b>${t.t}</b><span>${t.s}</span></div><span class="chk">${I.check}</span></button>`).join('')}</div>
      ${t?mentor(t.id===4?'Самый строгий режим: без письменного ответа урок не засчитается.':t.id===3?'Строго: одна ошибка — и урок на повтор. Зато на собесе будет легче.':t.id===1?'Начнём с базы. Уровень можно поднять в настройках.':'Хороший баланс: сложные вопросы будут, но одна ошибка не сорвёт зачёт.'):''}`;
    foot=`<button class="btn primary wide" data-act="onb-next" ${o.target?'':'disabled'}>Дальше</button>`;
  } else if(o.step===3){
    const full=o.pains.length>=3;
    body=`<div class="onb-title"><h1>Где обычно застреваете?</h1><p class="muted">Выберите до 3 — соберём план вокруг этих тем</p></div>
      <div class="tiles">${PAINS.map(p=>{const on=o.pains.includes(p.id);return `<button class="tile" aria-pressed="${on}" data-act="onb-pain" data-arg="${p.id}" ${!on&&full?'disabled':''}>${ICONS[p.id]}<span>${p.t}</span><span class="chk">${I.check}</span></button>`;}).join('')}</div>`;
    foot=`<button class="btn primary wide" data-act="onb-next">${o.pains.length?`Дальше · ${o.pains.length}/3`:'Пропустить'}</button>`;
  } else {
    body=`<div class="onb-title"><h1>Есть вакансия?</h1><p class="muted">Вставьте текст — вытащим темы, которые спросят именно там, и соберём отдельный урок с вопросами под неё.</p></div>
      <label class="sr" for="vac">Текст вакансии</label>
      <textarea id="vac" class="ans" placeholder="Например: Ищем middle продуктового дизайнера в команду платежей. Ожидаем: работа с метриками, CustDev, дизайн-система…" data-act="onb-vac">${esc(o.vac)}</textarea>
      ${aiReady?'<p class="note">Текст уйдёт Claude. Уберите из него личные данные, если они там есть.</p>':'<p class="note">Разбор вакансии делает Claude внутри claude.ai. Если он недоступен, урок по вакансии можно добавить позже с главной.</p>'}`;
    foot=`<button class="btn primary wide" data-act="onb-finish" data-arg="${o.vac.trim().length>40?'vac':''}">${o.vac.trim().length>40?'Собрать план по вакансии':'Собрать план'}</button><button class="linkbtn" data-act="onb-finish" style="justify-self:center">Пропустить, добавлю позже</button>`;
  }
  return `${topbar(o.step?'onb-back':'onb-cancel',pct,'')}<div class="stack fade">${body}</div><div class="actions">${foot}</div>`;
}
function finishOnb(withVac){
  const o=ONB; S.setup={ date:o.preset==='none'?null:o.date, pace:o.pace||2, target:o.target||2, pains:o.pains.filter(p=>p!=='any') }; save();
  const vac=withVac?o.vac.trim():''; ONB=null; L=null; renderBuilding(vac);
}
function renderBuilding(vac){
  const app=document.getElementById('app'); const s=S.setup; const d=s.date?daysUntil(s.date):null;
  const focus=[...focusIds()].map(id=>chapterById(id)?.title).filter(Boolean);
  const steps=[`Считаю темп: ${perDay()} в день${d?` на ${dayWord(d)}`:''}`, focus.length?`Ставлю первыми: ${focus.slice(0,2).join(', ')}${focus.length>2?'…':''}`:'Раскладываю 11 тем по порядку', `Настраиваю уровень: ${target().t.toLowerCase()}`, vac?'Читаю вакансию и собираю урок под неё':'Собираю план'];
  const echo=`<div class="echo"><span>Собес: <b>${d!==null?`через ${dayWord(d)}, ${fmtDate(s.date)}`:'дата не указана'}</b></span><span>Цель: <b>${esc(target().t)}</b></span><span>Темы в фокусе: <b>${focus.length?esc(focus.join(', ')):'все понемногу'}</b></span><span>Вакансия: <b>${vac?'добавлена':'нет'}</b></span></div>`;
  app.innerHTML=`<div class="stack fade" style="padding-top:28px;text-align:center;justify-items:center">
    <div class="ava" style="width:72px;height:72px">${I.mentor.replace('viewBox="0 0 40 40"','viewBox="0 0 40 40" style="width:72px;height:72px"')}</div>
    <h2>Собираю программу…</h2>${echo}
    <div class="mono" id="bpct" style="font-size:28px;font-weight:700">0%</div>
    <ul class="summary" id="bsteps" style="text-align:left;min-width:min(100%,340px)">${steps.map(s=>`<li class="muted">${esc(s)}</li>`).join('')}</ul>
    <div id="bdone" hidden><button class="btn primary" data-act="exit">Открыть план</button></div></div>`;
  let i=0; const li=app.querySelectorAll('#bsteps li'); const pct=app.querySelector('#bpct');
  const finish=()=>{ pct.textContent='100%'; app.querySelector('#bdone').hidden=false; };
  const tick=setInterval(()=>{ i++; li.forEach((el,k)=>el.classList.toggle('muted',k>=i)); pct.textContent=Math.min(vac?90:100,Math.round(100*i/steps.length))+'%'; if(i>=steps.length){ clearInterval(tick); if(vac){ generateVacancyLesson(vac,true).finally(finish); } else finish(); } },550);
}
</script>
<script>
// ---------- daily review builder ----------
function buildDaily(){
  const t=todayISO(); if(S.daily && S.daily.date===t) return;
  const ids=[]; wrongList().slice(0,4).forEach(w=>ids.push(w.qid));
  const seen=Object.entries(S.q).filter(([qid,s])=>s.n>0 && !ids.includes(qid) && qById(qid)).sort((a,b)=>(a[1].last||0)-(b[1].last||0));
  for(const [qid] of seen){ if(ids.length>=6) break; ids.push(qid); }
  S.daily={date:t, qids: ids.length>=3?ids:[], done: ids.length<3}; save();
}
const dailyPending = () => S.daily && S.daily.date===todayISO() && !S.daily.done && S.daily.qids.length>=3;

// ---------- mastery ----------
function mastery(c){
  const qids=c.lessons.flatMap(l=>l.q.map((q,i)=>l.id+'#'+i)); let ok=0,n=0,last=0,att=0;
  qids.forEach(id=>{ const s=S.q[id]; if(s&&s.n){ ok+=s.ok; n+=s.n; att++; last=Math.max(last,s.last||0); } });
  const cov=c.lessons.filter(lessonDone).length/c.lessons.length; const acc=n?ok/n:0;
  const level= att===0?'none' : (acc<0.7||cov<0.5)?'weak' : 'strong';
  const value= att===0?0:Math.round(100*(0.5*cov+0.5*acc));
  const next= last? isoOf(new Date(last+(level==='strong'?5:2)*86400000)) : null;
  return {level,value,acc:Math.round(acc*100),cov:Math.round(cov*100),last,next,att};
}

// ---------- deck ----------
function mentorLine(){
  const d=dLeft(), done=doneCount(), rem=remaining().length, td=todayCount(), k=perDay();
  if(d!==null && d<0) return `Собес был ${fmtDate(S.setup.date)}. Обновите дату в настройках — или готовьтесь к следующему.`;
  if(d===0) return 'Собес сегодня. Не учите новое: пять минут на ошибки, два кейса вслух — и вперёд.';
  if(finalDays()) return `До собеса ${dayWord(d)}. Новое не учим: повтор ошибок и мок-интервью.`;
  if(!done && !td) return 'Поехали! Первый урок — пять минут, дальше по дорожке.';
  if(!rem) return 'Программа пройдена. Теперь — мок-интервью и повтор ошибок.';
  if(td>=k) return `План на сегодня выполнен. Хотите ещё — ниже есть «Повторить ошибки» и тренировка.`;
  return `${done} ${plural(done,'урок','урока','уроков')} позади. Сегодня ещё ${k-td} — и вы в графике.`;
}
function lessonRow(l, ch, isNext){
  const p=S.progress[l.id]; const done=lessonDone(l); const n=sampleSize(l);
  return `<button class="lesson ${done?'done':isNext?'next':''}" data-act="lesson" data-arg="${l.id}"><span class="dot">${done?I.check:I.book}</span><span class="body"><b>${esc(l.title)}</b><span>${isNext?'<span class="nx">Следующий</span> · ':''}${qWord(n)} · ~${lessonMinutes(l)} мин${isAsk(l)?' · <span class="ask">Спросят</span>':''}${ch?` · ${esc(ch.title)}`:''}</span></span>${p?`<span class="score">${p.score}/${p.total}${p.passed?'':' ·!'}</span>`:''}</button>`;
}
function renderDeck(tab){
  buildDaily();
  const d=dLeft(), rem=remaining(), k=perDay(), td=todayCount(), next=rem[0], wl=wrongList(), fin=finalDays();
  const tabs=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='deck'}" data-act="go" data-arg="deck">Сегодня</button><button role="tab" aria-selected="${tab==='plan'}" data-act="go" data-arg="plan">План</button><button role="tab" aria-selected="${tab==='topics'}" data-act="go" data-arg="topics">Темы</button></div>`;
  const head=`<div class="spread" style="padding-block:4px"><div class="eyebrow">Мидл-собес${S.setup.date?` · ${fmtDate(S.setup.date)}`:''}</div><button class="btn ghost sm" data-act="setup">Настройки</button></div>`;
  let body='';
  if(tab==='plan'){
    const focus=focusIds(); const nextId=next?.id;
    body=orderedChapters().map((c,ci)=>`<section class="chapter"><div class="chapter-head ${focus.has(c.id)?'focus':''}"><span class="n">${String(ci+1).padStart(2,'0')}</span><span class="t">${esc(c.title)}${focus.has(c.id)?' · ваш фокус':''}</span><span class="c">${c.lessons.filter(lessonDone).length}/${c.lessons.length}</span></div>${c.lessons.map(l=>lessonRow(l,null,l.id===nextId)).join('')}</section>`).join('')
      +`<details class="set"><summary>Сбросить прогресс</summary><p class="note" style="margin-block:8px">Удалит результаты уроков, ошибки и историю тренировок. Настройки и уроки по вакансиям останутся.</p><button class="btn bad sm" data-act="reset">Точно сбросить</button></details>`;
  } else if(tab==='topics'){
    const focus=focusIds();
    const items=orderedChapters().map(c=>({c,m:mastery(c)}));
    body=`<div class="stack tight"><p class="muted small">Карта тем: что не трогали, где шатко, где уверенно. Тап — потренировать тему.</p>${items.map(({c,m})=>`<button class="topic" data-act="topic" data-arg="${c.id}"><div class="spread"><b style="font-weight:600">${esc(c.title)}</b><span class="tag ${m.level==='strong'?'good':m.level==='weak'?'warn':''}">${m.level==='strong'?'Уверенно':m.level==='weak'?'Шатко':'Не трогали'}</span></div><div class="bar"><i class="${m.level}" style="width:${Math.max(4,m.value)}%"></i></div><div class="meta"><span>${m.att?`точность ${m.acc}% · уроков ${m.cov}%`:'пока без ответов'}</span><span>${focus.has(c.id)?'вы отметили · ':''}${m.next?`повтор ${m.next<=todayISO()?'сегодня':fmtDate(m.next)}`:''}</span></div></button>`).join('')}</div>`;
  } else {
    const minutes = next ? Math.max(0,k-td)*lessonMinutes(next) : 0;
    const title = d===null?'План без дедлайна': d<0?`Собес был ${dayWord(-d)} назад`: d===0?'Собес сегодня': `До собеса ${dayWord(d)}`;
    const sub = fin?'Финальные дни: повтор и репетиция вместо новых уроков':rem.length?`Сегодня ${Math.min(td,k)}/${k} ${plural(k,'урок','урока','уроков')}${td<k?` · ~${minutes} мин`:' · готово'}`:'Все уроки пройдены';
    const cta = fin||!next ? `<button class="btn primary wide col" data-act="mock"><span>Мок-интервью</span><span class="sub">8 вопросов + 2 ответа на время · ~15 мин</span></button>` : `<button class="btn primary wide col" data-act="lesson" data-arg="${next.id}"><span>${td>=k?'Ещё урок':'Начать'}: ${esc(next.title)}</span><span class="sub">${qWord(sampleSize(next))} · ~${lessonMinutes(next)} мин</span></button>`;
    const st=streak();
    const today = fin ? [
        `<button class="card-cta" data-act="mock"><span class="ico">${I.mic}</span><span class="body"><b>Мок-интервью</b><span>Смешанные вопросы и два ответа на время</span></span></button>`,
        storiesReady()?`<button class="card-cta" data-act="stories_run"><span class="ico">${I.doc}</span><span class="body"><b>Репетиция историй · ${storiesReady()}</b><span>Ваши истории вслух под таймер · ~${storiesReady()*3} мин</span></span></button>`:`<button class="card-cta" data-act="stories"><span class="ico">${I.doc}</span><span class="body"><b>Подготовьте истории</b><span>О себе, главный кейс, ошибка — минимум</span></span></button>`,
        wl.length?`<button class="card-cta" data-act="review"><span class="ico">${I.repeat}</span><span class="body"><b>Разобрать ошибки · ${wl.length}</b><span>~${Math.max(2,Math.round(Math.min(8,wl.length)*0.8))} мин</span></span></button>`:'',
        dailyPending()?`<button class="card-cta" data-act="daily"><span class="ico">${I.repeat}</span><span class="body"><b>Повтор дня · ${qWord(S.daily.qids.length)}</b><span>~${Math.round(S.daily.qids.length*0.7)} мин</span></span></button>`:''
      ].join('') : [
        dailyPending()?`<button class="card-cta" data-act="daily"><span class="ico">${I.repeat}</span><span class="body"><b>Повтор дня · ${qWord(S.daily.qids.length)}</b><span>${dailyTopics()} · ~${Math.round(S.daily.qids.length*0.7)} мин</span></span></button>`:'',
        rem.slice(0,k).map((l,i)=>lessonRow(l,chapterOf(l.id),i===0)).join('')
      ].join('');
    body=`<div class="sheet stack"><div class="hero"><h1>${title}</h1><p class="muted">${sub}</p>${cta}</div>
      <div class="spread">${weekRow()}<span class="small muted">${st?`серия ${dayWord(st)}`:'пройдите урок — начнётся серия'}${d&&d>0&&st?` · цель ${dayWord(d)} до собеса`:''}</span></div>
      ${mentor(mentorLine())}</div>
      ${today?`<div class="stack tight"><div class="eyebrow">Сегодня</div><div class="today">${today}</div></div>`:''}
      <div class="stack tight"><div class="eyebrow">Практика</div><div class="tools">
        <button class="tool" data-act="stories"><b>Мои истории</b><span>${storiesReady()?`готово ${storiesReady()} из 6`:'6 историй на вашем материале'}</span></button>
        <button class="tool" data-act="tasks"><b>Задача на время</b><span>${(S.tasks||[]).length?`решено: ${S.tasks.length}`:'25 минут и защита решения'}</span></button>
        <button class="tool" data-act="mock"><b>Мок-интервью</b><span>${S.mocks?.length?`лучший ${Math.max(...S.mocks.map(m=>m.score))}/8`:'Проверка под таймер'}</span></button>
        <button class="tool" data-act="practice"><b>Тренировка ответов</b><span>Открытые вопросы${aiReady?' с разбором':''}</span></button>
      </div></div>
      <div class="stack tight"><div class="eyebrow">Инструменты</div><div class="tools">
        <button class="tool" data-act="review"><b>Ошибки ${wl.length?`<span class="badge">${wl.length}</span>`:''}</b><span>${wl.length?'Вопросы, где вы ошибались':'Пока нет ошибок'}</span></button>
        <button class="tool" data-act="cv"><b>Разбор резюме</b><span>Резюме, кейс или письмо глазами лида</span></button>
        <button class="tool" data-act="vacancy"><b>Урок по вакансии</b><span>${(S.custom||[]).length?`собрано: ${S.custom.length}`:'Вопросы под конкретную вакансию'}</span></button>
      </div></div>
      <div class="statline"><span>уроков <b>${doneCount()}/${allLessons().length}</b></span><span>точность <b>${accuracy()===null?'—':accuracy()+'%'}</b></span><span>ошибок в банке <b>${wl.length}</b></span><span>цель <b>${esc(target().t)}</b></span></div>`;
  }
  return `<div class="stack fade">${head}${tabs}${body}</div>`;
}
function dailyTopics(){ const set=new Set(); S.daily.qids.forEach(q=>{ const c=chapterOf(q.split('#')[0]); if(c) set.add(c.title.split(':')[0].split(',')[0]); }); const a=[...set]; return a.length>2?`${a.slice(0,2).join(', ')} и ещё ${a.length-2}`:a.join(', '); }

// ---------- mistakes screen ----------
function renderReview(){
  const wl=wrongList(); const n=Math.min(8,wl.length);
  if(!wl.length){ const next=remaining()[0]; return `${topbar('exit',0,'')}<div class="stack fade"><div><div class="eyebrow">Ошибки</div><h1>Ошибок нет</h1></div><div class="empty">Вопросы попадают сюда после неверного ответа и уходят после двух верных подряд.</div>${next?`<button class="btn primary wide" data-act="lesson" data-arg="${next.id}">Следующий урок: ${esc(next.title)}</button>`:''}</div>`; }
  const groups={}; wl.forEach(w=>{ const c=chapterOf(w.lid); const k=c?c.title:'Другое'; (groups[k]=groups[k]||[]).push(w); });
  return `${topbar('exit',0,'')}<div class="stack fade"><div><div class="eyebrow">Ошибки</div><h1>${qWord(wl.length)} на повтор</h1><p class="muted small">Вопрос уходит из списка после двух верных ответов подряд. За раз — до 8.</p></div>
    ${Object.entries(groups).map(([t,ws])=>`<div class="stack tight"><div class="eyebrow">${esc(t)}</div>${ws.map(w=>`<div class="sheet" style="padding:12px 14px"><div class="spread"><span style="font-size:14px">${esc(w.q.t)}</span><span class="badge soft" title="ошибок">×${w.w.n}</span></div></div>`).join('')}</div>`).join('')}

</script>
<script>
// ---------- run engine: lesson / review_run / daily / topic / mock_run ----------
const runBase = (kind,id,title) => ({kind,id,title,summary:null,lesson:null,qs:[],step:0,chosen:null,answers:[],started:Date.now(),phase:'q',openText:'',ai:null,aiBusy:false,aiErr:'',explain:null,confirmExit:false,opens:[],oi:0,oTexts:[],oPhase:'think',tLeft:0,oGrades:[],oBusy:false});
function startRun(kind,id){
  stopTimer();

  if(kind==='review_run'){ const wl=wrongList().slice(0,8); if(!wl.length) return false; L={...runBase('review_run','review','Повтор ошибок'), qs:shuffle(wl.map(w=>prepQ({...w.q,qid:w.qid})))}; return true; }
  if(kind==='daily'){ if(!dailyPending()) return false; L={...runBase('daily','daily','Повтор дня'), qs:shuffle(S.daily.qids.map(qById).filter(Boolean).map(prepQ))}; return true; }
  if(kind==='topic'){ const c=chapterById(id); if(!c) return false; const all=c.lessons.flatMap(l=>l.q.map((q,i)=>({...q,qid:l.id+'#'+i}))); const w=all.filter(q=>S.wrong[q.qid]); const rest=shuffle(all.filter(q=>!S.wrong[q.qid])).sort((a,b)=>((S.q[a.qid]?.last)||0)-((S.q[b.qid]?.last)||0)); const pick=shuffle(w.slice(0,3).concat(rest).slice(0,6)); L={...runBase('topic',id,c.title), qs:pick.map(prepQ)}; return true; }
  if(kind==='mock_run'){ const chs=shuffle(CH.filter(c=>c.id!=='job')).slice(0,8); const qs=chs.map(c=>{ const all=c.lessons.flatMap(l=>l.q.map((q,i)=>({...q,qid:l.id+'#'+i}))); const hard=all.filter(q=>(q.d||1)>=2); return prepQ(shuffle(hard.length?hard:all)[0]); }); const f=[...focusIds()]; const pool=shuffle((f.filter(x=>x!=='job').length?f.filter(x=>x!=='job').map(chapterById).filter(Boolean):CH.filter(c=>c.id!=='job')).flatMap(c=>chapterOpens(c).map(o=>({...o,ch:c.title})))); const opens=[pool[0]].filter(Boolean); const other=pool.find(o=>o.ch!==pool[0]?.ch)||pool[1]; if(other) opens.push(other); L={...runBase('mock_run','mock','Мок-интервью'), qs, opens}; return true; }
  return false;
}
const runTotal = () => L.qs.filter(q=>!q.again).length;
const runScore = () => L.answers.filter(a=>a.ok&&!a.again).length;

function renderRun(){
  if(L.phase==='summary') return renderSummary();
  if(L.phase==='open') return L.kind==='mock_run'?renderMockOpen():renderOpen();
  if(L.phase==='result') return L.kind==='mock_run'?renderMockResult():renderResult();
  const n=L.qs.length, q=L.qs[L.step], ch=L.chosen, answered=ch!==null, ok=answered&&ch===q.c;
  const pct=Math.round(100*(L.step+(answered?1:0))/n);
  const top=topbar('exit',pct,`<span class="mono">${L.step+1}/${n}</span>`);
  const confirm=L.confirmExit?`<div class="confirm"><b>Выйти из ${L.kind==='lesson'?'урока':'повтора'}?</b><p class="small">Ответы в этом заходе не сохранятся.</p><div class="row"><button class="btn bad sm" data-act="exit-now">Выйти</button><button class="btn ghost sm" data-act="exit-cancel">Остаться</button></div></div>`:'';
  const bub = answered ? (ok?['Знаешь!','Так держать!','Точно.','В яблочко.'][L.step%4] : 'Мимо — запомним') : q.again?'Этот вопрос вернулся — теперь без ошибки': L.kind==='mock_run'?'Как на встрече: без подсказок': (['Подумайте, как ответил бы мидл','Вспомните конспект урока','Выберите самый сильный вариант'][L.step%3]);
  const table=q.data?`<div class="tblwrap"><table class="tbl"><thead><tr>${q.data.h.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${q.data.r.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
  const summ=L.summary&&L.kind!=='mock_run'?`<details class="set"><summary class="small">Подсмотреть конспект</summary><ul class="summary small" style="margin-top:10px">${L.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`:'';
  const explain = answered&&!ok ? (L.explain===null ? (aiReady?`<button class="btn ghost sm" data-act="explain">Объяснить подробнее</button>`:'') : L.explain==='busy'?`<span class="row small"><span class="spin"></span>Интервьюер объясняет…</span>`:'') : '';
  const footer = answered ? `<div class="footer-fb ${ok?'good':'bad'}"><div class="in"><b>${ok?'Так держать!':'Не совсем'}</b><p>${ok?esc(q.e[q.c]):'Правильно: '+esc(q.o[q.c])+'. '+esc(q.e[q.c].replace(/^(Верно|Да|Именно так|Точно)[:.]?\s*/,''))}</p><div class="row">${explain}<button class="btn ${ok?'good':'bad'}" style="flex:1" data-act="l-next">${L.step+1>=n?'К результату':'Дальше'}</button></div></div></div>` : '';
  const explainBox = typeof L.explain==='string'&&L.explain!=='busy' ? `<div class="explain" id="explain">${esc(L.explain)}</div>` : (L.explain==='busy'?`<div class="explain" id="explain">…</div>`:'');
  return `${top}<div class="stack fade">${confirm}${mentor(bub)}${summ}
    <div class="sheet stack">${table}<p class="qtext">${esc(q.t)}</p><div class="opts">${q.o.map((o,i)=>{const cls=answered?(i===q.c?'correct':i===ch?'wrong':'dim'):'';return `<button class="opt ${cls}" data-act="l-pick" data-arg="${i}" ${answered?'disabled':''}><span>${esc(o)}</span><span class="ex">${esc(q.e[i])}</span></button>`;}).join('')}</div>${explainBox}</div>
    ${answered?'<div style="height:140px"></div>':''}</div>${footer}`;
}
function renderSummary(){
  const l=L.lesson; const n=L.qs.length;
  return `${topbar('exit',4,'')}<div class="stack fade">${mentor('Сначала коротко о главном')}<div class="sheet stack"><div><h2>${esc(l.title)}</h2><p class="small muted">${qWord(n)} · ~${lessonMinutes(l)} мин${isAsk(l)?' · <span style="color:var(--warn);font-weight:600">Спросят на собесе</span>':''}</p></div><ul class="summary">${L.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${l.open?`<div class="echo"><span class="eyebrow">Спросят так</span><span>«${esc(l.open.q)}»</span></div>`:''}</div></div><div class="actions"><button class="btn primary wide" data-act="l-go">К вопросам</button></div>`;
}
function pick(i){
  const q=L.qs[L.step]; if(L.chosen!==null) return; L.chosen=i; const ok=i===q.c; const now=Date.now();
  L.answers.push({qid:q.qid, ok, again:!!q.again, t:q.t, chosen:q.o[i], correct:q.o[q.c], e:q.e[q.c]});
  const st=S.q[q.qid]||{ok:0,n:0,last:0}; st.n++; if(ok) st.ok++; st.last=now; S.q[q.qid]=st;
  if(!ok){ const w=S.wrong[q.qid]||{n:0,streak:0,at:0}; w.n++; w.streak=0; w.at=now; S.wrong[q.qid]=w; if(L.kind!=='mock_run' && !q.again){ L.qs.push(prepQ({...q, again:true, src:q.src||q})); } }
  else if(S.wrong[q.qid]){ const w=S.wrong[q.qid]; w.streak=(w.streak||0)+1; if(w.streak>=2) delete S.wrong[q.qid]; }
  save(); render();
}
function next(){ L.step++; L.chosen=null; L.explain=null; if(L.step>=L.qs.length){ if(L.kind==='mock_run'){ L.phase='open'; L.oi=0; startOpenTimer(); } else finishRun(); } render(); window.scrollTo({top:0}); }
function finishRun(){
  const score=runScore(), total=runTotal(), t=todayISO();
  if(L.kind==='lesson'){ const prev=S.progress[L.id]||{}; L.prev={best:prev.best||0, at:prev.at||0}; const quizOk=score/total>=target().pass; const openOk=!target().open || !!prev.open; S.progress[L.id]={score,total,at:Date.now(),best:Math.max(prev.best||0,score),open:!!prev.open,quizOk,passed: prev.passed || (quizOk&&openOk)}; S.days[t]=(S.days[t]||0)+1; }
  else { if(!(t in S.days)) S.days[t]=0; if(L.kind==='daily'&&S.daily){ S.daily.done=true; } }
  L.phase='result'; save();
}
function renderResult(){
  const score=runScore(), total=runTotal(), pct=Math.round(100*score/total), r=56, c=2*Math.PI*r, isL=L.kind==='lesson';
  const p=S.progress[L.id]||{}; const t=target();
  const quizOk=isL?score/total>=t.pass:true; const needOpen=isL&&t.open&&!p.open; const passed=isL?(quizOk&&!needOpen):true;
  const wrongs=L.answers.filter(a=>!a.ok&&!a.again); const lesson=L.lesson; const nextL=remaining().find(l=>l.id!==L.id);
  const title= !isL ? (L.kind==='daily'?'Повтор дня закрыт': L.kind==='review_run'?(wrongs.length?'Часть ошибок осталась':'Ошибки закрыты'):`Тема: ${score}/${total}`) : needOpen&&quizOk?'Тест сдан, остался письменный ответ': passed?(pct===100?'Без единой ошибки':'Урок сдан'):`Не сдан: нужно ${Math.ceil(t.pass*total)} из ${total}`;
  const prevBest=isL&&L.prev?L.prev.best:0; const delta= isL && L.prev && L.prev.at ? (score>prevBest?`лучший результат, было ${prevBest}/${total}`: score<prevBest?`было ${prevBest}/${total}`:'как в прошлый раз') : '';
  const k=perDay(), td=todayCount(), st=streak();
  const qlist=`<div class="qlist">${L.answers.filter(a=>!a.again).map(a=>`<details><summary><span class="mark ${a.ok?'ok':'no'}">${a.ok?'✓':'✗'}</span><span>${esc(a.t)}</span></summary><p>${a.ok?'':'Вы выбрали: '+esc(a.chosen)+'. '}Правильно: ${esc(a.correct)}. ${esc(a.e)}</p></details>`).join('')}</div>`;
  let ctas='';
  if(isL){ if(needOpen&&quizOk) ctas=`<button class="btn primary wide" data-act="l-open">Письменный ответ · нужен для зачёта</button><button class="btn ghost wide" data-act="exit">К плану</button>`; else if(!quizOk) ctas=`<button class="btn primary wide" data-act="l-retry">Пройти ещё раз · другие вопросы</button><button class="btn ghost wide" data-act="exit">К плану</button>`; else if(wrongs.length) ctas=`<button class="btn primary wide" data-act="review_run">Повторить ${qWord(wrongs.length)}</button><button class="btn ghost wide" data-act="exit">К плану</button>`; else ctas=(nextL?`<button class="btn primary wide" data-act="lesson" data-arg="${nextL.id}">Следующий: ${esc(nextL.title)}</button>`:'')+`<button class="btn ghost wide" data-act="exit">К плану</button>`; }
  else ctas=`<button class="btn primary wide" data-act="exit">К плану</button>`;
  const bonus = isL && lesson.open && !needOpen ? `<button class="card-cta" data-act="l-open"><span class="ico">${I.mic}</span><span class="body"><b>Бонус: письменный ответ по теме · ~2 мин</b><span>${esc(lesson.open.q)}</span></span></button>` : '';
  return `${topbar('exit',100,'')}<div class="stack fade"><div class="sheet result"><div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="${passed?'var(--good)':'var(--bad)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-score/total)}"/></svg><div class="v mono">${score}/${total}</div></div><h2>${title}</h2>${delta?`<p class="muted small">${delta}</p>`:''}${isL?`<p class="small">Сегодня ${Math.min(td,k)}/${k} ${plural(k,'урок','урока','уроков')}${st?` · серия ${dayWord(st)}`:''}</p>`:''}${mentor(!isL?'Повтор — лучший способ не ошибиться на встрече.':needOpen&&quizOk?'Напишите так, как сказали бы вслух — это и есть тренировка.':passed?'Следующий урок ждёт на главной.':'Не страшно: вопросы в повторе будут другие.')}</div>${qlist}${bonus}<div style="height:${isL?130:70}px"></div></div><div class="actions">${ctas}</div>`;
}

// ---------- open answer step (lesson) ----------
function renderOpen(){
