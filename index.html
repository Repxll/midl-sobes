function saveOpen(){ const p=S.progress[L.id]; if(!p) return; p.open=true; if(p.quizOk) p.passed=true; S.practice=(S.practice||[]).concat([{q:L.lesson.open.q, text:L.openText, score:L.ai?.score||null, verdict:L.ai?.verdict||'', at:Date.now(), lesson:L.id}]).slice(-30); save(); L.phase='result'; render(); window.scrollTo({top:0}); }

// ---------- AI: grade & explain ----------
function aiView(a){ return `<div class="ai"><div class="row"><b>Разбор интервьюера</b><span class="score" aria-label="Оценка ${a.score} из 5">${[1,2,3,4,5].map(i=>`<i class="${i<=a.score?'on':''}"></i>`).join('')}</span></div><p>${esc(a.verdict)}</p>${a.strengths?.length?`<div><div class="eyebrow">Сильно</div><ul>${a.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}${a.gaps?.length?`<div><div class="eyebrow">Чего не хватило</div><ul>${a.gaps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}${a.better?`<div><div class="eyebrow">Как можно было ответить</div><div class="better">${esc(a.better)}</div></div>`:''}${a.followup?`<div><div class="eyebrow">Интервьюер спросил бы дальше</div><button class="fu" data-act="followup">${esc(a.followup)} →</button></div>`:''}</div>`; }

}
async function gradeOpen(oq, text, onDone){
  const prompt=`Ты — нанимающий лид продуктового дизайна в крупной продуктовой компании, 2026 год. Кандидат на позицию middle product designer отвечает на вопрос собеседования. Оцени ответ строго, но доброжелательно, как на реальном собесе: структура, конкретика, связь с метриками и пользователями, личный вклад, trade-offs. Оценка 5 — только за ответ, который ты бы привёл как образец другим кандидатам; 3 — средний мидл; 1–2 — джун или вода.
Вопрос интервьюера: ${oq.q}
Что ждут в сильном ответе: ${(oq.hint||[]).join('; ')}
Ответ кандидата:
"""
${text.slice(0,6000)}
"""
Ответь только JSON вида {"score": число от 1 до 5, "verdict": "одно предложение — общий вердикт", "strengths": ["2-3 коротких пункта"], "gaps": ["2-4 коротких пункта, чего не хватило"], "better": "улучшенная версия ответа от первого лица, 5-8 предложений, на русском", "followup": "уточняющий вопрос, который интервьюер задал бы следом"}`;
  try{ const r=await sampleFn.json(prompt,{cache:false}); if(!r||typeof r!=='object') throw {code:'invalid_json'}; r.score=Math.max(1,Math.min(5,Math.round(Number(r.score)||3))); r.strengths=Array.isArray(r.strengths)?r.strengths.map(String):[]; r.gaps=Array.isArray(r.gaps)?r.gaps.map(String):[]; onDone(null,r); }
  catch(e){ onDone(e,null); }
}
const AI_ERR = {not_granted:'Вы не разрешили странице обращаться к Claude — разбор недоступен.', rate_limited:'Слишком много запросов. Попробуйте через пару минут.', invalid_json:'Ответ пришёл в неожиданном формате. Нажмите ещё раз.', refused:'Claude отказался разбирать этот текст. Переформулируйте ответ.', sampling_disabled:'Claude недоступен для этого аккаунта.', upstream_error:'Сбой соединения. Попробуйте ещё раз.', cancelled:''};
function aiErrText(e){ if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e?.code)) aiReady=false; return AI_ERR[e?.code] ?? AI_ERR.upstream_error; }

Выбрал: ${a.chosen}
Верно: ${a.correct}

${L.summary?'Конспект урока: '+L.summary.join(' '):''}`;

// ---------- mock: open answers with timer ----------
let timerId=null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startOpenTimer(){ stopTimer(); L.oPhase='think'; L.tLeft=15; timerId=setInterval(()=>{ L.tLeft--; if(L.tLeft<=0){ if(L.oPhase==='think'){ L.oPhase='answer'; L.tLeft=120; } else { L.oPhase='done'; stopTimer(); render(); return; } } paintTimer(); },1000); }
function paintTimer(){ const bar=document.getElementById('tbar'), lab=document.getElementById('tlab'), ph=document.getElementById('tph'); if(!bar) return; const max=L.oPhase==='think'?15:120; const w=Math.round(100*L.tLeft/max); bar.style.width=w+'%'; bar.className=L.oPhase==='think'?'think':L.tLeft<=30?(L.tLeft<=10?'bad':'warn'):''; lab.textContent=`${Math.floor(L.tLeft/60)}:${String(L.tLeft%60).padStart(2,'0')}`; ph.textContent=L.oPhase==='think'?'Подумайте, можно начинать писать':'Пишите тезисами, как сказали бы вслух'; }
function renderMockOpen(){
  const o=L.opens[L.oi]; const txt=L.oTexts[L.oi]||''; const done=L.oPhase==='done';
  return `${topbar('exit',Math.round(100*(8+L.oi)/10),`<span class="mono">${L.oi+1}/2</span>`)}<div class="stack fade">${mentor(done?'Время вышло — ничего страшного, так и на собесе. Дописать можно, но честнее идти дальше.':L.oi===0?'Письменный ответ на время. Сначала 15 секунд подумать.':'Второй вопрос. Помните про структуру: ситуация → действие → результат.')}
    <div class="sheet stack openq"><div class="eyebrow">${esc(o.ch||'')}</div><p class="q">${esc(o.q)}</p>
    <div class="timer"><div class="bar"><i id="tbar" style="width:100%" class="think"></i></div><div class="t"><span id="tph">Подумайте, можно начинать писать</span><span class="mono" id="tlab">0:15</span></div></div>
    ${done?`<div class="confirm"><b>Время вышло</b></div>`:''}
    <label class="sr" for="mans">Ваш ответ</label><textarea id="mans" class="ans" placeholder="Тезисы ответа" data-act="mock-text">${esc(txt)}</textarea></div><div style="height:120px"></div></div>
    <div class="actions"><button class="btn primary wide" data-act="mock-done">${done?'Дальше':'Готово'}</button>${done?'':'<button class="linkbtn" data-act="mock-skip" style="justify-self:center">Пропустить вопрос</button>'}</div>`;
}
function mockDone(skip){ stopTimer(); if(skip) L.oTexts[L.oi]=''; L.oi++; if(L.oi>=L.opens.length){ finishMock(); } else { L.oPhase='think'; startOpenTimer(); } render(); window.scrollTo({top:0}); setTimeout(paintTimer,0); }
function finishMock(){ const score=runScore(), total=runTotal(); const t=todayISO(); if(!(t in S.days)) S.days[t]=0; S.mocks=(S.mocks||[]).concat([{at:Date.now(),score,total,opens:L.opens.map((o,i)=>({q:o.q,text:L.oTexts[i]||'',score:null}))}]).slice(-10); L.phase='result'; save(); }
function renderMockResult(){
  const m=S.mocks[S.mocks.length-1]; const score=m.score,total=m.total, r=56, c=2*Math.PI*r; const best=Math.max(...S.mocks.map(x=>x.score)); const prev=S.mocks.length>1?S.mocks[S.mocks.length-2].score:null;
  const byCh={}; L.answers.forEach(a=>{ const ch=chapterOf(a.qid.split('#')[0]); const k=ch?ch.title:'—'; byCh[k]=a.ok; });
  const opens=m.opens.map((o,i)=>`<div class="sheet stack tight openq"><div class="eyebrow">Ответ ${i+1}</div><p class="q">${esc(o.q)}</p>${o.text?`<div class="better" style="padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;white-space:pre-wrap">${esc(o.text)}</div>`:'<p class="note">Пропущен</p>'}${L.oGrades[i]?aiView(L.oGrades[i]):(o.text&&aiReady?`<button class="btn ghost sm" data-act="mock-grade" data-arg="${i}" ${L.oBusy?'disabled':''}>${L.oBusy===i+1?'<span class="spin"></span> Интервьюер читает…':'Получить разбор'}</button>`:'')}</div>`).join('');
  return `${topbar('exit',100,'')}<div class="stack fade"><div class="sheet result"><div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-score/total)}"/></svg><div class="v mono">${score}/${total}</div></div><h2>${score===total?'Без ошибок':score>=6?'Уверенно':score>=4?'Середина':'Есть над чем работать'}</h2><p class="muted small">${score>=best&&S.mocks.length>1&&score>(prev??-1)?'Лучший результат':prev!==null?`прошлый раз ${prev}/${total}`:'первая попытка'}</p>${mentor('Ниже — по темам: где ошиблись, туда и идите в карте тем.')}</div>
    <div class="sheet stack tight"><div class="eyebrow">По темам</div>${Object.entries(byCh).map(([k,ok])=>`<div class="spread"><span class="small">${esc(k)}</span><span class="tag ${ok?'good':'bad'}">${ok?'верно':'ошибка'}</span></div>`).join('')}</div>${opens}<div style="height:80px"></div></div><div class="actions"><button class="btn primary wide" data-act="exit">К плану</button></div>`;
}
function mockGrade(i){ const o=S.mocks[S.mocks.length-1].opens[i]; const src=L.opens[i]; L.oBusy=i+1; render(); gradeOpen({q:o.q,hint:src?.hint||[]}, o.text, (err,res)=>{ L.oBusy=false; if(!err){ L.oGrades[i]=res; o.score=res.score; S.practice=(S.practice||[]).concat([{q:o.q,text:o.text,score:res.score,verdict:res.verdict,strengths:res.strengths,gaps:res.gaps,better:res.better,at:Date.now(),mock:true}]).slice(-30); save(); } render(); }); }
</script>
<script>
// ================= 1. Story bank =================
const STORIES = [
  {id:'about',    t:'О себе за две минуты',        q:'Расскажите о себе.', hint:['Роль, стаж, домен — одной фразой','1–2 продукта и ваш вклад: результат или его свидетельство','Чего хотите дальше и почему эта вакансия']},
  {id:'case',     t:'Главный кейс',                q:'Расскажите о проекте, которым гордитесь больше всего.', hint:['Проблема бизнеса и цель — в первых двух предложениях','Ваша роль, варианты, которые отбросили, и почему','Результат или свидетельство, что сделали бы иначе']},
  {id:'fail',     t:'Ошибка и вывод',              q:'Расскажите о своей ошибке. Что вы изменили после неё?', hint:['Конкретная ситуация, а не «я перфекционист»','Как узнали, что ошиблись, и чего это стоило','Что изменили в подходе и где это уже сработало']},
  {id:'conflict', t:'Несогласие с командой',       q:'Расскажите о ситуации, когда вы не согласились с продактом или разработчиком.', hint:['Расхождение целей, а не людей','Что сделали вы: данные, прототип, компромисс с фиксацией рисков','Результат и что вынесли для себя']},
  {id:'nodata',   t:'Решение без данных',          q:'Как вы приняли решение, когда данных не было или аналитика была закрыта?', hint:['Почему данных не было — честно','Какие свидетельства собрали: тесты, поддержка, разработка, конкуренты','Как проверили решение после и какую метрику отслеживали бы']},
  {id:'why',      t:'Почему ухожу и почему к вам', q:'Почему вы ищете новую работу и чем вас привлекла наша вакансия?', hint:['Чего не хватает сейчас — без жалоб на компанию','Чему научились за время на текущем месте','Связка: их задача ↔ ваш опыт ↔ куда хотите расти']},
];
const storyOf = id => { S.stories=S.stories||{}; return S.stories[id] || (S.stories[id]={draft:'',versions:[],best:null}); };
const storyBest = id => { const s=S.stories?.[id]; if(!s||s.best===null||s.best===undefined) return null; return s.versions[s.best]||null; };
const storiesReady = () => STORIES.filter(x=>storyBest(x.id)).length;
let SB={busy:false, err:'', ai:null, saveT:null};
function renderStories(){
  return `${topbar('exit',0,'')}<div class="stack fade"><div><div class="eyebrow">Мои истории</div><h1>Банк историй к собесу</h1><p class="muted">Шесть историй, которые спрашивают почти на каждом собесе. Пишете свою версию на своём материале, получаете разбор, лучшую отмечаете основной — перед собесом репетируете их вслух.</p></div>
    <div class="stack tight">${STORIES.map(x=>{ const s=S.stories?.[x.id]; const b=storyBest(x.id); const n=s?.versions?.length||0; return `<button class="card-cta" data-act="story" data-arg="${x.id}"><span class="ico">${b?I.check:I.doc}</span><span class="body"><b>${esc(x.t)}</b><span>${b?`основная версия${b.score?` · ${b.score}/5`:''} · версий ${n}`:s?.draft?'черновик':'не начата'}</span></span></button>`; }).join('')}</div>
    </div><div class="actions"><button class="btn primary wide" data-act="stories_run" ${storiesReady()?'':'disabled'}>${storiesReady()?`Репетиция: ${storiesReady()} из 6 · ~${storiesReady()*3} мин`:'Репетиция откроется после первой основной версии'}</button></div>`;
}
function renderStory(id){
  const x=STORIES.find(s=>s.id===id); if(!x) return renderStories(); const s=storyOf(id); const len=s.draft.trim().length;
  const vers=s.versions.map((v,i)=>`<details><summary><span>${i===s.best?'★ ':''}Версия ${i+1} · ${fmtDate(isoOf(new Date(v.at)))}</span><span class="mono muted">${v.score?v.score+'/5':'без оценки'}</span></summary><div class="stack tight" style="margin-top:8px"><div class="better" style="padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;white-space:pre-wrap">${esc(v.text)}</div>${v.verdict?`<p class="note">${esc(v.verdict)}</p>`:''}<div class="row">${i===s.best?'<span class="tag good">Основная</span>':`<button class="btn ghost sm" data-act="story-best" data-arg="${i}">Сделать основной</button>`}<button class="btn ghost sm" data-act="story-load" data-arg="${i}">В черновик</button></div></div></details>`).reverse().join('');
  return `${topbar('stories',0,'')}<div class="stack fade"><div><div class="eyebrow">Мои истории</div><h1>${esc(x.t)}</h1></div>
    <div class="sheet stack openq"><p class="q">«${esc(x.q)}»</p><ul class="hintlist">${x.hint.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
      <label class="sr" for="sdraft">Ваша история</label><textarea id="sdraft" class="ans" style="min-height:200px" placeholder="Ваша история на вашем материале: проект, цифры или свидетельства, ваш вклад. Так, как скажете вслух." data-act="story-text">${esc(s.draft)}</textarea>
      <p class="note">${len} символов · вслух это примерно ${Math.max(0,Math.round(len/900*60))} сек. Хорошо — 900–1800 (1–2 минуты).</p>
      ${SB.ai?aiView(SB.ai)+(SB.ai.better?`<p class="note">Улучшенная версия — ориентир. Факты в ней могут быть додуманы: берите структуру, а цифры и детали оставляйте свои.</p><button class="btn ghost sm" data-act="story-better">Взять структуру в черновик</button>`:''):SB.busy?`<div class="ai"><div class="row"><span class="spin"></span><span>Интервьюер читает историю… обычно 10–40 секунд</span></div></div>`:''}
      ${SB.err?`<p class="note" style="color:var(--bad)">${esc(SB.err)}</p>`:''}
      <div class="row">${aiReady?`<button class="btn primary" data-act="story-grade" ${len>80&&!SB.busy?'':'disabled'}>Сохранить и получить разбор</button>`:''}<button class="btn ghost" data-act="story-save" ${len>80?'':'disabled'}>Сохранить версию</button></div>
      ${aiReady?'':'<p class="note">Разбор от ИИ работает, когда страница открыта в claude.ai.</p>'}</div>
    ${vers?`<div class="stack tight"><div class="eyebrow">Версии</div><div class="hist">${vers}</div></div>`:''}</div>`;
}
function storySave(id, ai){ const s=storyOf(id); const v={text:s.draft.trim(), at:Date.now(), score:ai?.score||null, verdict:ai?.verdict||'', gaps:ai?.gaps||[], better:ai?.better||''}; s.versions.push(v); if(s.versions.length>12) s.versions.shift(); const bi=s.best; const bs=bi!==null&&bi!==undefined?s.versions[bi]?.score||0:-1; if(bi===null||bi===undefined||(v.score&&v.score>=bs)) s.best=s.versions.length-1; save(); }
// rehearsal
let RH=null;
function startRehearsal(){ const ids=shuffle(STORIES.filter(x=>storyBest(x.id)).map(x=>x.id)); RH={ids,i:0,show:false,left:120}; rhTimer(); }
function rhTimer(){ stopTimer(); timerId=setInterval(()=>{ if(!RH) return stopTimer(); RH.left=Math.max(0,RH.left-1); const el=document.getElementById('rhlab'), bar=document.getElementById('rhbar'); if(el){ el.textContent=`${Math.floor(RH.left/60)}:${String(RH.left%60).padStart(2,'0')}`; bar.style.width=Math.round(100*RH.left/120)+'%'; bar.className=RH.left<=10?'bad':RH.left<=30?'warn':''; } if(RH.left<=0) stopTimer(); },1000); }
function renderRehearsal(){
  if(!RH||!RH.ids.length){ RH=null; return renderStories(); }
  if(RH.i>=RH.ids.length) return `${topbar('stories',100,'')}<div class="stack fade"><div class="sheet result"><h2>Репетиция окончена</h2><p class="muted">${RH.ids.length} ${plural(RH.ids.length,'история','истории','историй')} вслух. Повторите накануне собеса и утром в день встречи.</p>${mentor('Если где-то запнулись — откройте историю и сократите её. Короткая история, рассказанная уверенно, сильнее длинной.')}</div></div><div class="actions"><button class="btn primary wide" data-act="stories">К историям</button></div>`;
  const x=STORIES.find(s=>s.id===RH.ids[RH.i]); const b=storyBest(x.id);
  return `${topbar('stories',Math.round(100*RH.i/RH.ids.length),`<span class="mono">${RH.i+1}/${RH.ids.length}</span>`)}<div class="stack fade">${mentor('Скажите ответ вслух, как на встрече. Потом сверьтесь со своей основной версией.')}
    <div class="sheet stack openq"><div class="eyebrow">${esc(x.t)}</div><p class="q">«${esc(x.q)}»</p>
      <div class="timer"><div class="bar"><i id="rhbar" style="width:${Math.round(100*RH.left/120)}%"></i></div><div class="t"><span>Две минуты на ответ</span><span class="mono" id="rhlab">${Math.floor(RH.left/60)}:${String(RH.left%60).padStart(2,'0')}</span></div></div>
      ${RH.show?`<div class="better" style="padding:12px;border-radius:10px;background:var(--surface-2);font-size:14px;white-space:pre-wrap">${esc(b.text)}</div>`:''}</div><div style="height:120px"></div></div>
    <div class="actions">${RH.show?`<button class="btn primary wide" data-act="rh-next">${RH.i+1>=RH.ids.length?'Завершить':'Следующая история'}</button>`:`<button class="btn primary wide" data-act="rh-show">Ответил — показать мою версию</button>`}</div>`;
}

// ================= 2. Resume / case / cover review =================
const CV_TYPES = [
  {id:'resume', t:'Резюме', ph:'Вставьте текст резюме целиком (скопируйте из PDF или hh)', check:['Заголовок: роль и домен, а не «дизайнер»','В каждом месте работы 2–4 пункта влияния: задача → что сделали → результат или свидетельство','Ссылка на портфолио в первых строках','Ключевые слова из вакансий, на которые откликаетесь','Без списков обязанностей и простыни инструментов']},
  {id:'case',   t:'Страница кейса', ph:'Вставьте текст страницы кейса из портфолио (подписи к экранам можно описать словами)', check:['Первый экран: продукт, проблема, ваша роль, результат','Варианты, которые отбросили, и почему','Ключевые экраны иллюстрируют решения, а не идут лентой','Результат или честные свидетельства, если цифр нет','Что сделали бы иначе']},
  {id:'cover',  t:'Сопроводительное письмо', ph:'Вставьте письмо. Ниже можно добавить текст вакансии — разбор учтёт его', check:['5–7 предложений, не шаблон','Почему именно эта компания и продукт','1–2 релевантных результата','Ссылка на самый подходящий кейс','Наблюдение или вопрос про их продукт']},
];
let CV={type:'resume', text:'', vac:'', busy:false, err:'', res:null};
function renderCv(){
  const t=CV_TYPES.find(x=>x.id===CV.type); const len=CV.text.trim().length; const last=(S.cvs||[]).slice(-4).reverse();
  return `${topbar('exit',0,'')}<div class="stack fade"><div><div class="eyebrow">Разбор резюме и портфолио</div><h1>Проверка глазами нанимающего</h1><p class="muted">Вставьте текст — получите оценку, что исправить в первую очередь, и переписанные фрагменты.</p></div>
    <div class="seg">${CV_TYPES.map(x=>`<button aria-pressed="${CV.type===x.id}" data-act="cv-type" data-arg="${x.id}">${x.t}</button>`).join('')}</div>
    <div class="sheet stack"><details class="set"><summary class="small">Чек-лист: ${esc(t.t.toLowerCase())}</summary><ul class="hintlist" style="margin-top:8px">${t.check.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></details>
      <label class="sr" for="cvtext">Текст</label><textarea id="cvtext" class="ans" style="min-height:220px" placeholder="${esc(t.ph)}" data-act="cv-text">${esc(CV.text)}</textarea>
      ${CV.type!=='case'?`<label class="sr" for="cvvac">Текст вакансии</label><textarea id="cvvac" class="ans" style="min-height:90px" placeholder="Необязательно: текст вакансии, под которую адаптируете" data-act="cv-vac">${esc(CV.vac)}</textarea>`:''}
      ${CV.busy?`<div class="ai"><div class="row"><span class="spin"></span><span>Читаю как нанимающий лид… обычно 20–60 секунд</span></div></div>`:aiReady?`<div class="row"><button class="btn primary" data-act="cv-go" ${len>150?'':'disabled'}>Получить разбор</button><span class="note">Текст уйдёт Claude. Уберите телефон, e-mail и другие личные данные.</span></div>`:'<p class="note">Разбор делает Claude: откройте страницу в claude.ai. Пока сверьтесь с чек-листом выше.</p>'}
      ${CV.err?`<p class="note" style="color:var(--bad)">${esc(CV.err)}</p>`:''}</div>
    ${CV.res?cvView(CV.res):''}
    ${last.length&&!CV.res?`<div class="stack tight"><div class="eyebrow">Прошлые разборы</div><div class="hist">${last.map(r=>`<details><summary><span>${esc(CV_TYPES.find(x=>x.id===r.type)?.t||'')} · ${fmtDate(isoOf(new Date(r.at)))}</span><span class="mono muted">${r.score}/10</span></summary><div style="margin-top:8px">${cvView(r)}</div></details>`).join('')}</div></div>`:''}</div>`;
}
function cvView(r){ return `<div class="ai"><div class="spread"><b>Оценка нанимающего</b><span class="mono">${r.score}/10</span></div><p>${esc(r.verdict)}</p>${r.top?.length?`<div><div class="eyebrow">Исправить в первую очередь</div><ul>${r.top.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}${r.fixes?.length?`<div class="stack tight"><div class="eyebrow">Было → стало</div>${r.fixes.map(f=>`<div class="explain"><span class="muted">Было:</span> ${esc(f.was)}\n<b>Стало:</b> ${esc(f.now)}\n<span class="muted">${esc(f.why)}</span></div>`).join('')}</div>`:''}${r.missing?.length?`<div><div class="eyebrow">Не хватает</div><ul>${r.missing.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}${r.keywords?.length?`<div><div class="eyebrow">Ключевые слова из вакансии, которых нет</div><p class="small">${r.keywords.map(esc).join(' · ')}</p></div>`:''}</div>`; }
async function cvGo(){
  const t=CV_TYPES.find(x=>x.id===CV.type); CV.busy=true; CV.err=''; CV.res=null; render();
  const prompt=`Ты — нанимающий лид продуктового дизайна в российской продуктовой компании, 2026 год. Кандидат на позицию middle product designer (около 2 лет опыта) прислал ${t.t.toLowerCase()}. Оцени так, как оцениваешь на первом просмотре: решаешь ли пригласить на собес. Критерии: ${t.check.join('; ')}. Будь конкретен и строг, хвали только за действительно сильное. Не выдумывай факты о кандидате: в переписанных фрагментах оставляй его факты, а где цифр нет — ставь плейсхолдер вида [цифра или свидетельство].
${CV.vac.trim()&&CV.type!=='case'?`Вакансия, под которую адаптирует:\n"""\n${CV.vac.slice(0,4000)}\n"""\n`:''}Текст кандидата:
"""
${CV.text.slice(0,9000)}

let V={text:'', busy:false, err:''};
function renderVacancy(){
  return `${topbar('exit',0,'')}<div class="stack fade"><div><div class="eyebrow">Урок по вакансии</div><h1>Вопросы под конкретную вакансию</h1><p class="muted">Вставьте текст вакансии. Claude соберёт конспект «что для них важно», 3 тестовых вопроса и 2 письменных — как сделал бы интервьюер этой компании.</p></div>
    <div class="sheet stack"><label class="sr" for="vtext">Текст вакансии</label><textarea id="vtext" class="ans" style="min-height:200px" placeholder="Скопируйте описание вакансии с hh или из письма рекрутера" data-act="v-text">${esc(V.text)}</textarea>
    ${V.busy?`<div class="ai"><div class="row"><span class="spin"></span><span>Читаю вакансию и собираю урок… обычно 20–60 секунд</span></div></div>`:aiReady?`<div class="row"><button class="btn primary" data-act="v-go" ${V.text.trim().length>40?'':'disabled'}>Собрать урок</button><span class="note">Текст уйдёт Claude. Уберите личные данные, если они есть.</span></div>`:`<p class="note">Сборку урока делает Claude: откройте страницу в claude.ai и разрешите ей обращаться к Claude.</p>`}
    ${V.err?`<p class="note" style="color:var(--bad)">${esc(V.err)}</p>`:''}</div>
    ${(S.custom||[]).length?`<div class="stack tight"><div class="eyebrow">Уже собрано</div>${S.custom.map(c=>`<div class="sheet spread" style="padding:14px"><b style="font-weight:500">${esc(c.title)}</b><button class="btn ghost sm" data-act="v-del" data-arg="${c.id}">Удалить</button></div>`).join('')}</div>`:''}</div>`;
}
async function generateVacancyLesson(text, silent){
  if(!sampleFn){ V.err='Claude недоступен в этом окне.'; return; }
  V.busy=true; V.err=''; if(route().v==='vacancy') render();
  const prompt=`Ты готовишь урок для подготовки к собеседованию на позицию middle product designer по тексту конкретной вакансии (рынок 2026 года). Вот текст вакансии:
"""
${text.slice(0,7000)}
"""
Составь урок строго по требованиям этой вакансии: домен продукта, метрики, процессы, инструменты, исследования, дизайн-система, ИИ — что реально спросят на собесе именно здесь.
Верни только JSON такого вида:
{"title":"короткое название: компания или роль, до 40 символов","summary":["4-5 тезисов: что для этой команды важно и к чему готовиться, каждый до 220 символов"],"q":[{"t":"вопрос в стиле собеседования по этой вакансии","o":["вариант 1","вариант 2","вариант 3","вариант 4"],"c":0,"e":["почему вариант 1 верен или нет","…2","…3","…4"],"d":1}],"open":[{"q":"открытый вопрос интервьюера","hint":["3 пункта, что должно быть в сильном ответе"]}]}
Нужно ровно 5 объектов в "q" (у каждого один однозначно верный вариант, индекс "c" от 0 до 3, пояснения ко всем четырём вариантам по одному предложению, "d" — сложность 1, 2 или 3; распредели: два 1, два 2, один 3) и ровно 2 объекта в "open". Всё на русском языке.`;
  try{
    const r=await sampleFn.json(prompt,{cache:false});
    const ok=r&&typeof r==='object'&&Array.isArray(r.q)&&r.q.length&&Array.isArray(r.summary);
    if(!ok) throw {code:'invalid_json'};
    const qs=r.q.filter(q=>q&&q.t&&Array.isArray(q.o)&&q.o.length===4&&Array.isArray(q.e)&&q.e.length===4).map(q=>({t:String(q.t),o:q.o.map(String),c:Math.max(0,Math.min(3,Number(q.c)||0)),e:q.e.map(String),d:[1,2,3].includes(Number(q.d))?Number(q.d):1}));
    if(qs.length<3) throw {code:'invalid_json'};
    const opens=(Array.isArray(r.open)?r.open:[]).filter(o=>o&&o.q).map(o=>({q:String(o.q),hint:Array.isArray(o.hint)?o.hint.map(String):[]}));
    const id='custom-'+Date.now();
    S.custom=(S.custom||[]).concat([{id, title:'По вакансии: '+String(r.title||'без названия').slice(0,40), open:opens.slice(1), lessons:[{id:id+'-1', title:'Что спросят именно здесь', ask:true, summary:r.summary.map(String).slice(0,6), open:opens[0]||null, q:qs}]}]);
    save(); V.text=''; V.busy=false; if(!silent){ L=null; go('deck'); }
  }catch(e){ V.busy=false; V.err=aiErrText(e); if(route().v==='vacancy') render(); }
}

// ---------- render & events ----------
function ensureRun(kind,id){ if(!L || L.kind!==kind || (id&&L.id!==id)) { if(!startRun(kind,id)){ L=null; location.hash='deck'; return false; } } return true; }
function render(){
  const r=route(); const app=document.getElementById('app'); let html='';
  switch(r.v){
    case 'setup': html=renderSetup(); break;
    case 'lesson': html=ensureRun('lesson',r.id)?renderRun():renderDeck('deck'); break;
    case 'review_run': html=ensureRun('review_run')?renderRun():renderDeck('deck'); break;
    case 'daily': html=ensureRun('daily')?renderRun():renderDeck('deck'); break;
    case 'topic': html=ensureRun('topic',r.id)?renderRun():renderDeck('deck'); break;
    case 'mock_run': html=ensureRun('mock_run')?renderRun():renderDeck('deck'); break;
    case 'review': html=renderReview(); break;
    case 'mock': html=renderMockIntro(); break;
    case 'practice': html=renderPractice(); break;
    case 'vacancy': html=renderVacancy(); break;
    case 'plan': case 'topics': html=renderDeck(r.v); break;
    case 'stories': html=renderStories(); break;
    case 'story': html=renderStory(r.id); break;
    case 'stories_run': html=renderRehearsal(); break;
    case 'cv': html=renderCv(); break;
    case 'tasks': html=renderTasks(); break;
    case 'task_run': html=T?renderTask():renderTasks(); break;
    default: html=renderDeck('deck');
  }
  app.innerHTML=html; if(L&&L.phase==='open'&&L.kind==='mock_run') paintTimer(); if(r.v==='stories_run'&&RH&&!timerId&&RH.i<RH.ids.length&&RH.left>0) rhTimer(); if(r.v==='task_run'&&T&&T.phase==='run') taskTick(); else if(r.v!=='task_run') clearInterval(taskTimer);
}
function exitRun(){ if(L && L.phase==='q' && L.answers.length && !L.confirmExit){ L.confirmExit=true; render(); window.scrollTo({top:0}); return; } L=null; stopTimer(); go('deck'); }
document.getElementById('app').addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='TEXTAREA'||b.tagName==='INPUT') return; const act=b.dataset.act, arg=b.dataset.arg; if(extraClick(act,arg)) return;
  switch(act){
    case 'onb-preset': { const p=DATE_PRESETS.find(x=>x.id===arg); ONB.preset=arg; ONB.date=p.d?addDays(p.d):null; render(); break; }
    case 'onb-pace': ONB.pace=+arg; render(); break;
    case 'onb-target': ONB.target=+arg; render(); break;
    case 'onb-pain': { const i=ONB.pains.indexOf(arg); if(i>=0) ONB.pains.splice(i,1); else if(ONB.pains.length<3) ONB.pains.push(arg); render(); break; }
    case 'onb-next': ONB.step++; render(); window.scrollTo({top:0}); break;
    case 'onb-back': ONB.step--; render(); break;
    case 'onb-cancel': ONB=null; if(S.setup) go('deck'); else render(); break;
    case 'onb-finish': finishOnb(arg==='vac'); break;
    case 'setup': startOnb(); go('setup'); break;
    case 'go': go(arg); break;
    case 'lesson': L=null; go('lesson-'+arg); break;
    case 'topic': L=null; go('topic-'+arg); break;
    case 'review': go('review'); break;
    case 'review_run': L=null; go('review_run'); break;
    case 'daily': L=null; go('daily'); break;
    case 'mock': go('mock'); break;
    case 'mock_run': L=null; go('mock_run'); break;
    case 'practice': go('practice'); break;
    case 'vacancy': go('vacancy'); break;
    case 'exit': exitRun(); break;
    case 'exit-now': L=null; stopTimer(); go('deck'); break;
    case 'exit-cancel': L.confirmExit=false; render(); break;
    case 'l-go': L.phase='q'; render(); window.scrollTo({top:0}); break;
    case 'l-pick': pick(+arg); break;
    case 'l-next': next(); break;
    case 'l-retry': { const id=L.id; L=null; startRun('lesson',id); render(); window.scrollTo({top:0}); break; }
    case 'l-open': L.phase='open'; render(); window.scrollTo({top:0}); break;
    case 'open-save': saveOpen(); break;
    case 'explain': explainMistake(); break;
    case 'ai-grade': { const oq=L.lesson.open; L.aiBusy=true; L.aiErr=''; render(); gradeOpen(oq,L.openText,(err,res)=>{ L.aiBusy=false; if(err) L.aiErr=aiErrText(err); else { L.ai=res; S.practice=(S.practice||[]).concat([{q:oq.q,text:L.openText,score:res.score,verdict:res.verdict,strengths:res.strengths,gaps:res.gaps,better:res.better,at:Date.now(),lesson:L.id}]).slice(-30); save(); } render(); }); break; }
    case 'followup': { const fu=(L&&L.ai?.followup)||(P.ai?.followup); if(!fu) break; const ch=L?chapterOf(L.id)?.title:P.q?.ch; P.q={q:fu,hint:[],ch:ch||''}; P.text=''; P.ai=null; P.prevScore=null; P.err=''; if(L){ L=null; go('practice'); } else render(); break; }
    case 'p-ch': P.ch=arg; P.q=null; render(); break;
    case 'p-next': pickPractice(); render(); break;
    case 'p-retry': P.prevScore=P.ai.score; P.ai=null; P.text=''; render(); break;
    case 'p-grade': { const oq=P.q; P.busy=true; P.err=''; render(); gradeOpen(oq,P.text,(err,res)=>{ P.busy=false; if(err) P.err=aiErrText(err); else { P.ai=res; S.practice=(S.practice||[]).concat([{q:oq.q,text:P.text,score:res.score,verdict:res.verdict,strengths:res.strengths,gaps:res.gaps,better:res.better,at:Date.now()}]).slice(-30); save(); } render(); }); break; }
    case 'v-go': generateVacancyLesson(V.text); break;
    case 'v-del': S.custom=(S.custom||[]).filter(c=>c.id!==arg); save(); render(); break;
    case 'reset': S.progress={}; S.q={}; S.wrong={}; S.days={}; S.daily=null; S.practice=[]; S.mocks=[]; S.tasks=[]; S.cvs=[]; save(); render(); break;
    case 'mock-done': mockDone(false); break;
    case 'mock-skip': mockDone(true); break;
    case 'mock-grade': mockGrade(+arg); break;
  }
});
document.getElementById('app').addEventListener('input', e=>{ const t=e.target; const act=t.dataset.act; if(!act) return; if(extraInput(t,act)) return;
  if(act==='onb-date'){ if(t.value){ ONB.preset='custom'; ONB.date=t.value; render(); } }
  else if(act==='onb-vac'){ ONB.vac=t.value; const btn=document.querySelector('[data-act="onb-finish"].btn'); if(btn){ const ok=t.value.trim().length>40; btn.dataset.arg=ok?'vac':''; btn.textContent=ok?'Собрать план по вакансии':'Собрать план'; } }
  else if(act==='open-text'){ L.openText=t.value; const len=t.value.trim().length; const btn=document.querySelector('[data-act="ai-grade"]'); if(btn) btn.disabled=!(len>30); const sv=document.querySelector('[data-act="open-save"]'); if(sv){ sv.disabled=len<150; sv.textContent=len<150?`Засчитать ответ · ${len}/150`:'Засчитать ответ'; } if(len>=100 && !document.querySelector('.openq details')){ const pos=t.selectionStart; render(); const ta=document.getElementById('oans'); if(ta){ ta.focus(); ta.setSelectionRange(pos,pos); } } }
  else if(act==='p-text'){ P.text=t.value; const len=t.value.trim().length; const btn=document.querySelector('[data-act="p-grade"]'); if(btn) btn.disabled=!(len>30); if(len>=100 && P.q?.hint?.length && !document.querySelector('.openq details')){ const pos=t.selectionStart; render(); const ta=document.getElementById('pans'); if(ta){ ta.focus(); ta.setSelectionRange(pos,pos); } } }
  else if(act==='v-text'){ V.text=t.value; const btn=document.querySelector('[data-act="v-go"]'); if(btn) btn.disabled=!(t.value.trim().length>40); }
  else if(act==='mock-text'){ L.oTexts[L.oi]=t.value; }
});

// ---------- boot ----------
function start(hot){
  loadLocal();
  if(hot&&hot.L){ L=hot.L; if(L.kind==='mock_run'&&L.phase==='open'&&L.oPhase!=='done') startOpenTimer(); }
  if(hot&&hot.ONB) ONB=hot.ONB; if(hot&&hot.P) P=hot.P; if(hot&&hot.V) V=hot.V; if(hot&&hot.T) T=hot.T; if(hot&&hot.CV) CV=hot.CV;
  render();
  (async()=>{
    if(!window.claude?.use) return;
    const [d,u,s]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]);
    sampleFn=s; aiReady=!!s;
    if(d&&u){ try{ uid=await u.id(); }catch(e){ uid=null; } if(uid){ db=d; dbDoc=d.doc('data/users/'+uid+'/state'); try{ const snap=await dbDoc.get(); if(snap.exists){ const remote=migrate(JSON.parse(JSON.stringify(snap.data()))); if((remote.updatedAt||0)>(S.updatedAt||0)){ S={...S,...remote}; persistLocal(); } else if((S.updatedAt||0)>(remote.updatedAt||0)) pushDb(); } else if(S.updatedAt) pushDb(); }catch(e){} } }
    render();
  })();
}
window.claude?.hot?.snapshot?.(()=>({L,ONB,P,V,T,CV}));
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data??{});
</script>

</body></html>
