<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B7D5F"></head><body>
<title>Мидл-собес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centred column of stacked sheets (max 760px). A run (lesson, review, mock) is a single focused card: hairline progress on top, feedback footer and action row stuck to the bottom. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EEE9; --fg:#152019; --muted:#5E6B64; --line:#D7DFD8;
  --accent:#0B7D5F; --accent-ink:#FFFFFF; --accent-soft:#D5F0E3;
  --good:#1E8A4B; --good-soft:#DCF3E3; --bad:#C43D2B; --bad-soft:#FAE2DD; --warn:#A8690B; --warn-soft:#FBEDD0;
  --display:'Unbounded','Arial Black',sans-serif; --body:'Golos Text','Helvetica Neue',Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(21,32,25,.06),0 8px 24px -12px rgba(21,32,25,.18); --cta:84px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161D19; --surface-2:#1E2722; --fg:#E6EDE8; --muted:#95A39B; --line:#2A3530;
  --accent:#36C494; --accent-ink:#06211A; --accent-soft:#153A2D;
  --good:#4CCB7A; --good-soft:#163A26; --bad:#F0806D; --bad-soft:#3E1F19; --warn:#E3A93B; --warn-soft:#3A2B12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161D19; --surface-2:#1E2722; --fg:#E6EDE8; --muted:#95A39B; --line:#2A3530;
  --accent:#36C494; --accent-ink:#06211A; --accent-soft:#153A2D;
  --good:#4CCB7A; --good-soft:#163A26; --bad:#F0806D; --bad-soft:#3E1F19; --warn:#E3A93B; --warn-soft:#3A2B12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(22px,4.5vw,30px)}
h2{font-size:clamp(18px,3.6vw,22px)}
h3{font-size:15px;font-weight:500}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--cta) + env(safe-area-inset-bottom,0px));min-height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.hair{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.hair i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease}
.hair i.warn{background:var(--warn)} .hair i.bad{background:var(--bad)}
.top .meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);margin-block:6px 14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* sheets */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stack{display:grid;gap:16px}
.tight{gap:10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:14px 20px;font-weight:600;border:1px solid transparent;transition:transform .08s ease,background .15s ease;min-height:48px;text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.soft{background:var(--surface-2)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn .sub{font-size:12px;font-weight:500;opacity:.85}
.btn.col{flex-direction:column;gap:2px;line-height:1.25;padding-block:12px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:14px}
.actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent);display:grid;gap:8px;z-index:6}
.actions > *{max-width:728px;width:100%;margin:0 auto}
.footer-fb{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:6;border-top:1px solid transparent}
.footer-fb.good{background:var(--good-soft)} .footer-fb.bad{background:var(--bad-soft)}
.footer-fb .in{max-width:728px;margin:0 auto;display:grid;gap:10px}
.footer-fb b{display:flex;align-items:center;gap:8px;font-size:16px}
.footer-fb.good b{color:var(--good)} .footer-fb.bad b{color:var(--bad)}
.footer-fb p{font-size:14px}
.footer-fb .row{gap:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;font-family:var(--mono)}
.badge.soft{background:var(--surface-2);color:var(--muted)}

/* onboarding */
.onb-title{display:grid;gap:6px;margin-block:8px 20px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bignum{text-align:center;padding-block:20px 8px}
.bignum b{font-family:var(--display);font-size:clamp(48px,12vw,76px);font-weight:700;line-height:1;display:block;letter-spacing:-.02em}
.bignum span{font-size:15px;color:var(--muted)}
.bignum .when{margin-top:8px;font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{display:grid;gap:10px;justify-items:start;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:104px;position:relative;line-height:1.3;font-size:14px;font-weight:500}
.tile svg{width:28px;height:28px;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"] svg{color:var(--accent)}
.tile .chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;align-items:center;justify-content:center}
.tile[aria-pressed="true"] .chk{display:inline-flex}
.tile .chk svg{width:12px;height:12px;color:inherit}
.tile:disabled{opacity:.4;cursor:not-allowed}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.goal{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative}
.goal b{display:block;font-weight:600;font-size:15px}
.goal span{font-size:13px;color:var(--muted)}
.goal .rec{position:absolute;top:-9px;right:12px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:99px}
.goal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.goal .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center}
.goal[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.goal .chk svg{width:12px;height:12px;display:none}
.goal[aria-pressed="true"] .chk svg{display:block}
input[type="date"]{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* deck */
.hero{display:grid;gap:12px}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.statline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.statline b{color:var(--fg);font-family:var(--mono)}
.week{display:flex;gap:6px;align-items:center}
.week .d{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted);flex:none}
.week .d.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week .d.today{border-color:var(--accent);border-style:dashed}
.week .d svg{width:14px;height:14px}
.mentor{display:flex;gap:12px;align-items:flex-start}
.ava{width:40px;height:40px;border-radius:50%;flex:none;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.ava svg{width:40px;height:40px}
.bubble{background:var(--surface-2);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:15px;max-width:60ch}
.chapter{display:grid;gap:8px}
.chapter-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.chapter-head.focus{outline:3px solid var(--accent-soft)}
.chapter-head .n{font-family:var(--mono);font-size:12px;opacity:.8}
.chapter-head .t{font-weight:600;flex:1;min-width:0}
.chapter-head .c{font-family:var(--mono);font-size:12px;opacity:.9;white-space:nowrap}
.lesson{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent}
.lesson:hover{background:var(--surface-2)}
.lesson .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.lesson .dot svg{width:18px;height:18px}
.lesson.done .dot{background:var(--good-soft);color:var(--good);border-color:transparent}
.lesson.next .dot{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lesson .body{flex:1;min-width:0}
.lesson .body b{font-weight:500;display:block}
.lesson .body span{font-size:12px;color:var(--muted)}
.lesson .body .ask{color:var(--warn);font-weight:600}
.lesson .body .nx{color:var(--accent);font-weight:600}
.lesson .score{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.lesson.done .score{color:var(--good)}
.today{display:grid;gap:8px}
.today .lesson{background:var(--surface);border-color:var(--line)}
.card-cta{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.card-cta .ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card-cta .ico svg{width:20px;height:20px}
.card-cta .body{flex:1;min-width:0}
.card-cta .body b{display:block;font-weight:600}
.card-cta .body span{font-size:13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tool{display:grid;gap:6px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative}
.tool b{font-weight:600;display:flex;align-items:center;gap:8px}
.tool span{font-size:13px;color:var(--muted)}
.tool:disabled{opacity:.55;cursor:not-allowed}
.topic{display:grid;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.topic .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.topic .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.topic .bar i.weak{background:var(--warn)} .topic .bar i.none{background:var(--line)}
.topic .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* run */
.summary{display:grid;gap:10px;padding-left:0;margin:0;list-style:none}
.summary li{display:flex;gap:10px;line-height:1.45}
.summary li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:9px}
.qtext{font-size:17px;font-weight:600;line-height:1.35;margin-block:4px 8px;text-wrap:pretty}
.opts{display:grid;gap:12px}
.opt{display:grid;gap:4px;text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;line-height:1.35;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .ex{font-size:13px;color:var(--muted);display:none}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.correct .ex,.opt.wrong .ex{display:block}
.opt.dim{opacity:.5}
.tblwrap{overflow-x:auto;margin-block:4px 8px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.result{display:grid;gap:12px;text-align:center;justify-items:center;padding-block:12px}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700}
.qlist{display:grid;gap:6px}
.qlist details{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qlist summary{cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14px;list-style:none}
.qlist summary::-webkit-details-marker{display:none}
.qlist .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.qlist .mark.ok{background:var(--good-soft);color:var(--good)} .qlist .mark.no{background:var(--bad-soft);color:var(--bad)}
.qlist p{font-size:13px;color:var(--muted);margin-top:8px}
.openq{display:grid;gap:10px}
.openq .q{font-weight:600;font-size:16px}
textarea.ans{width:100%;min-height:140px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);resize:vertical;line-height:1.45}
textarea.ans:focus{outline:2px solid var(--accent);border-color:transparent}
.hintlist{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:4px}
.ai{display:grid;gap:10px;padding:14px;border-radius:var(--r);border:1px dashed var(--line)}
.ai .score{display:flex;gap:4px;align-items:center}
.ai .score i{width:14px;height:14px;border-radius:3px;background:var(--surface-2)}
.ai .score i.on{background:var(--accent)}
.ai ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.ai .better{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;white-space:pre-wrap}
.ai .fu{background:var(--surface-2);border:0;border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;width:100%}
.note{font-size:13px;color:var(--muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
details.set{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.set summary{cursor:pointer;font-weight:500}
.timer{display:grid;gap:6px}
.timer .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s linear}
.timer .bar i.think{background:var(--line)} .timer .bar i.warn{background:var(--warn)} .timer .bar i.bad{background:var(--bad)}
.timer .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.confirm{display:grid;gap:8px;padding:14px;border-radius:var(--r);background:var(--warn-soft)}
.echo{display:grid;gap:4px;font-size:14px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.explain{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:pre-wrap;text-align:left}
.hist{display:grid;gap:6px}
.hist details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.hist summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px;list-style:none}
.hist summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.sheet{padding:16px}.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
// ---------- constants ----------
const CH = [];
const ORDER = ['format','job','product','research','cases','whiteboard','design','ui','portfolio','process','ai','behavior'];
const ASK = new Set(['format-2','cases-1','cases-2','cases-3','product-1','product-4','research-2','whiteboard-1','design-2','ui-1','process-2','ai-1','behavior-1','behavior-3']);
const PAINS = [
  {id:'job',   t:'Не зовут на собеседования',             ch:['job']},
  {id:'ask',   t:'Не знаю, что спросят',                  ch:['format']},
  {id:'cases', t:'Путаюсь, когда рассказываю кейсы',       ch:['cases']},
  {id:'metrics',t:'Плаваю в метриках и цифрах',            ch:['product']},
  {id:'research',t:'Слабо знаю исследования',              ch:['research']},
  {id:'wb',    t:'Теряюсь на whiteboard-задачах',          ch:['whiteboard']},
  {id:'flow',  t:'Не умею раскладывать сценарии и IA',     ch:['design']},
  {id:'ui',    t:'Не хватает базы по UI и системам',       ch:['ui']},
  {id:'craft', t:'Слабые портфолио и визуал',              ch:['portfolio']},
  {id:'process',t:'Не понимаю процессы в команде',         ch:['process']},
  {id:'ai',    t:'Не понимаю, что спросят про ИИ',         ch:['ai']},
  {id:'fail',  t:'Боюсь вопросов про провалы и конфликты', ch:['behavior']},
  {id:'money', t:'Не умею говорить о деньгах',             ch:['behavior']},
  {id:'argue', t:'Слабо аргументирую решения',             ch:['cases','process']},
  {id:'any',   t:'Везде понемногу',                        ch:[]},

 {id:'format-1', title:'Этапы найма и кто что оценивает', ask:true,

   {t:'Вам дали «критику приложения»: онбординг известного продукта, просят предложить редизайн шага активации. С чего начнут сильные кандидаты?', o:['С уточнения контекста: кто пользователь, что считается активацией, какая метрика падает','С быстрого аудита экрана по эвристикам Нильсена, чтобы сразу показать найденные проблемы','С разбора конкурентов: как устроена активация у трёх-четырёх лидеров этой ниши','С пары скетчей нового шага, чтобы показать скорость мышления и не терять время'], c:0, e:['Сначала рамка задачи и метрика, потом гипотезы и решение, и именно так оценивают продуктовое мышление.','Эвристики пригодятся как аргументы позже, но без понимания цели аудит превращается в список придирок.','Конкуренты полезны как источник идей, но без своей метрики и пользователя непонятно, что из них брать.','Скетчи до понимания задачи — классический провал формата: решение есть, а проблема не названа.'], d:2},
   {t:'На встрече с разработчиком тимлид спрашивает, как вы передаёте макеты. Какой ответ покажет уровень мидла?', o:['«Собираю всё в Dev Mode с UI-китом и даю ссылку, там разработчик найдёт любые размеры»','«Показываю макеты на груминге, отвечаю на вопросы, а дальше команда сама ведёт реализацию»','«Делаю макеты пиксель-в-пиксель под все брейкпоинты, чтобы у команды не было вопросов»','«Описываю состояния и edge cases, отвечаю на вопросы и проверяю реализацию до релиза»'], c:3, e:['Dev Mode отдаёт размеры, но не логику: без описанных состояний разработчик будет додумывать сам.','Показ на груминге полезен, но без описания граничных случаев и проверки реализации расхождения всплывут уже в проде.','Идеальные макеты не отвечают на вопросы про пустые, ошибочные и загрузочные состояния.','Handoff — это состояния, граничные случаи и авторский надзор, и именно этого ждут от мидла.'], d:2},
   {t:'Что обычно проверяет HR на первом 30-минутном звонке?', o:['Глубину продуктового мышления на примере одного кейса из вашего портфолио','Совпадение по вилке, формату работы и уровню, адекватность коммуникации','Владение Figma и дизайн-системами: компоненты, варианты, переменные, токены','Знание продуктовых метрик и умение связать с ними свои дизайн-решения'], c:1, e:['Продуктовое мышление разбирает лид на портфолио-ревью, у HR нет экспертизы, чтобы его оценить.','Скрининг — фильтр по базовым параметрам и первое впечатление о том, как вы общаетесь.','Навыки в Figma смотрит лид по файлам или на тестовом, а не рекрутер на звонке.','Метрики обсуждает продакт на кросс-функциональной встрече, а не HR на первом звонке.'], d:1},
   {t:'Рекрутер попросил прислать 2–3 ссылки на кейсы до звонка. Что отправить?', o:['Ссылку на портфолио целиком, чтобы рекрутер и лид сами выбрали подходящие работы','Три кейса, ближе всего к домену вакансии, с результатом в первом абзаце','Три самых визуально сильных кейса, потому что на пре-скрининге оценивают картинку','Три самых свежих кейса за последний год, чтобы показать актуальный уровень'], c:1, e:['Никто не будет искать нужное среди пятнадцати работ, поэтому выбор нужно сделать за читателя.','Пре-скрининг по кейсам сейчас норма: релевантность и результат решают, позовут ли на встречу.','Красивые экраны без связи с доменом и результатом редко убеждают лида позвать на встречу.','Свежесть сама по себе не аргумент, если кейсы не про задачи этой вакансии и без результата.'], d:2},
   {t:'Продакт на кросс-функциональной встрече спрашивает: «Как вы поймёте, что ваш дизайн сработал?». Что он проверяет на самом деле?', o:['Знаете ли вы продуктовые метрики и умеете ли считать конверсию по шагам воронки','Мыслите ли вы результатом: метрика заранее и отделение эффекта дизайна от шума','Готовы ли вы проверять каждое изменение A/B-тестом, а не выкатывать его сразу','Умеете ли вы сами собирать дашборды в Amplitude, не дёргая каждый раз аналитика'], c:1, e:['Знание определений — лишь база, продакта интересует, думаете ли вы об эффекте заранее.','Продакт ищет дизайнера, который выбирает метрику до релиза и честно оценивает причинность.','A/B-тест — один из методов, а вопрос про мышление результатом, а не про любимый инструмент.','Владение Amplitude — полезная деталь, но вопрос о том, как вы определяете успех.'], d:3},

 {id:'format-2', title:'Джун, мидл, сеньор: где проходит граница', ask:true,

   {t:'Какой признак точнее всего отличает мидла от джуна в глазах нанимающего лида?', o:['Уверенно владеет Figma: Auto Layout, варианты, переменные и сложные прототипы','Делает визуально сильные кейсы и убедительно презентует их команде','Приходит к продакту с вариантами и аргументами, а не с вопросом «что рисовать»','Быстро закрывает задачи из бэклога и почти не возвращает макеты на доработку'], c:2, e:['Уверенный Figma бывает и у джуна, так что инструмент сам по себе не говорит о грейде.','Презентация важна, но не заменяет самостоятельность в постановке и решении задачи.','Именно так лиды описывают автономность мидла: он сам структурирует задачу.','Скорость по готовой постановке — сильный джун, а мидл ещё и формирует саму постановку.'], d:1},
   {t:'Лид открыл ваш тестовый файл и видит произвольные отступы, цвета вне стилей и слои без Auto Layout. Как это считывается?', o:['Простительно для тестового: в сжатые сроки важнее показать идею и логику сценария','Как техдолг, который становится критичным только при передаче в разработку','Как зона роста, которую лид закроет на онбординге, если кейсы в целом сильные','Как базовая ошибка: порядок в файле мидл обязан поддерживать сам'], c:3, e:['Файл смотрят всегда, и для мидла идея без аккуратного исполнения не считается аргументом.','Беспорядок ломает ревью и доверие ещё до разработки, а не только на этапе handoff.','Лиды не готовы доучивать мидла базовой гигиене файла, чаще это просто отказ.','Нанимающие прямо называют это недопустимым для мидла и сеньора.'], d:1},
   {t:'Продакт принёс задачу: «сделай экран оплаты как у конкурента N». Что сделает мидл?', o:['Возьмёт экран конкурента за основу и аккуратно адаптирует его к своей дизайн-системе','Уточнит проблему и метрику, посмотрит конкурентов как источник и предложит 2–3 направления','Сначала запросит полноценное исследование пользователей и до него не начнёт дизайн','Быстро сделает как просили, а после релиза предложит улучшения на основе данных'], c:1, e:['Скопировать и натянуть на свою систему — самый слабый сценарий: неизвестно, решает ли он вашу проблему.','Рамка задачи, несколько направлений и аргументированный выбор — это и есть уровень мидла.','Исследование может понадобиться, но блокировать работу до него — избыточно для такой задачи.','Сначала сделать как сказали — потерянная итерация, ведь вопросы о цели задают до работы.'], d:3},
   {t:'Что из этого — зона ответственности сеньора, а не мидла?', o:['Аккуратный файл с Auto Layout, стилями и токенами, готовый к передаче в разработку','Направление дизайна продукта на квартал и рост других дизайнеров в команде','Самостоятельное проведение 5–7 интервью и синтез выводов для своей задачи','Аргументированная защита своего решения перед продактом и разработкой'], c:1, e:['Порядок в файле — база, которая обязательна уже для мидла.','Стратегия направления и развитие людей — то, что отличает сеньора.','Исследования для своих задач мидл проводит сам, не дожидаясь исследователя.','Защищать свои решения перед командой мидл должен уметь сам.'], d:2},
   {t:'Вы мидл, задача пришла без понятной цели. Самый слабый из вариантов поведения?', o:['Задать продакту несколько вопросов о цели и метрике, прежде чем открывать Figma','Предложить продакту два варианта рамки задачи и согласовать один из них','Подождать, пока продакт допишет требования, чтобы потом не переделывать','Письменно зафиксировать допущения и начать работу, если продакт недоступен'], c:2, e:['Вопросы о цели до работы — нормальный и ожидаемый шаг мидла.','Это сильный шаг: вы сами структурируете задачу и снимаете неопределённость.','Ожидание готовых требований — поведение джуна, мидл собирает их сам.','Письменные допущения — приемлемый путь, когда продакт недоступен: их легко проверить позже.'], d:2},
   {t:'Лид говорит: «Мы не берём мидла, который полирует первую идею». Что он имеет в виду?', o:['Нужно меньше времени тратить на визуал и больше на логику пользовательского сценария','До детализации нужно сравнить несколько разных направлений и объяснить выбор','Нужно делать по 5–10 вариаций каждого экрана перед тем, как показать продакту','Первую идею лучше отбрасывать, потому что обычно она самая очевидная и слабая'], c:1, e:['Речь не о соотношении визуала и логики: отполировать можно и сценарий, не рассмотрев альтернатив.','Это и называют признаком мидла: варианты, аргументированный выбор, потом детализация.','Количество вариаций одного экрана не самоцель, важна принципиальная разница направлений.','Первая идея вполне может победить, но только после честного сравнения с альтернативами.'], d:1},
  ]},
 {id:'format-3', title:'Красные флаги и ошибки кандидатов', ask:false,
  open:{q:'Почему вы уходите с текущего места и что ищете в новом? Ответьте так, как ответили бы интервьюеру.', hint:['Про то, чего не хватает и куда хотите расти, а не про плохого работодателя','Конкретные задачи и зона ответственности, которых хотите','Связка с тем, что есть в этой вакансии']},
  summary:[
   'Главные красные флаги для лидов: нытьё про прошлого работодателя, размытый личный вклад («мы сделали»), копирование конкурентов, неумение рассказать про ошибку.',
   'Проблема 2026 года: с помощью ИИ кандидаты хорошо «упаковывают» резюме и кейсы, но на испытательном сроке не показывают того же уровня. Поэтому на собесе проверяют живое рассуждение.',
   'Портфолио из одинаковых ИИ-сгенерированных экранов читается как отсутствие вкуса, а полное отсутствие ИИ в процессе — как отставание. Нужен баланс и честный показ процесса.',
   'Токсичность на собеседовании перевешивает сильные харды: команды выбирают того, с кем удобно работать.',
  ], q:[
   {t:'Вопрос «почему уходите с текущего места?». Какой ответ безопаснее и честнее?', o:['«Руководство не понимает ценности дизайна, и мои решения постоянно урезают»','«Рынок вырос, а пересмотра зарплаты не было два года, поэтому смотрю варианты»','«Хочу сложных продуктовых задач и влияния на метрики, на текущем месте потолок»','«Устал от легаси-проекта, хочется просто чего-то нового и более интересного»'], c:2, e:['Даже обоснованная жалоба на руководство считывается лидом как красный флаг и риск конфликта.','Деньги — нормальная причина, но как единственный мотив она не говорит, зачем вам именно эта команда.','Рассказ о том, чего не хватает и куда хотите расти, считывается как зрелость и мотивация.','Усталость без цели звучит как бегство, а не как осознанный выбор следующего шага.'], d:1},
   {t:'Кандидат показывает кейс, где он «вместе с командой переделал весь продукт». Какой уточняющий вопрос почти наверняка задаст лид?', o:['«Сколько экранов и пользовательских сценариев вошло в итоговый редизайн?»','«На какой дизайн-системе вы собирали макеты и сколько в ней компонентов?»','«Как редизайн восприняли руководство и ключевые стейкхолдеры компании?»','«Что именно сделали лично вы и какие решения были вашими?»'], c:3, e:['Объём работы ничего не говорит о вашем вкладе, если её делала вся команда.','Детали дизайн-системы вторичны, пока неясно, какую роль в проекте играли именно вы.','Реакция стейкхолдеров — не метрика и не ответ на главный вопрос о вашем вкладе.','Личный вклад — обязательный вопрос при формулировке «мы сделали», готовьте честный ответ заранее.'], d:1},
   {t:'На встрече вас спрашивают, как вы используете ИИ в работе. Какой ответ сыграет в плюс?', o:['«Стараюсь не использовать: опасаюсь, что ИИ размывает авторский стиль и вкус»','«Для черновиков, синтеза исследований и прототипов, а решения принимаю сам»','«Генерирую экраны в нейросети целиком, а потом дорабатываю их под систему»','«Только для текстов в интерфейсе, в самом дизайне ИИ пока скорее мешает»'], c:1, e:['73% дизайн-менеджеров в опросе Figma 2026 видят растущую потребность в ИИ-навыках, отказ читается как отставание.','Инструмент плюс собственное суждение о результате — именно то, что хотят услышать.','Генерация экранов целиком без собственного суждения и даёт те самые одинаковые портфолио.','Узкое применение только для текстов показывает, что вы не встроили ИИ в процесс и теряете скорость.'], d:2},
   {t:'Какой из ответов на «расскажите о своей ошибке» — красный флаг?', o:['«Выбрал вариант без теста, он провалился, теперь проверяю идеи коридорным тестом»','«Серьёзных ошибок не припомню, обычно всё заранее согласовываю с командой»','«Недооценил сроки разработки, теперь зову разработчика на этапе вариантов»','«Задавал наводящие вопросы на интервью, получил ложные выводы и переделал гайд»'], c:1, e:['Конкретная ошибка и изменение процесса после неё — хороший ответ.','Отсутствие ошибок лиды читают как отсутствие рефлексии или как неправду.','Названа причина и вывод для процесса, так что это сильный ответ.','Честное признание методической ошибки и исправление гайда — признак зрелости.'], d:1},
   {t:'Лид листает портфолио и видит десять одинаковых «ИИ-экранов» с градиентами и стеклом. Какой вывод он сделает скорее всего?', o:['Кандидат следит за трендами и быстро адаптируется под актуальный визуал','У кандидата нет собственного суждения о визуале и задаче за экранами','Кандидат умеет работать с ИИ и выдаёт большой объём работы в короткий срок','Ничего особенного: стиль вторичен, всё решат кейсы и разговор о процессе'], c:1, e:['Одинаковость считывается как отсутствие вкуса, а не как следование трендам.','Нанимающие прямо называют одинаковые ИИ-портфолио сигналом отсутствия суждения.','Скорость генерации не компенсирует отсутствие собственного взгляда на задачу.','Портфолио — первый фильтр, и такой визуал часто отсекает кандидата ещё до разговора.'], d:2},
   {t:'Кандидат на встрече с командой резко критикует решения прошлых коллег и шутит про «тупых продактов». Харды у него сильные. Что обычно происходит?', o:['Его берут, но на испытательном сроке ограждают от прямой работы с продактами','Его не берут: токсичность в команде перевешивает сильные харды','Его берут, если нанимающий лид готов поручиться и взять адаптацию на себя','Его зовут на ещё одну встречу, чтобы проверить, не было ли это случайностью'], c:1, e:['Дизайнер без контакта с продактами не может делать свою работу, так что такой вариант не рассматривают.','Команды выбирают того, с кем удобно работать, и прямо говорят, что харды тут не спасают.','Лиды редко рискуют командой ради одного кандидата, когда токсичность проявилась уже на собеседовании.','Дополнительная встреча — лишние затраты, когда красный флаг уже явный, поэтому обычно просто отказывают.'], d:3},
  ]},
]});

<script>
CH.push({id:'product', title:'Продуктовое мышление и метрики', lessons:[
 {id:'product-1', title:'Метрики, о которых спросят', ask:true,
  open:{q:'Какие метрики вы выберете, чтобы оценить редизайн онбординга в мобильном приложении, и какие метрики-ограничители поставите рядом?', hint:['Целевая: активация — доля дошедших до ключевого действия','Ограничители: отток, обращения в поддержку, время до первого действия','Как измерите: A/B, период, сегменты']},
  summary:[
   'Воронка AARRR: привлечение → активация → удержание → доход → рекомендации. Дизайнер чаще всего работает с активацией, удержанием и конверсией шагов.',
   'Конверсия — доля перешедших с шага на шаг. Retention — доля вернувшихся через N дней (D1, D7, D30). Churn — обратная сторона удержания.',
   'North Star Metric — одна метрика ценности продукта (например, «заказов на активного пользователя в неделю»). Guardrail-метрики — ограничители, которые не должны ухудшиться: отток, жалобы, время задачи.',
   'HEART от Google — рамка UX-метрик: Happiness, Engagement, Adoption, Retention, Task success. Для каждой цели выбирают сигнал и метрику.',
  ], q:[
   {t:'Вы переделали форму оформления заказа. Какая метрика прямо покажет эффект?', o:['Средний чек: удобная форма побудит заказывать больше','Retention D30 всех пользователей приложения','Конверсия из корзины в успешную оплату заказа','Число добавлений товаров в корзину за сессию'], c:2, e:['На средний чек влияют ассортимент и цены, а форма оформления почти не меняет состав корзины.','D30 зависит от множества факторов и слишком далеко от изменённого шага, эффект в нём утонет.','Это конверсия именно того шага, который вы изменили, поэтому эффект будет виден напрямую.','Добавления в корзину происходят до формы оформления, так что её редизайн на них не влияет.'], d:1},
   {t:'Что такое retention D7?', o:['Доля пользователей, вернувшихся в продукт на 7-й день после первого визита','Доля пользователей, которые за первые 7 дней ни разу не удалили приложение','Доля пользователей, заходивших в продукт хотя бы раз за последние 7 дней','Доля новых пользователей, совершивших целевое действие за первые 7 дней после установки'], c:0, e:['Это классическое определение удержания N-го дня: возврат именно на седьмой день от первого визита.','Неудалённое приложение не значит, что человек им пользуется: удержание считают по возвратам, а не по установкам.','Это похоже на недельную аудиторию (WAU), она не привязана к дате первого визита когорты.','Целевое действие в первые дни — это метрика активации, а не удержания.'], d:1},
   {t:'Какую метрику поставить ограничителем при редизайне, который сокращает онбординг с 5 шагов до 2?', o:['Доля новых пользователей, дошедших до конца сокращённого онбординга','Среднее время прохождения онбординга от первого до последнего экрана','Оценка нового онбординга в коротком опросе сразу после его завершения','Доля тех, кто не нашёл нужную настройку и написал в поддержку'], c:3, e:['Доходимость онбординга — целевая метрика редизайна, а ограничитель должен ловить побочный ущерб.','Сокращение времени — ожидаемый эффект изменения, а не риск, за которым нужно следить.','Оценка сразу после онбординга не покажет проблем, которые возникнут позже из-за пропущенных шагов.','Короче не значит лучше: ограничитель показывает, не выросли ли проблемы позже из-за убранных шагов.'], d:2},
   {t:'Продакт говорит: «Наша North Star — выручка». Что здесь не так с точки зрения продуктовой логики?', o:['Ничего: выручка понятна всем, её легко измерять, и она объединяет все команды продукта','Выручка — следствие; NSM отражает ценность для пользователя, которая к ней ведёт','North Star лучше сделать метрикой роста аудитории, например MAU, а не денег','Выручку стоит заменить на NPS, ведь лояльность пользователей важнее денег'], c:1, e:['Выручка — запаздывающий показатель, команды не могут управлять ею напрямую своими решениями.','NSM — метрика ценности (например, доставленных заказов в неделю), которая предсказывает выручку.','MAU показывает охват, но не ценность: люди могут заходить и не получать результата.','NPS — опросная метрика отношения, она плохо связана с поведением и не годится как North Star.'], d:3},
   {t:'В рамке HEART «Task success» измеряется через…', o:['Долю успешно завершённых задач, время на задачу и число ошибок','Частоту и глубину использования: сессии в неделю, действия за сессию','Долю пользователей, впервые попробовавших новую функцию за период','Удовлетворённость после сценария по опросу, например CSAT или SUS'], c:0, e:['Task success — именно про завершение задачи, время и ошибки.','Частота и глубина использования относятся к категории Engagement.','Первое использование новой функции — это категория Adoption.','Опросная удовлетворённость относится к Happiness, это отношение, а не результат задачи.'], d:2},
   {t:'За месяц DAU выросли на 20%, а retention D7 упал с 35% до 28%. Какое объяснение наиболее вероятно?', o:['Продукт стал вовлекать сильнее, а падение D7 — сезонный шум в пределах нормы','Пришёл поток менее целевого трафика: новых больше, но они хуже удерживаются','Последний редизайн ухудшил продукт, а рост DAU дали старые пользователи','Retention считают по когортам, а DAU по дням, поэтому их нельзя сопоставлять'], c:1, e:['Падение удержания на 7 п.п. слишком велико для шума и не говорит об улучшении продукта.','Типичная картина маркетинговых кампаний: приходит больше людей, а остаётся меньшая доля.','Если продукт стал хуже для всех, старая аудитория вряд ли дала бы рост DAU на 20%.','Метрики связаны: DAU складывается из новых и удержанных пользователей, их динамику сравнивают.'], d:2},
  ]},
 {id:'product-2', title:'Гипотезы и приоритизация', ask:true,
  open:{q:'Расскажите, как вы формулируете и приоритизируете гипотезы. Приведите пример из работы.', hint:['Шаблон: если изменим X для сегмента Y, то метрика Z вырастет, потому что…','RICE/ICE или другой способ ранжирования с честными оценками','Что отбросили и почему']},
  summary:[
   'Шаблон гипотезы: «Если мы изменим X для сегмента Y, то метрика Z изменится на столько-то, потому что…». В вакансиях встречается форма «Пользователь → Действие → Ожидаемый эффект».',
   'Цикл HADI: гипотеза → действие → данные → выводы. Не каждая гипотеза требует A/B-теста: иногда достаточно коридорного теста или прототипа.',
   'RICE = Reach × Impact × Confidence / Effort. ICE — упрощённая версия без охвата. Главное не формула, а честная оценка и готовность обсуждать её с командой.',
   'Лиды ценят дизайнера, который прорабатывает много гипотез и не хватается за первую идею.',
  ], q:[
   {t:'Какая формулировка — гипотеза, а не пожелание?', o:['«Если упростить онбординг и убрать лишние шаги, пользователям станет удобнее и продукт им понравится больше»','«Новички не понимают ценность продукта, поэтому 60% уходят с первого экрана, и это нужно срочно исправить»','«Добавим анимацию и интерактивные подсказки на первом экране, чтобы новички быстрее разобрались в продукте»','«Если показать новичкам пример результата на первом экране, доля дошедших до первого действия вырастет с 40% до 48%: станет ясна ценность»'], c:3, e:['Есть изменение, но нет измеримой метрики и ожидаемого эффекта, поэтому проверить это нельзя.','Это описание проблемы с цифрой, но в нём нет предлагаемого изменения и ожидаемого результата.','Это задача на решение с намерением, но без метрики и цифры, по которой можно понять успех.','Изменение, сегмент, метрика, ожидаемый эффект и причина — это полная проверяемая гипотеза.'], d:1},
   {t:'По RICE две идеи: А — reach 10 000, impact 2, confidence 80%, effort 4; Б — reach 2 000, impact 3, confidence 50%, effort 1. Что выше в приоритете?', o:['Б: 2 000 × 3 × 0,5 / 1 = 3 000 против 1 600 у А','А: 10 000 × 2 × 0,8 / 4 = 4 000 против 3 000 у Б','Равны: если брать confidence в процентах, обе дают одинаковый балл','Б: у неё выше impact и в 4 раза ниже effort, это перевешивает охват'], c:1, e:['Расчёт Б верный, но у А ошибка: 10 000 × 2 × 0,8 / 4 = 4 000, а не 1 600.','Считаем по формуле: А = 10 000 × 2 × 0,8 / 4 = 4 000, Б = 2 000 × 3 × 0,5 / 1 = 3 000, поэтому большой охват А перевешивает её высокую трудоёмкость.','В процентах получится 400 000 против 300 000: масштаб меняется, но А всё равно впереди.','RICE не сравнивает факторы по отдельности, решает итоговый балл, а он у А выше.'], d:3},
   {t:'Продакт хочет проверить 6 гипотез за спринт A/B-тестами. Что ответит мидл?', o:['Запустить все шесть параллельно на разных экранах продукта, чтобы тесты не пересекались по аудитории','Объединить шесть гипотез в один большой тест редизайна, чтобы уложиться в трафик и сроки','Отсеять слабые гипотезы дёшево (прототип, коридорный тест), а в A/B отдать 1–2 с достаточным трафиком','Запускать гипотезы по очереди, каждую на 2–3 дня, чтобы все успели пройти за спринт'], c:2, e:['Трафик делится на шесть тестов, и каждому не хватит выборки для надёжного вывода.','В общем тесте не понять, какая из шести гипотез дала эффект, а какая навредила.','Дешёвые проверки до дорогих и тесты только с достаточным трафиком — так работает зрелая команда.','Два-три дня не покрывают недельный цикл и дают завышенные из-за новизны результаты.'], d:2},
   {t:'Что означает «confidence» в RICE?', o:['Насколько команда уверена в своих оценках охвата и влияния','Вероятность, что фичу успеют сделать в срок с текущими ресурсами','Доля пользователей, которые по прогнозу воспользуются фичей','Уровень значимости, с которой гипотеза уже подтверждена тестом'], c:0, e:['Это уверенность в оценках: опираются они на данные или это догадка команды.','Сроки и ресурсы учитываются в effort, а confidence относится к оценкам эффекта.','Число пользователей, которых затронет фича, — это reach, а не confidence.','Confidence — экспертная оценка до проверки, а не результат статистического теста.'], d:1},
   {t:'Команда из 12 гипотез выбрала одну с самым высоким ICE и сразу пошла в разработку на два спринта. Что пропущено?', o:['Пересчёт приоритета по RICE: без охвата ICE мог завысить идею для узкого сегмента','Дешёвая проверка гипотезы до разработки: прототип, коридорный тест или опрос','Согласование выбранной гипотезы со всеми стейкхолдерами, чтобы не спорить потом','Параллельная разработка второй по ICE гипотезы, чтобы снизить риск промаха'], c:1, e:['Смена формулы даст другую оценку, но любая формула — лишь прогноз, а не проверка гипотезы.','Высокий ICE — это оценка, а не доказательство, поэтому перед дорогой разработкой гипотезу проверяют дёшево.','Согласование не отвечает на главный вопрос, сработает ли идея у пользователей.','Две непроверенные разработки удваивают затраты, а не снижают риск ошибиться.'], d:2},
   {t:'Дизайнер приносит продакту одну проработанную концепцию и настаивает на ней. Чем это плохо, даже если концепцию примут?', o:['Продакт почувствует давление и в следующий раз будет меньше доверять вашей экспертизе','Без сравнения продакт может принять слабую концепцию, а проблема всплывёт позже на ревью или в данных','Одна концепция — это долгая итерация: лучше было показать продакту сырые наброски на пару дней раньше','Разработка не успеет оценить трудоёмкость, если концепцию не обсудили с ней заранее'], c:1, e:['Отношения важны, но главный риск не в эмоциях продакта, а в качестве выбранного решения.','Нанимающие лиды описывают ровно этот сценарий как слабость мидла: нет сравнения направлений.','Скорость показа вторична: и ранний набросок одной идеи не даёт сравнения альтернатив.','Оценку трудоёмкости можно получить и после, а проблема в том, что альтернативы не рассмотрены.'], d:3},
  ]},
 {id:'product-3', title:'Бизнес-контекст и компромиссы', ask:false,
  open:{q:'Пользователям нужно одно, бизнесу — другое. Приведите пример такого конфликта из вашей практики и как вы его разрешили.', hint:['Конкретная ситуация с цифрами или сроками','Решение, которое не ломает доверие, а не компромисс «посередине»','Чем подтвердили результат']},
  summary:[
   'Знайте, на чём зарабатывает продукт: подписка, комиссия, реклама, транзакции. От модели зависят приоритеты: для подписки критично удержание, для маркетплейса — конверсия и повторные покупки.',
   'LTV (доход с пользователя за жизнь) должен заметно превышать CAC (стоимость привлечения). Дизайн влияет на LTV через удержание и на CAC через конверсию лендингов и онбординга.',
   'Конфликт пользователя и бизнеса решают не компромиссом «посередине», а поиском решения, которое не ломает доверие: тёмные паттерны дают короткий рост и длинный отток.',
   'Продакт отвечает за метрики, дизайнер — за найденное сильное решение и его аргументацию.',
  ], q:[
   {t:'Бизнес просит спрятать кнопку отмены подписки поглубже. Как ответит мидл?', o:['Оставит кнопку в настройках, но добавит три экрана подтверждения, чтобы человек передумал','Покажет риски (жалобы, регуляторика, доверие) и предложит паузу или оффер при отмене, измерив эффект','Согласится, но попросит продакта письменно зафиксировать решение, чтобы снять с себя ответственность','Предложит A/B-тест скрытой кнопки и оставит вариант, который лучше удерживает подписчиков'], c:1, e:['Цепочка подтверждений — тот же тёмный паттерн, который раздражает людей и привлекает регуляторов.','Честная альтернатива, которая тоже двигает метрику, — ответ зрелого дизайнера.','Бумага не снимает с дизайнера ответственности за продукт и не решает задачу удержания.','Тест покажет краткий выигрыш, но не учтёт отложенные потери доверия и жалобы.'], d:2},
   {t:'Для продукта по подписке главная метрика, на которую влияет дизайнер, — чаще всего…', o:['Конверсия из установки в пробный период','Длина сессии и глубина просмотра контента','Удержание и доля продлений подписки','Средний чек первой покупки за счёт апсейла'], c:2, e:['Триал важен, но без продлений привлечённые пользователи не окупают затраты на привлечение.','Длинные сессии не гарантируют, что человек продлит подписку, это косвенный сигнал.','Подписочная модель живёт на удержании и продлениях: именно они формируют выручку.','Апсейл в первой покупке разовый, а деньги подписки приносят повторные списания.'], d:1},
   {t:'Что такое CAC?', o:['Средний доход с одного платящего клиента за месяц','Стоимость привлечения одного нового клиента','Суммарные затраты на маркетинг за выбранный период','Стоимость одного клика в рекламной кампании'], c:1, e:['Средний доход с платящего клиента — это ARPPU, метрика дохода, а не затрат.','Customer Acquisition Cost — расходы на привлечение, делённые на число новых клиентов.','Общий бюджет ещё нужно разделить на число привлечённых клиентов, чтобы получить CAC.','Цена клика — это CPC, до клиента доходит лишь часть кликнувших.'], d:1},
   {t:'LTV = 1 200 ₽, CAC = 1 500 ₽. Что это значит для продукта и где может помочь дизайнер?', o:['Ситуация нормальная для старта: LTV положительный, а окупаемость придёт с ростом базы','Продукт теряет деньги на каждом клиенте; дизайн может поднять удержание (LTV) и конверсию (снизить CAC)','Продукт в минусе, но это зона маркетинга: дизайнер влияет на интерфейс, а не на юнит-экономику продукта','Нужно поднять цену подписки, а дизайнер переоформит пейволл, чтобы рост цены был незаметен'], c:1, e:['Положительный LTV не спасает, если привлечение стоит дороже, а рост базы лишь умножит убытки.','Так и формулируют вклад дизайнера в юнит-экономику: удержание и конверсия.','Удержание и конверсия онбординга — прямые рычаги дизайна, влияющие на LTV и CAC.','Маскировка цены — тёмный паттерн, который ударит по доверию и удержанию, то есть по LTV.'], d:2},
   {t:'Маркетплейс. Какая пара метрик наиболее важна для бизнеса, а значит, и для ваших решений?', o:['Конверсия в заказ и доля повторных покупок','Средняя длина сессии и глубина просмотра каталога','Число установок и доля включивших пуши','Число товаров в избранном и их рейтинг'], c:0, e:['Маркетплейс зарабатывает на транзакциях и их повторяемости.','Долгая сессия в маркетплейсе может означать, что человек не может найти товар.','Установки и пуши — про привлечение и каналы, а не про покупки.','Избранное — промежуточный сигнал интереса, который не всегда превращается в заказ.'], d:2},
   {t:'Продакт предлагает «таймер скидки», который сбрасывается при каждом заходе. Как это оценить?', o:['Рабочая механика срочности, если A/B-тест покажет рост конверсии без роста возвратов','Ложная срочность — тёмный паттерн: рост на время, затем потеря доверия и жалобы; лучше честный дедлайн','Допустимо, если сбрасывать таймер не при каждом заходе, а только раз в сутки для каждого пользователя','Нейтрально: такие таймеры есть у крупных маркетплейсов, и пользователи к ним уже привыкли'], c:1, e:['Тест за пару недель не поймает потерю доверия и жалобы, которые проявятся позже.','Так аргументируют отказ от тёмных паттернов и сразу предлагают честную альтернативу.','Ежесуточный сброс — та же ложная срочность, просто менее заметная.','Распространённость приёма не делает его честным и не снимает риск жалоб и претензий регулятора.'], d:3},
  ]},
 {id:'product-4', title:'Читаем аналитику: воронка и когорты', ask:true,
  open:{q:'Представьте, что вы открыли Amplitude или Метрику для своей ключевой воронки. Что вы смотрите в первые 10 минут и какие выводы можете сделать?', hint:['Воронка по шагам: где самый большой провал в абсолюте и в процентах','Сегменты: платформа, новые/старые, источник трафика','Когорты по неделям: меняется ли удержание после релизов']},
  summary:[
   'Воронка показывает долю пользователей, прошедших каждый шаг. Смотрите два числа: процент потерь на шаге и абсолютное число потерянных — самый большой процент не всегда самый важный шаг.',
   'Сегментируйте: платформа (iOS/Android/web), новые и вернувшиеся, источник трафика. Усреднённая воронка прячет проблему одного сегмента.',
   'Когортная таблица: строки — неделя первого визита, столбцы — неделя после. Падение в одном столбце у новых когорт после релиза — сигнал о проблеме релиза.',
   'Данные говорят «где», но не «почему»: за причиной идут в записи сессий и к пользователям. Проверяйте, что события настроены верно, прежде чем верить цифрам.',
  ], q:[
   {t:'Воронка оформления заказа за неделю. На каком шаге бизнес теряет больше всего заказов в абсолютных числах?', data:{h:['Шаг','Пользователей','Дошли до следующего'],r:[['Открыли корзину','10 000','80%'],['Указали адрес','8 000','90%'],['Выбрали доставку','7 200','60%'],['Оплатили','4 320','—']]}, o:['Корзина → адрес: потеряно 2 000','Адрес → доставка: потеряно 800','Доставка → оплата: потеряно 2 880','Поровну: около 1 900 на каждом шаге'], c:2, e:['2 000 — заметная потеря, но на последнем шаге уходит больше людей.','800 — самый маленький провал в воронке и по проценту, и в абсолюте.','7 200 − 4 320 = 2 880 — максимальная потеря и по проценту, и в абсолюте.','1 900 — это среднее по шагам, а реальные разницы 2 000, 800 и 2 880 сильно отличаются.'], d:1},
   {t:'Та же воронка в разбивке по платформам: на шаге «доставка → оплата» iOS теряет 15%, Android — 55%. Какой вывод и шаг?', data:{h:['Платформа','Доставка','Оплата','Конверсия шага'],r:[['iOS','3 000','2 550','85%'],['Android','4 200','1 770','45%']]}, o:['Аудитория Android менее платёжеспособна и чаще бросает заказ, увидев итоговую сумму','Вероятно, проблема в Android-реализации шага: смотреть записи сессий и баги оплаты','Перевести Android-пользователей на веб-оплату, где конверсия обычно стабильнее','Сначала выровнять выборки: пользователей Android больше, проценты сравнивать нельзя'], c:1, e:['Разрыв в 40 п.п. на одном шаге слишком велик для различий аудитории, это похоже на проблему реализации.','Сегментация нашла, где искать причину, дальше нужны записи сессий и тест на устройствах.','Это решение до диагноза: неизвестно, что ломается, и перенос может добавить новый шаг потерь.','Доли как раз и позволяют сравнивать группы разного размера, а выборки здесь достаточно большие.'], d:2},
   {t:'Когортная таблица retention (неделя 1 после первого визита). Что произошло?', data:{h:['Когорта','Польз.','Нед. 1','Нед. 2','Нед. 3'],r:[['1–7 сент.','5 000','38%','27%','22%'],['8–14 сент.','5 200','37%','26%','21%'],['15–21 сент.','5 100','24%','15%','—'],['22–28 сент.','5 300','23%','—','—']]}, o:['Обычные колебания: размеры когорт почти одинаковые, значит, продукт работает стабильно','С когорты 15–21 сент. удержание недели 1 упало на треть: что-то изменилось в продукте или трафике','Удержание всех когорт со временем снижается, это естественное затухание интереса к продукту','Последние когорты ещё не накопили данных, поэтому их неделя 1 занижена, и делать выводы по ним пока рано'], c:1, e:['Размер когорт не говорит об удержании, а падение с 37–38% до 23–24% — не колебание.','Резкий сдвиг между когортами указывает на событие: релиз, изменение онбординга или источника трафика.','Затухание внутри когорты нормально, но здесь сравниваются разные когорты на одной и той же неделе.','Неделя 1 у когорты 15–21 сентября уже закрыта, раз есть данные недели 2, так что цифры полные.'], d:2},
   {t:'Аналитика показывает, что 95% пользователей «не нажимают кнопку поиска». Что проверить в первую очередь?', o:['Заметна ли кнопка: провести пятисекундный тест и при необходимости усилить контраст','Корректно ли настроено событие и действительно ли поиск нужен в этом сценарии','Сравнить с бенчмарками: какая доля пользователей ищет в похожих продуктах','Опросить пользователей в приложении, почему они не пользуются поиском'], c:1, e:['Это уже работа над решением, хотя ещё не ясно, верны ли сами данные.','Аномально низкие числа часто означают сломанное событие или сценарий, где поиск не нужен.','Бенчмарки не помогут, если событие считается неверно: сравните ошибку с чужими цифрами.','Опрос стоит дороже проверки события, а при сломанной аналитике он ищет несуществующую проблему.'], d:1},
   {t:'Средняя конверсия воронки выросла с 40% до 44% после редизайна. Что обязательно посмотреть, прежде чем праздновать?', o:['Разбивку по сегментам и параллельные изменения (цены, трафик, акции) за период','Отзывы в сторах и обращения в поддержку за первую неделю после релиза','Конверсию за первые дни после релиза, когда эффект редизайна проявляется сильнее всего','Как выросла длина сессии: она подтвердит, что новый дизайн вовлекает'], c:0, e:['Средняя цифра может расти из-за состава трафика или акции, а не дизайна, поэтому нужна разбивка.','Отзывы покажут настроение, но не ответят, вызван ли рост конверсии именно редизайном.','Первые дни завышены эффектом новизны, а важно отделить вклад дизайна от других факторов.','Длина сессии не связана с атрибуцией роста конверсии и может расти по другим причинам.'], d:2},

  ], q:[
   {t:'Какая формулировка про опыт звучит как у мидла?', o:['«Вёл мобильное приложение банка: макеты всех экранов, UI-кит и передача в разработку»','«Работал в кросс-функциональной команде из 12 человек над крупным финтех-продуктом»','«Отвечал за переводы: после редизайна доля успешных переводов выросла на 6 п.п.»','«Закрывал полный цикл: исследования, прототипы, UI, иконки, лендинги, презентации»'], c:2, e:['Это перечень обязанностей: из него непонятно, что изменилось для пользователей и бизнеса благодаря вам.','Размер команды и масштаб продукта описывают контекст, но ничего не говорят о вашем личном вкладе.','Здесь есть конкретная зона ответственности и измеримый результат, который интервьюер может раскрутить вопросами.','Широкий список задач размывает фокус и звучит скорее как универсал без экспертизы, чем как мидл с результатом.'], d:1},
   {t:'Сколько должен длиться рассказ о себе в начале встречи?', o:['Секунд 30–40: назвать роль и стаж, остальное интервьюер спросит сам','Около двух минут: роль, продукт с результатом и чего хотите дальше','Минут 7–10 с показом портфолио, чтобы сразу подкрепить слова экранами','Минут пять, чтобы последовательно пройтись по всем местам работы'], c:1, e:['За полминуты вы не успеете показать вклад и мотивацию, и интервьюеру придётся вытягивать контекст вопросами.','Двух минут хватает на структуру «кто вы, чем полезны, чего хотите», дальше разговор ведут вопросы интервьюера.','Портфолио обычно разбирают отдельным блоком, а десятиминутный монолог в начале съедает время на диалог.','Хронологический пересказ мест работы дублирует резюме, которое интервьюер уже прочитал перед встречей.'], d:1},
   {t:'Интервьюер говорит: «Расскажите, чем вас привлекла вакансия». Что ответить?', o:['«Давно слежу за продуктом: нравится, как он развивается, и у вас сильная дизайн-команда»','«Интересен масштаб аудитории и то, что у вас уже выстроены процессы и дизайн-система»','«Хочу перейти из аутсорса в продукт, чтобы дольше работать с одной задачей и метриками»','«В вакансии есть онбординг B2B-клиентов: я делал похожий и хочу расти в исследованиях»'], c:3, e:['Комплименты продукту звучат вежливо, но их можно сказать любой компании, и о вас они ничего не сообщают.','Масштаб и зрелые процессы — это то, что компания даст вам, а не то, чем вы полезны ей.','Мотивация понятная, но она только про вас и никак не связана с задачами именно этой команды.','Связка «ваша задача — мой похожий опыт — куда хочу расти» показывает подготовку и взаимную пользу.'], d:2},
   {t:'Что из этого лишнее в двухминутном питче?', o:['Домен и стаж, чтобы интервьюер понял контекст вашего опыта','Один результат с цифрой из продукта, где вы работали последним','Перечень инструментов и плагинов, которыми вы уверенно владеете','Короткое объяснение, почему вас интересует именно эта вакансия'], c:2, e:['Домен и стаж задают рамку, без которой интервьюеру сложно соотнести ваши примеры с вакансией.','Один измеримый результат показывает влияние и даёт интервьюеру крючок для уточняющих вопросов.','Владение Figma и плагинами считается базовым минимумом для мидла и только съедает время питча.','Мотивация под конкретную вакансию отличает подготовленного кандидата и логично завершает рассказ.'], d:1},
   {t:'У вас 4 года опыта, но измеримых результатов нет: продукты не запускались или метрики не собирались. Как говорить о вкладе?', o:['Назвать примерные цифры по ощущениям команды, оговорив, что они оценочные','Рассказать о решениях и их проверке: что выбрали, почему и что показали тесты','Сказать, что все метрики под NDA, и перейти к подробному описанию процесса','Сделать акцент на объёме: сколько фич, экранов и релизов вы закрыли за год'], c:1, e:['Цифры «по ощущениям» не выдерживают уточняющих вопросов о базе и выборке и подрывают доверие ко всему рассказу.','Конкретные решения, аргументы и результаты тестов с пользователями — честное свидетельство вклада без метрик.','NDA можно соблюсти, обобщив детали, а фраза «всё под NDA» без подробностей звучит как отговорка.','Объём работы показывает загрузку, но не влияние: сотня экранов не говорит, стало ли пользователям лучше.'], d:2},
   {t:'Интервьюер после питча спрашивает: «А что в этом сделали именно вы, а не продакт?». Какой ответ сильнее?', o:['«Идея и все макеты мои, а продакт в основном занимался сроками и согласованием»','«Продакт задал цель, я предложил три направления, провёл 5 тестов и защитил вариант»','«Мы работали в тесной связке и решали всё вместе, поэтому делить вклад сложно»','«Продакт отвечал за то, что делать, я — за то, как: всё, что видно на экранах, моё»'], c:1, e:['Присвоение идеи и принижение роли продакта звучит неправдоподобно и настораживает как сигнал о работе в команде.','Чёткое разделение вклада с признанием роли партнёра показывает и самостоятельность, и зрелость в команде.','Тесная работа — это нормально, но отказ назвать свою часть интервьюер считывает как размытый вклад.','Такое деление сводит вашу роль к визуалу и не показывает ни одного решения, которое вы приняли и проверили.'], d:3},
  ]},
 {id:'cases-2', title:'Структура разбора кейса', ask:true,
  open:{q:'Разберите один кейс из портфолио по схеме: контекст → задача → ваша роль → процесс → решение → результат → что сделали бы иначе.', hint:['Начните с проблемы бизнеса и измеримого результата','Покажите варианты, которые отбросили, и почему','Назовите метрику и честное ограничение']},
  summary:[
   'Каркас: контекст и проблема бизнеса → цель и метрика → ваша роль и ограничения → процесс (исследование, варианты, выбор) → решение → результат → выводы и что сделали бы иначе.',
   'Открывайте кейс проблемой и результатом, а не экранами: «Нужно было поднять активацию с 23% до 30%; за квартал дошли до 29%».',
   'Покажите варианты, которые отбросили, и почему: это демонстрирует суждение. Нанимающие ценят «путь к финальному экрану», а не финальный экран.',
   'Держите один кейс на 5–7 минут, 3–5 сильных кейсов в портфолио. Старые учебные работы и фантазийные редизайны лучше убрать.',
  ], q:[
   {t:'С чего лучше начать рассказ о кейсе на портфолио-ревью?', o:['С проблемы бизнеса, цели и того, что получилось в итоге в цифрах','С финального экрана крупным планом, чтобы сразу зацепить внимание','С подробного рассказа о компании, команде и том, как устроены процессы','С исследования: какие интервью провели и что узнали о пользователях'], c:0, e:['Проблема и результат работают как заголовок: интервьюер сразу понимает ставки и дальше слушает детали осмысленно.','Финальный экран без рамки задачи невозможно оценить, ведь непонятно, какую проблему он решает.','Контекст о компании нужен, но в двух предложениях, иначе до сути кейса дело дойдёт слишком поздно.','Хронологический старт с исследования оттягивает главное, и интервьюер не знает, ради какого результата всё это.'], d:1},
   {t:'У вашего кейса нет цифр: продукт не запустили. Как говорить о результате?', o:['Указать ожидаемый рост конверсии из бизнес-кейса как итог проекта','Убрать кейс из портфолио: без запуска и метрик его не воспримут всерьёз','Честно сказать, что не запустили, и показать, что проверили и что узнали','Сказать, что результаты закрыты NDA, и сосредоточиться на процессе'], c:2, e:['Прогноз из бизнес-кейса — это цель, а не результат, и выдавать его за итог значит вводить интервьюера в заблуждение.','Кейс с сильным процессом и проверкой гипотез остаётся ценным даже без запуска, если честно описать ограничения.','Честность о статусе плюс промежуточные свидетельства — тесты, оценка лида, выводы — дают убедительную картину.','Ссылка на NDA там, где результата просто нет, звучит как отговорка и вскрывается первым же уточнением.'], d:2},
   {t:'Интервьюер спрашивает: «Почему вы выбрали этот вариант, а не другой?». Какой ответ сильнее?', o:['«На ревью лид и продакт сошлись на нём, и я согласился с их аргументами»','«Б быстрее в разработке, но в тесте не находили кнопку; взяли А, приняв риск сроков»','«Он лучше соответствует гайдлайнам платформы и визуально чище, чем вариант Б»','«Его используют лидеры рынка, значит, пользователи к нему уже привыкли»'], c:1, e:['Ссылка на мнение лида перекладывает решение на других и не показывает вашего собственного суждения.','Ответ называет trade-off, данные теста и осознанно принятый риск — именно это ищут в вопросе о выборе.','Гайдлайны и визуальная чистота — вторичные аргументы, если не показано, как вариант влияет на задачу пользователя.','Привычность паттерна — разумная гипотеза, но без проверки на ваших пользователях это предположение, а не аргумент.'], d:2},
   {t:'Сколько кейсов стоит держать в портфолио мидла?', o:['Все проекты за последние годы, чтобы показать широту опыта','3–5 сильных и релевантных кейсов с процессом и результатом','Один глубокий кейс, разобранный максимально подробно','Восемь–десять кейсов разных доменов, чтобы было из чего выбрать'], c:1, e:['Слабые и устаревшие проекты тянут вниз общее впечатление, а широту лучше показать подбором кейсов.','Лиды советуют держать 3–5 кейсов с процессом и результатом, а учебные работы убирать.','Один кейс не показывает диапазон задач, и если он не попадёт в интересы команды, показать больше нечего.','Большое число кейсов не ценится само по себе, а на глубокую проработку каждого обычно не хватает сил.'], d:1},
   {t:'Что из этого лучше вырезать из портфолио перед собесом на мидла?', o:['Кейс запущенного продукта, где результат скромный: +2% к конверсии','Учебный редизайн известного приложения без данных и ограничений','Кейс, где вы вели только часть сценария, а остальное делали коллеги','Кейс неудачного запуска, где гипотеза не подтвердилась после релиза'], c:1, e:['Запущенный продукт с честным, пусть и скромным, результатом показывает реальную работу с метриками.','Фантазийный редизайн без пользователей, данных и ограничений лиды называют первым кандидатом на удаление.','Частичный вклад — норма для продуктовой команды, если вы ясно обозначаете свою зону ответственности.','Провал с выводами показывает зрелость и умение учиться, и такие кейсы часто вызывают лучший разговор.'], d:2},
   {t:'Вы рассказываете кейс 15 минут, интервьюер уже дважды посмотрел на часы. Что это значит и что делать?', o:['Продолжить в том же темпе: кейс сложный, и важно не потерять детали','Сократить до результата и выводов и спросить, что разобрать глубже','Ускорить темп речи, чтобы успеть рассказать всё запланированное','Пропустить оставшееся и сразу перейти к следующему кейсу из списка'], c:1, e:['Взгляд на часы — явный сигнал, что вы потеряли внимание, и игнорировать его значит тратить общее время.','Умение читать аудиторию и управлять временем оценивают наравне с содержанием кейса.','Быстрая речь не возвращает структуру, а только сильнее перегружает интервьюера деталями.','Резкий переход без вывода обрывает кейс, а интервьюер, возможно, хотел обсудить именно его часть.'], d:2},
  ]},
 {id:'cases-3', title:'Вопросы-ловушки по кейсу', ask:true,
  open:{q:'Расскажите о решении, которое вы приняли, а потом поняли, что ошиблись. Что изменили?', hint:['Конкретная ситуация, не абстракция','Как узнали об ошибке: данные, тест, фидбек','Что изменили в подходе, а не только в макете']},
  summary:[
   'После кейса почти всегда спросят: что сделали бы иначе, что было лично вашим, где ошиблись, как измеряли, что сказали пользователи.',
   'На «что бы изменили» отвечайте конкретно: «Сейчас начал бы с коридорного теста до проработки трёх направлений — сэкономил бы неделю».',
   'Про ошибку говорите по STAR: ситуация → задача → действие → результат, и обязательно вывод, который изменил ваш подход.',
   'Вопрос о причинности — любимый у продактов: «Почему вы уверены, что рост дал именно дизайн?». Рост, совпавший с изменением цены или рекламной кампанией, — не победа дизайна.',
  ], q:[
   {t:'«Как вы поняли, что рост конверсии дал именно редизайн, а не что-то ещё?» Какой ответ покажет продуктовое мышление?', o:['«Конверсия выросла сразу после релиза, а других заметных изменений я не помню»','«Аналитик подтвердил, что рост начался ровно в день релиза нашего редизайна»','«Рост держится уже три месяца, значит, это не случайный всплеск»','«Был A/B-тест: контроль не рос, цены и трафик в этот период не менялись»'], c:3, e:['Совпадение по времени не доказывает причину, а «не помню» показывает, что параллельные факторы никто не проверял.','Даже точное совпадение с датой релиза остаётся корреляцией, если рядом могли запуститься реклама или акция.','Устойчивость роста говорит о его реальности, но не о том, что его вызвал именно дизайн.','Контрольная группа и исключение параллельных факторов — то, что отличает доказательство от совпадения.'], d:2},
   {t:'На вопрос о провале кандидат отвечает: «Провалов не было, всё получалось». Как это считывает лид?', o:['Как уверенность в себе и стабильное качество работы без срывов','Как уход от ответа или отсутствие рефлексии над своей работой','Как скромность: кандидат не хочет выпячивать трудные истории','Нейтрально: на итог интервью этот ответ почти не влияет'], c:1, e:['Ошибки есть у всех, кто делает реальные продукты, поэтому ответ «их не было» не воспринимается как сила.','Лиды прямо называют умение рассказать об ошибке и выводах признаком зрелости, а отказ — красным флагом.','Вопрос о провале не про скромность, а про рефлексию, и уклонение здесь считывается как закрытость.','Это один из поведенческих вопросов с заметным весом, и неудачный ответ на него запоминается.'], d:1},
   {t:'Какой ответ на «что вы сделали бы иначе» самый убедительный?', o:['«Пожалуй, ничего: мы прошли все этапы процесса и получили хороший результат»','«Уделил бы больше времени исследованию и чаще общался бы с пользователями»','«Доработал бы визуальную часть: типографику и отступы в карточках товара»','«Провёл бы 5 интервью до прототипа: две недели ушли на непонятный вариант»'], c:3, e:['Отсутствие изменений читается как отсутствие рефлексии, даже если проект действительно прошёл хорошо.','Направление верное, но формулировка настолько общая, что подходит к любому проекту и не содержит урока.','Визуальные мелочи не меняют подход к работе и не показывают, чему вы научились на проекте.','Конкретное действие, цена ошибки и изменённый подход — ровно то, что ищут в этом вопросе.'], d:1},
   {t:'Интервьюер: «Что сказали пользователи про финальный вариант?». У вас не было теста финала. Что ответить?', o:['Пересказать реакции на прототип так, будто они относятся к финальной версии','Честно: финал не тестировали из-за сроков, опирались на тесты прототипа','Сказать, что отзывы в целом положительные, судя по оценкам в сторе','Перевести разговор на метрики после релиза, раз отзывов о финале нет'], c:1, e:['Подмена прототипа финалом вскроется на вопросе о различиях версий и подорвёт доверие к кейсу.','Честный ответ с объяснением ограничения и того, чем его компенсировали, показывает зрелость.','Средняя оценка приложения в сторе не связана с конкретной фичей и не отвечает на вопрос.','Уход от вопроса интервьюер замечает сразу, даже если метрики интересные.'], d:2},
   {t:'«Какую метрику вы бы выбрали для этого кейса сейчас?» — зачем интервьюер задаёт этот вопрос про уже готовый кейс?', o:['Проверяет, знаете ли вы стандартные продуктовые метрики вроде retention','Проверяет, выросло ли ваше понимание и смотрите ли вы на работу критически','Хочет понять, какие метрики вы будете отслеживать на новом месте работы','Проверяет, не придумали ли вы результат кейса задним числом'], c:1, e:['Знание терминов здесь вторично: важна не метрика из учебника, а её связь с задачей кейса.','Взгляд на старую работу глазами сегодняшнего опыта — сильный сигнал роста и зрелости.','Вопрос привязан к прошлому кейсу, а не к будущей работе, хотя ответ косвенно о ней тоже говорит.','Для проверки честности задают вопросы о базе и выборке, а этот вопрос про рефлексию.'], d:2},
   {t:'Кандидат: «Конверсия выросла на 30%». Интервьюер: «С какого уровня и на какой выборке?». Кандидат не знает. Что это говорит лиду?', o:['Ничего критичного: важен сам факт роста, а детали может уточнить аналитик','Скорее всего, кандидат сам не работал с данными и повторяет чужой тезис','Что кандидат подзабыл проект, но сама цифра, вероятно, корректная','Что кандидату стоило подготовить график, а не называть цифру устно'], c:1, e:['Относительный рост без базы ничего не значит: 30% от 1% и от 40% — совершенно разные истории.','Знание базы, выборки и периода отличает того, кто сам работал с данными, от пересказа чужой цифры.','Лид не может принять цифру на веру, если кандидат не способен объяснить, откуда она взялась.','Проблема не в формате подачи: график без понимания базы и выборки не снимает вопрос.'], d:3},
  ]},
 {id:'cases-4', title:'Кейс без метрик: аутсорс и закрытая аналитика', ask:true,
  open:{q:'Вы два года работали в аутсорс-студии, аналитика была у заказчика. Расскажите о результате одного проекта так, чтобы интервьюер поверил в ваш вклад.', hint:['Одной фразой и без оправданий объясните, почему цифр нет','Покажите свидетельства: тесты до и после, решение заказчика, что было дальше','Назовите ожидаемый эффект и метрику, которую отслеживали бы']},
  summary:[
   'Отсутствие цифр в аутсорсе или при закрытой аналитике — нормальная ситуация. Скажите об этом одной фразой без оправданий: «Аналитика была у заказчика, доступа к данным у студии не было».',
   'Вместо метрик показывайте свидетельства: юзабилити-тесты до и после (успешность задачи, время, ошибки на 5–6 участниках), решение заказчика и что было дальше (запустили, продлили контракт, приняли как стандарт), отзывы поддержки и продаж, меньше вопросов в поддержку и уточнений от разработки, внедрение дизайн-системы, сдачу в срок и решения по урезанию объёма.',
   'Назовите ожидаемый эффект и метрику, которую вы бы отслеживали. Никогда не придумывайте цифры, а NDA соблюдайте через обобщение: «федеральный ритейлер» вместо названия, суть решения вместо скриншотов с данными.',
   'Покажите инициативу: запросите доступ к аналитике, договоритесь с PM о данных после релиза, соберите вопросы поддержки. Попытка добыть цифры — сильный сигнал продуктового мышления.',
  ], q:[
   {t:'Интервьюер спрашивает про результат проекта, а аналитика была у заказчика. Как начать ответ?', o:['Извиниться, что цифр нет, и пояснить, что в аутсорсе так почти всегда','Сказать, что результат хороший: заказчик остался доволен работой студии','Коротко назвать причину — аналитика у заказчика — и перейти к свидетельствам','Пропустить вопрос о результате и подробнее рассказать о процессе и артефактах'], c:2, e:['Извинения и оправдания тратят время и подают нормальную ситуацию как вашу слабость.','Довольство заказчика без подробностей — общая фраза, которая не показывает, что изменилось для пользователей.','Одна честная фраза о причине и быстрый переход к доказательствам звучат уверенно и по делу.','Уход от вопроса о результате интервьюер заметит, а процесс без итога не отвечает на заданный вопрос.'], d:1},
   {t:'Какое свидетельство результата сильнее всего заменит отсутствующие продуктовые метрики?', o:['Тест до и после на 6 участниках: задачу выполнили 2 из 6, после редизайна — 5 из 6','Похвала арт-директора студии: макеты назвали одними из самых сильных за год','Объём сданной работы: число экранов и компонентов, переданных заказчику','Высокая оценка решения на внутреннем дизайн-ревью и место в портфолио студии'], c:0, e:['Сравнение успешности задачи до и после на одинаковом сценарии — проверяемое свидетельство влияния на пользователей.','Мнение коллег о качестве макетов говорит о ремесле, но ничего не сообщает о пользе для пользователей.','Объём работы показывает загрузку и скорость, но не то, стал ли продукт лучше.','Внутреннее ревью оценивает решение глазами дизайнеров, а не поведение реальных пользователей.'], d:2},
   {t:'После релиза доступа к данным нет. Что из этого — честный косвенный показатель эффекта вашего редизайна?', o:['Заказчик похвалил дизайн на демо и сказал, что команде всё понравилось','Похожие решения дали конкурентам рост конверсии, о котором они писали в блогах','Новый интерфейс получил высокие оценки на внутреннем ревью студии','Саппорт заказчика отметил, что вопросов по этому экрану стало заметно меньше'], c:3, e:['Реакция на демо — мнение до встречи с пользователями, а не показатель того, как интерфейс работает.','Результаты чужих продуктов не переносятся на ваш контекст и не говорят о вашем решении.','Оценка коллег — экспертное мнение, а не изменение в поведении пользователей после релиза.','Снижение обращений в поддержку по конкретному экрану — наблюдаемый эффект в реальном использовании.'], d:2},
   {t:'Проект под NDA, аналитики у вас не было. Как корректно рассказать о нём на собеседовании?', o:['Показать полные макеты с логотипом: собес — закрытая встреча, NDA не нарушается','Обобщить заказчика и данные, показать суть решения и не придумывать цифр','Назвать оценочный рост, округлив догадку команды, и сослаться на NDA','Не рассказывать о проекте вовсе и показать вместо него учебные работы'], c:1, e:['Закрытость встречи не отменяет NDA, а небрежность с чужими данными сама по себе тревожный сигнал.','Обобщение вроде «федеральный ритейлер» сохраняет суть кейса и соблюдает соглашение без выдуманных чисел.','Догадка, поданная как цифра, остаётся выдумкой, и ссылка на NDA её не оправдывает.','Учебные работы слабее реального проекта, а NDA почти всегда позволяет рассказать о задаче в обобщённом виде.'], d:1},
   {t:'Интервьюер: «А какую метрику вы бы отслеживали, будь у вас доступ?». Проект — упрощение формы заявки. Какой ответ сильнее?', o:['«Конверсию и retention: это главные метрики для любого цифрового продукта»','«NPS: по нему сразу видно, нравится ли пользователям новый интерфейс»','«Долю завершённых заявок и отказы по шагам: мы упрощали именно форму»','«Время на сайте и глубину просмотра: они покажут рост вовлечённости»'], c:2, e:['Конверсия и retention важны, но названы без связи с задачей кейса, как универсальный шаблон.','NPS слишком общий и запаздывающий, чтобы показать эффект изменения одной формы.','Метрика напрямую связана с изменением: видно, где отваливались до редизайна и что должно было улучшиться.','Для формы рост времени на сайте скорее тревожный сигнал, ведь цель — быстрее завершить заявку.'], d:2},
