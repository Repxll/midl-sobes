   {t:'Вы два года в аутсорсе без доступа к данным. На собесе спрашивают: «Что вы делали, чтобы узнать результат своей работы?». Какой ответ покажет инициативу?', o:['«Просил PM заказчика выгрузку воронки после релиза и собирал вопросы из поддержки»','«Это была зона аккаунт-менеджера: он получал отчёты и пересказывал нам выводы»','«Опирался на свою экспертизу и лучшие практики, чтобы решения были заведомо сильными»','«Ждал обратной связи от заказчика и подробно уточнял её на регулярных созвонах»'], c:0, e:['Активный запрос данных и сбор косвенных сигналов показывают, что вам важен результат, а не только сдача макетов.','Опора на пересказ аккаунт-менеджера — пассивная позиция, при которой вы не влияете на то, что узнаёте.','Экспертиза помогает принимать решения, но не заменяет проверки того, сработали ли они после релиза.','Ожидание обратной связи оставляет инициативу у заказчика, и результат вы узнаёте, только если он сам захочет.'], d:3},
  ]},
]});
</script>
<script>
CH.push({id:'whiteboard', title:'Whiteboard, live-задача и тестовое', lessons:[
 {id:'whiteboard-1', title:'Фреймворк для задачи вслух', ask:true,
  open:{q:'Спроектируйте вслух сервис записи к врачу в небольшой клинике. У вас 20 минут. Напишите, с каких вопросов начнёте и как разложите время.', hint:['Уточнить: кто пользователь, платформа, бизнес-цель, ограничения','Выделить ключевой сценарий и приоритизировать','Решение, метрики успеха, риски и edge cases, тайминг вслух']},
  summary:[
   'Шаги: уточнить задачу → пользователи и контекст → проблемы и приоритеты → ключевой сценарий → решение (набросок) → метрики успеха → риски и edge cases → что сделали бы дальше.',
   'Оценивают ход мысли, а не рисунок. Думайте вслух, называйте trade-offs, говорите, что отбросили и почему.',
   'Первые 3–5 минут — вопросы: кто пользователь, платформа, бизнес-цель, ограничения, что уже есть. Молчаливый старт с рисования — главная ошибка.',
   'Следите за временем сами: «У нас 25 минут: 5 на рамку, 10 на сценарий, 5 на решение, 5 на метрики и риски».',
  ], q:[
   {t:'Задача: «Спроектируйте приложение для совместных покупок». Что сделать первым?', o:['Сразу набросать главный экран, чтобы было от чего оттолкнуться в обсуждении','Разобрать конкурентов: как совместные покупки устроены в популярных сервисах','Уточнить: для кого, зачем бизнесу, какая платформа и какие есть ограничения','Предложить 2–3 персоны с целями и выбрать основную для дальнейшего сценария'], c:2, e:['Старт с рисования без рамки задачи — самая частая ошибка формата: решение строится на непроверенных допущениях.','Конкуренты полезны как источник идей, но без понимания пользователя и цели непонятно, что именно у них смотреть.','Рамка задачи до решения — то, что интервьюер оценивает в первые минуты в первую очередь.','Персоны, придуманные до уточняющих вопросов, — это догадки, которые могут увести решение не туда.'], d:1},
   {t:'Осталось 5 минут, решение нарисовано. Что добавить, чтобы закрыть задачу сильно?', o:['Доработать визуал ключевого экрана: иерархию, отступы и состояния кнопок','Назвать метрики успеха, риски, edge cases и что сделали бы дальше','Нарисовать ещё один экран, чтобы сценарий выглядел более законченным','Кратко пересказать решение с начала, чтобы интервьюер ничего не упустил'], c:1, e:['Визуальную полировку в whiteboard не оценивают, а время на продуктовое завершение будет потеряно.','Метрики, риски и следующие шаги показывают, что вы думаете о решении как о продукте, а не как о картинке.','Ещё один экран добавляет объём, но не отвечает на вопрос, как понять, что решение сработало.','Пересказ повторяет то, что интервьюер уже видел, и не добавляет новых сигналов о вашем мышлении.'], d:1},
   {t:'Интервьюер меняет условие на ходу: «А если у половины пользователей нет интернета?». Что это значит?', o:['Проверяет, насколько твёрдо вы отстаиваете своё решение под давлением','Намекает, что исходное решение ошибочное и его стоит начать заново','Даёт понять, что вы потратили слишком много времени на основной сценарий','Проверяет гибкость: как вы пересматриваете приоритеты под ограничение'], c:3, e:['Задача не в том, чтобы отстоять исходный вариант, а в том, чтобы адаптировать его к новым условиям.','Новое условие — стандартный приём, а не сигнал провала, и начинать с нуля обычно не нужно.','Смена условия не связана с таймингом: это проверка реакции на новое ограничение.','Спокойно пересмотрите приоритеты и назовите, что меняется в решении, — именно это и проверяют.'], d:2},
   {t:'На этапе «пользователи» кандидат описывает три персоны с именами и хобби. Что с этим не так в формате whiteboard?', o:['Ничего: детальные персоны помогают интервьюеру лучше понять пользователей','Хобби не влияют на решение; нужны 1–2 сегмента по задачам и контексту','Персон мало: для сервиса нужно покрыть все основные возрастные группы','Персоны не подкреплены исследованием, поэтому интервьюер их не засчитает'], c:1, e:['Детали вроде хобби съедают время и не помогают ни приоритизации, ни выбору решения.','В whiteboard ценят функциональные сегменты по задаче и контексту, которые прямо влияют на сценарий.','Возрастная демография редко определяет сценарий, а увеличение числа персон только распыляет фокус.','В формате whiteboard допущения без исследования нормальны, проблема в том, что эти персоны не влияют на решение.'], d:2},
   {t:'Вы предложили решение, интервьюер молчит и смотрит. Что лучше сделать?', o:['Подождать реакции: интервьюер сам скажет, если что-то пошло не так','Пояснить, почему решение хорошее, и привести примеры из своего опыта','Проговорить trade-offs: что решение даёт, чего стоит и какие есть альтернативы','Предложить другой вариант, раз первый, судя по всему, не убедил интервьюера'], c:2, e:['Молчание интервьюера чаще всего не оценка, а пауза, чтобы посмотреть, как вы рассуждаете сами.','Защита решения без разбора его слабых мест звучит как оправдание, а не как анализ.','Рассуждение о плюсах, цене и альтернативах вслух — именно то, что проверяет этот формат.','Смена решения без причины показывает неуверенность и отсутствие аргументов за исходный вариант.'], d:2},
   {t:'Задача на 25 минут. Кандидат 15 минут задаёт вопросы и уточняет контекст. Какая ошибка?', o:['Никакой: чем глубже понятен контекст, тем точнее получится решение','Нарушен тайминг: на вопросы 3–5 минут, иначе решения никто не увидит','Вопросы стоило отправить письменно, чтобы не тратить время на обсуждение','Ошибки нет, если интервьюер отвечал охотно и сам не прерывал вопросы'], c:1, e:['Вопросы нужны, но при таком тайминге на решение, метрики и риски почти не остаётся времени.','Тайминг — часть оценки: вы сами ведёте время, и интервьюер должен увидеть, как вы проектируете.','В live-задаче вопросы задают вслух по ходу встречи, это часть оцениваемого диалога.','Интервьюер часто не прерывает специально, чтобы проверить, как вы сами управляете временем.'], d:3},
  ]},
 {id:'whiteboard-2', title:'Типовые задачи и как их решать', ask:false,
  open:{q:'В приложении доставки пользователи часто отменяют заказ в первые 2 минуты. Как подойдёте к задаче?', hint:['Гипотезы причин: ошибка в адресе, цена, время доставки','Как проверить каждую: данные, записи сессий, интервью','Варианты решения и их trade-offs']},
  summary:[
   'Типы задач: спроектировать с нуля (сценарий), улучшить существующее (критика приложения), решить метрическую проблему (падение конверсии), работа с дизайн-системой (новый компонент или вариант).',
   'При критике приложения не ругайте всё подряд: выберите 2–3 проблемы, связанные с целью продукта, и предложите изменения с ожидаемым эффектом.',
   'На задаче про дизайн-систему типичная дилемма: добавить вариант к существующему компоненту или создать новый. Ответ зависит от того, меняется ли поведение, а не только внешний вид.',
   'Всегда проговаривайте edge cases: пустое состояние, ошибка, загрузка, длинные строки, недоступный интернет, права доступа.',
  ], q:[
   {t:'Задача: нужна кнопка с иконкой слева, в системе есть кнопка без иконки. Что правильнее?', o:['Создать новый компонент IconButton, чтобы не усложнять базовую кнопку','Собрать локально из кнопки и иконки, а в систему добавить позже','Отдать решение разработчикам: им виднее, как кнопка устроена в коде','Добавить кнопке свойство «иконка слева»: поведение не меняется'], c:3, e:['Отдельный компонент для того же поведения плодит дубли, которые со временем начнут расходиться.','Локальная сборка вне системы быстро расползается по макетам, и «позже» обычно не наступает.','Решение о структуре компонента за дизайнером системы, а разработчики подтверждают реализацию.','Поведение кнопки то же, меняется только содержимое, поэтому это свойство существующего компонента.'], d:2},
   {t:'Критика приложения: с чего начать?', o:['С цели продукта и ключевого сценария, затем 2–3 проблемы, что ему мешают','С полного списка недочётов, чтобы показать внимательность к деталям','С визуального аудита: цвета, шрифты, сетка и консистентность компонентов','С эвристик Нильсена, последовательно проходя по каждой из десяти'], c:0, e:['Приоритизация через цель продукта показывает продуктовое мышление, которое и ждут в этом типе задач.','Длинный список без приоритетов показывает наблюдательность, но не умение выбрать важное.','Визуальная консистентность редко главная проблема продукта и не связана с его целью напрямую.','Эвристики — полезный инструмент, но механический проход по списку подменяет анализ цели продукта.'], d:1},
   {t:'Какие состояния нужно упомянуть, проектируя список заказов?', o:['Заполненный список и ошибку загрузки, остальное уточнить по ходу разработки','Заполненный и пустой список: этого достаточно для основного сценария','Пустой, загрузка, ошибка, заполненный и очень длинный список','Заполненный список в светлой и тёмной теме и на разных платформах'], c:2, e:['Пустое состояние и загрузку часто откладывают, а потом их дорисовывают в спешке уже в разработке.','Без загрузки, ошибки и длинного списка сценарий ломается в самых частых реальных ситуациях.','Полный набор состояний, включая крайние случаи, — признак продуманного мидл-уровня.','Темы и платформы — это вариации отображения, а не состояния данных, о которых спрашивают.'], d:1},
   {t:'Задача: «Конверсия в оплату упала на 15% за месяц». Какой первый шаг?', o:['Провести аудит экрана оплаты и предложить редизайн проблемных мест','Разложить воронку по шагам и сегментам и проверить релизы и цены','Запустить опрос пользователей о том, что им мешает при оплате','Посмотреть записи сессий на экране оплаты и найти, где спотыкаются'], c:1, e:['Редизайн до диагноза — решение без понимания, где и почему именно упала конверсия.','Локализация падения по шагам, сегментам и внешним изменениям — первый шаг в метрической задаче.','Опрос даёт мнения, но не показывает, на каком шаге и у какого сегмента произошло падение.','Записи сессий полезны позже, когда уже понятно, какой шаг и какой сегмент смотреть.'], d:2},
   {t:'Задача про дизайн-систему: «Нужен селект, который может выбирать несколько значений». Что это — вариант или новый компонент?', o:['Вариант существующего селекта: визуально это тот же выпадающий список','Скорее новый компонент: меняются поведение, состояния и взаимодействие','Вариант селекта со свойством multiple, как в HTML, — так проще разработке','Группа чекбоксов в выпадающем окне без отдельного компонента в системе'], c:1, e:['Внешнее сходство обманчиво: выбор нескольких значений меняет логику, состояния и отображение выбранного.','Критерий «меняется ли поведение» — именно тот, который ожидают услышать в этой задаче.','Атрибут в HTML не определяет устройство компонента в системе: у мультиселекта свои чипы, поиск и состояния.','Сборка из чекбоксов без компонента — локальное решение, которое разойдётся по продукту.'], d:3},
   {t:'Вы проектируете форму регистрации на whiteboard. Какой edge case чаще всего забывают назвать?', o:['Пользователь уже зарегистрирован с этим e-mail и пытается создать аккаунт','Пользователь ввёл пароль, не соответствующий требованиям к сложности','Пользователь оставил обязательное поле пустым и нажал «Продолжить»','Пользователь ввёл e-mail в неверном формате, например без символа @'], c:0, e:['Существующий аккаунт требует ветки со входом и восстановлением доступа, и про неё забывают чаще всего.','Требования к паролю — стандартная валидация, которую называют почти все кандидаты.','Пустое обязательное поле — базовая проверка формы, о ней обычно вспоминают сразу.','Неверный формат e-mail — типовая валидация, она редко ускользает из внимания.'], d:1},
  ]},
 {id:'whiteboard-3', title:'Тестовое: сделать и защитить', ask:true,
  open:{q:'Вам дали тестовое на 4 часа. Как распределите время и что покажете на защите?', hint:['30 минут на рамку и вопросы, 2 часа на варианты и ключевой сценарий, 1 час на сборку, 30 минут на презентацию','Показать, что отбросили и почему','Что сделали бы при большем времени']},
  summary:[
   'Тестовое на 4–6 часов оценивают по процессу и аргументации, а не по количеству экранов. Один ключевой сценарий, доведённый до ума, лучше десяти сырых экранов.',
   'Начните с вопросов заказчику письменно: это нормально и считается плюсом. Зафиксируйте допущения, если ответов нет.',
   'На защите: задача → допущения → варианты и выбор → решение → что проверили бы и как → что сделали бы при большем времени. Уложитесь в 10–15 минут.',
   'Файл должен быть чистым: компоненты, Auto Layout, понятные названия, страницы «Процесс» и «Финал». Лид откроет файл.',
  ], q:[
   {t:'В тестовом не хватает данных: не сказано, кто пользователь. Что делать?', o:['Выбрать сегмент самому, исходя из здравого смысла, и сразу делать решение','Спросить заказчика, а без ответа — зафиксировать допущение и показать его','Сделать решение для широкой аудитории, чтобы оно подошло всем сразу','Отложить тестовое, пока заказчик не пришлёт полный и подробный бриф'], c:1, e:['Неозвученное допущение создаёт риск, что на защите решение оценят по другим критериям.','Вопрос и явно зафиксированное допущение — признак зрелого процесса работы с неопределённостью.','Решение «для всех» обычно не подходит никому и не показывает умения выбирать фокус.','Неопределённость — часть задачи, и ожидание идеального брифа выглядит как слабая реакция на неё.'], d:1},
   {t:'Что важнее показать на защите тестового?', o:['Полноту: все экраны сценария, включая второстепенные и настройки','Высокую детализацию UI: отполированный визуал и микровзаимодействия','Варианты, которые рассматривали, и почему в итоге выбрали этот','Кликабельный прототип, в котором можно пройти весь сценарий'], c:2, e:['Полнота экранов показывает объём работы, но не то, как вы принимали решения.','Полировка визуала приятна, но в тестовом мидла прежде всего оценивают логику решения.','Путь к решению и аргументы выбора — главное, что оценивают на защите тестового.','Прототип помогает показать сценарий, но без объяснения выбора остаётся просто демонстрацией.'], d:1},
   {t:'Защита тестового длится 30 минут. Сколько отвести на презентацию?', o:['Минут 25, чтобы подробно показать процесс, и пару минут на вопросы','Минут 5: только финальное решение, остальное раскроется в вопросах','Минут 10–15 на презентацию, остальное время оставить на вопросы','Минут 20, а вопросы пусть задают по ходу, прерывая презентацию'], c:2, e:['Без времени на вопросы интервьюеры не успеют проверить вашу аргументацию, а это главная часть защиты.','За пять минут не получится показать варианты и логику выбора, только картинку результата.','Половина времени на вопросы — норма: в диалоге лучше всего видно, как вы думаете.','Постоянные перебивания ломают структуру рассказа, и важные части можно не успеть показать.'], d:1},
   {t:'Тестовое на 4 часа, вы потратили 12 и сделали 30 экранов. Как это оценит лид?', o:['Плюсом: видно вовлечённость и готовность работать сверх ожиданий','Скорее минусом: вы не держите объём и фокус, а 30 экранов не проверить','Нейтрально: лид оценит качество экранов, а не потраченное время','Плюсом, если все экраны консистентны и собраны на компонентах'], c:1, e:['Старание без фокуса — слабый сигнал: в работе такой подход оборачивается сорванными сроками.','Умение выбрать ключевой сценарий и уложиться в рамки — часть того, что проверяет тестовое.','Время тоже входит в оценку, ведь условие про 4 часа было частью задания.','Аккуратный файл ценится, но не компенсирует неумение ограничить объём под заданное время.'], d:2},
   {t:'Компания просит тестовое на 20 часов без оплаты с макетами реальной фичи. Что сделать мидлу?', o:['Сделать полностью: это показатель мотивации, и так отсеивают слабых','Предложить сократить до 4–6 часов на ключевой сценарий или обсудить оплату','Сделать ключевую часть за 4 часа и сдать молча, без обсуждения объёма','Отказаться от вакансии без объяснений, раз компания так относится к людям'], c:1, e:['Двадцать часов бесплатной работы над реальной фичей — это эксплуатация, а не проверка мотивации.','Переговоры об объёме или оплате — нормальная практика и признак профессиональной зрелости.','Сокращение без договорённости могут принять за невыполненное задание, лучше обсудить заранее.','Отказ возможен, но сначала стоит попробовать договориться: компания могла просто не продумать объём.'], d:2},
   {t:'На защите лид спрашивает: «Почему вы выбрали это, а не очевидный паттерн из вашей же дизайн-системы?». У вас нет ответа. Что это значит?', o:['Что лид придирается: решение в тестовом не обязано повторять систему','Что вы не рассмотрели очевидную альтернативу — существующий паттерн','Что нужно было просто взять паттерн системы: отклоняться от неё нельзя','Что лид проверяет знание их системы, которую стоило выучить заранее'], c:1, e:['Вопрос по существу: отклоняться от системы можно, но выбор нужно уметь обосновать.','Отсутствие сравнения с базовым вариантом — пробел в процессе, который лиды замечают сразу.','Брать паттерн не обязательно, но сравнить с ним своё решение нужно было обязательно.','Дело не в заучивании системы, а в том, что очевидная альтернатива не попала в процесс выбора.'], d:3},
  ]},
]});
</script>
<script>
CH.push({id:'design', title:'Проектирование сценариев и IA', lessons:[
 {id:'design-1', title:'JTBD, CJM и USM: рамки для сценария', ask:true,
  open:{q:'Объясните, в каких ситуациях вы используете JTBD, CJM и User Story Map, и приведите пример, где один из них изменил решение.', hint:['JTBD — зачем нанимают продукт; CJM — путь с эмоциями и точками боли; USM — объём релиза по шагам','Конкретный пример с результатом','Когда фреймворк не нужен']},
  summary:[
   'JTBD (Jobs To Be Done): пользователь «нанимает» продукт для работы. Формулировка «Когда [ситуация], я хочу [мотивация], чтобы [результат]» помогает отделить задачу от решения.',
   'CJM (Customer Journey Map): путь пользователя по этапам с действиями, мыслями, эмоциями, точками боли и каналами. Нужна, чтобы найти, где ломается опыт между экранами и командами.',
   'User Story Map: шаги сценария по горизонтали, детали по вертикали; срез по горизонтали = объём релиза. Главный инструмент для «что войдёт в MVP».',
   'Бенчмаркинг конкурентов: не копировать, а понять, какие задачи они решают и чем за это платят пользователи. Фреймворк — инструмент разговора с командой, а не отчёт.',
  ], q:[
   {t:'Формулировка в стиле JTBD — это…', o:['«Пользователь, 25–34, женщина, любит путешествия»','«Когда я опаздываю на встречу, хочу быстро вызвать такси, чтобы не объяснять причину опоздания»','«Добавить кнопку вызова такси на главный экран»','«Пользователи хотят удобное приложение»'], c:1, e:['Это демографический портрет, не задача.','Ситуация, мотивация, результат — классическая job story.','Это решение, а не задача.','Нет ситуации и результата.'], d:1},
   {t:'Когда CJM полезнее, чем user flow?', o:['Когда нужно описать нажатия кнопок на одном экране','Когда проблема между каналами и этапами: сайт, звонок в поддержку, курьер, приложение','Когда нужно описать компонент','CJM всегда лучше'], c:1, e:['Это задача user flow.','CJM показывает опыт целиком, с эмоциями и разрывами между командами.','Это задача дизайн-системы.','Это разные инструменты для разных вопросов.'], d:2},
   {t:'Что даёт User Story Map, чего не даёт обычный бэклог?', o:['Красивую картинку для презентации','Видимость всего сценария и возможность нарезать релизы по горизонтальным срезам, не теряя целостности пути','Оценку в часах','Список багов'], c:1, e:['Не для картинки.','Именно для этого USM и придуман.','Оценки — отдельный процесс.','Нет.'], d:2},
   {t:'Продакт просит «сделать CJM» для фичи, которая живёт на одном экране и не затрагивает другие каналы. Что ответить?', o:['Сделать CJM, раз просят','Предложить более подходящий инструмент: user flow и состояния экрана; CJM здесь даст мало нового за большую цену','Отказаться','Сделать и CJM, и USM'], c:1, e:['Инструмент должен соответствовать вопросу.','Выбор инструмента под задачу — признак мидла.','Отказ без альтернативы не помогает.','Избыточно.'], d:2},
   {t:'Чем бенчмаркинг отличается от копирования конкурента?', o:['Ничем','Бенчмаркинг — анализ, какие задачи и как решают конкуренты, с оценкой применимости к вашему контексту; копирование — перенос решения без анализа задачи','Бенчмаркинг — это копирование с изменением цветов','Копирование быстрее, значит лучше'], c:1, e:['Разница принципиальная.','Лиды прямо называют копирование самым слабым сценарием, а бенчмаркинг — нормальным источником.','Нет.','Нет.'], d:1},
   {t:'В job story «Когда я получаю зарплату, хочу отложить часть, чтобы не потратить» команда предложила «кнопку копилки». Что в этом решении упущено с точки зрения JTBD?', o:['Ничего, решение отвечает задаче','Мотивация «чтобы не потратить» намекает на автоматизацию без усилий: кнопка требует действия; стоит рассмотреть автоперевод в день зарплаты','Нужно сделать кнопку больше','Нужна ещё одна job story'], c:1, e:['Задача про самоконтроль, а не про кнопку.','JTBD помогает увидеть, что решение должно снять усилие, а не добавить шаг.','Размер не меняет суть.','Хватает одной, нужно её прочитать внимательно.'], d:3},
  ]},
 {id:'design-2', title:'User flow: happy path, ветки и состояния', ask:true,
  open:{q:'Опишите, как вы раскладываете сценарий «оформить возврат товара» до отрисовки экранов: шаги, ветки, состояния, ошибки.', hint:['Happy path по шагам, затем ветки: товар не подлежит возврату, истёк срок, нет чека','Состояния системы: ожидание, одобрено, отклонено, деньги вернулись','Что показываем пользователю на каждом состоянии']},
  summary:[
   'Сначала happy path — основной сценарий без ошибок, по шагам. Потом ветки: альтернативные пути, ошибки, отмены, возвраты назад. Потом состояния системы, которые живут дольше одного экрана.',
   'Flow рисуют до экранов: прямоугольники шагов, ромбы решений, стрелки. Один экран может содержать несколько шагов, один шаг — несколько экранов.',
   'Для каждого шага: что пользователь знает, что должен ввести, что может пойти не так, куда вернётся. Ошибки проектируют как часть сценария, а не как всплывашки.',
   'Длинные процессы (заявка, возврат, верификация) имеют статусы: нужна карта статусов и то, как пользователь узнаёт о смене статуса (push, e-mail, экран).',
  ], q:[
   {t:'Что такое happy path?', o:['Самый красивый экран','Основной сценарий, в котором всё идёт по плану, без ошибок и ветвлений','Сценарий с подарком пользователю','Путь с наименьшим числом экранов'], c:1, e:['Не про визуал.','От него строят ветки и ошибки.','Нет.','Не всегда самый короткий.'], d:1},
   {t:'Пользователь на шаге «ввод кода из SMS» не получил код. Какие ветки должны быть в сценарии?', o:['Только «ввести код»','Повторная отправка с таймером, смена номера, альтернативный канал (звонок/e-mail), обращение в поддержку','Показать ошибку и закрыть приложение','Отправить код ещё раз без ограничений'], c:1, e:['Так пользователь застрянет.','Полный набор веток — признак продуманного flow.','Нет.','Без лимита — риск злоупотреблений и затрат.'], d:2},
   {t:'Заявка на кредит рассматривается до 3 дней. Что обязательно спроектировать, кроме формы?', o:['Анимацию отправки','Карту статусов (на рассмотрении, нужны документы, одобрено, отказано) и способ уведомления о каждом переходе','Экран «спасибо»','Ничего, остальное делает банк'], c:1, e:['Не главное.','Долгие процессы живут в статусах; без них пользователь звонит в поддержку.','Экран «спасибо» — только начало ожидания.','Статусы — зона дизайна.'], d:2},
   {t:'Форма из 12 полей. Что лучше для сценария, если часть полей зависит от предыдущих ответов?', o:['Показать все 12 сразу','Разбить на шаги, показывать зависимые поля по мере ответов, сохранять прогресс','Убрать половину полей без согласования','Сделать поля мельче'], c:1, e:['Когнитивная перегрузка и пустые зависимости.','Пошаговость, условные поля и сохранение прогресса — стандарт для длинных форм.','Поля могут быть обязательны по закону; сначала выяснить.','Нет.'], d:1},
   {t:'При проектировании возврата товара вы нашли ветку «товар не подлежит возврату». Где лучше сообщить об этом?', o:['В конце, после заполнения всей формы','В самом начале, на этапе выбора товара, с объяснением причины','В письме через день','Нигде, пусть поддержка объяснит'], c:1, e:['Пользователь потратит время зря и разозлится.','Чем раньше известно ограничение, тем меньше потерянных усилий и обращений.','Поздно.','Поддержка — дорогой канал для предсказуемых случаев.'], d:2},
   {t:'В flow оплаты ошибка «недостаточно средств» показана модальным окном с кнопкой «ОК», после которого пользователь возвращается на пустую форму. Что не так?', o:['Всё в порядке','Ошибка спроектирована как тупик: нужно сохранить введённое, объяснить причину и дать следующий шаг — сменить карту, пополнить, уменьшить сумму','Нужно было сделать toast','Нужно было написать «Ошибка 402»'], c:1, e:['Тупиковая ошибка — частая причина потерь на оплате.','Ошибка как часть сценария: причина, сохранённый контекст, следующий шаг.','Формат не главное; главное — выход.','Код ничего не объясняет.'], d:3},
  ]},
 {id:'design-3', title:'Навигация и информационная архитектура', ask:false,
  open:{q:'В приложении 7 разделов и команда хочет добавить восьмой в таб-бар. Как подойдёте к вопросу навигации?', hint:['Таб-бар — 3–5 разделов; остальное — иерархия, «ещё» или поиск','Данные: какие разделы реально используют','Карточная сортировка или tree test для проверки структуры']},
  summary:[
   'IA отвечает на вопросы «где это лежит» и «как это называется». Инструменты: карточная сортировка (как пользователи группируют), tree testing (находят ли в структуре), анализ поиска по сайту.',
   'Модели навигации: таб-бар (3–5 разделов, плоская структура), иерархия с «назад», хаб и спицы, поиск как основная навигация для больших каталогов. Выбор зависит от числа разделов и частоты использования.',
   'Глубина против ширины: чем глубже, тем больше шагов; чем шире, тем сложнее выбор. Пользователи переносят «широко и мелко» лучше, если названия понятны.',
   'Названия разделов — часть IA: слова пользователя, а не внутренние термины. «Платежи» понятнее, чем «Транзакции».',
  ], q:[
   {t:'Сколько разделов обычно выдерживает таб-бар мобильного приложения?', o:['1–2','3–5','7–9','Сколько угодно, если иконки мелкие'], c:1, e:['Мало для таб-бара.','Рекомендации платформ и практика: 3–5 с понятными подписями.','Слишком много для выбора одним взглядом.','Мелкие цели — проблема доступности.'], d:1},
   {t:'Что проверяет tree testing?', o:['Скорость загрузки','Находят ли пользователи нужный пункт в текстовой структуре разделов без визуального дизайна','Красоту иконок','Длину текста'], c:1, e:['Нет.','Чистая проверка IA до отрисовки интерфейса.','Нет.','Нет.'], d:1},
   {t:'Аналитика: 40% сессий начинаются с поиска по каталогу, а разделы меню почти не используют. Какой вывод для IA?', o:['Убрать поиск','Поиск — основная навигация; усилить его (подсказки, фильтры, история), а меню упростить','Добавить ещё разделов','Ничего не менять'], c:1, e:['Это основной путь пользователей.','Данные показывают реальную модель навигации; IA должна ей соответствовать.','Разделы не используют.','Есть что улучшить.'], d:2},
   {t:'Какое название раздела лучше для массового пользователя банка?', o:['«Транзакции»','«Операции по счёту»','«История»','«Ledger»'], c:2, e:['Внутренний термин.','Длинно и канцелярски.','Короткое слово пользователя; его и проверяют карточной сортировкой.','Профессиональный жаргон.'], d:1},
   {t:'Карточная сортировка показала, что пользователи кладут «Лимиты по карте» и в «Карты», и в «Безопасность» поровну. Что делать?', o:['Выбрать случайно','Положить в один раздел, а в другом дать ссылку-дубль или сделать настройку доступной из обоих контекстов; проверить tree test','Убрать лимиты','Создать раздел «Лимиты»'], c:1, e:['Это не решение.','Полисемичные пункты решают дублированием входа и проверкой.','Нужная функция.','Новый раздел ради одного пункта — ширина без смысла.'], d:2},
   {t:'В приложении 9 равнозначных разделов, все используются часто. Таб-бар не вмещает. Что предложить?', o:['Таб-бар с 9 иконками','Пересмотреть группировку: 4 таба по задачам плюс поиск или «хаб» на главной; проверить, действительно ли все 9 равнозначны по данным','Убрать 5 разделов','Сделать боковое меню как на десктопе'], c:1, e:['Нечитаемо и нарушает рекомендации платформ.','Сначала усомниться в «равнозначности», потом группировать по задачам.','Без данных — произвол.','Гамбургер прячет разделы и снижает их использование.'], d:3},
  ]},
 {id:'design-4', title:'Сложные интерфейсы: таблицы, фильтры, права', ask:true,
  open:{q:'Спроектируйте вслух раздел «Заказы» для менеджера интернет-магазина: 5 000 заказов в месяц, несколько статусов, массовые действия. Что заложите?', hint:['Таблица: какие колонки по умолчанию, сортировка, плотность, закреплённые колонки','Фильтры и сохранённые представления, поиск, пагинация или бесконечный список','Массовые операции, права доступа, экспорт, пустые и ошибочные состояния']},
  summary:[
   'B2B и внутренние инструменты — частый домен вакансий. Главные объекты: таблицы, фильтры, формы-мастера, права доступа, массовые операции, уведомления о длительных процессах.',
   'Таблица: выберите колонки по умолчанию по задаче (не все поля), дайте сортировку и настройку колонок, закрепите ключевую колонку, продумайте плотность и длинные значения.',
   'Фильтры: видимые чипы активных фильтров, сброс, сохранённые представления («мои заказы на сегодня»). Поиск и фильтр — разные инструменты.',
   'Права: один экран живёт в нескольких ролях — что скрыть, что показать заблокированным с объяснением. Массовые действия нуждаются в подтверждении, отмене и статусе выполнения.',
  ], q:[
   {t:'В таблице заказов 25 полей. Что показать по умолчанию?', o:['Все 25','5–8 колонок, нужных для основной задачи, с возможностью настроить остальные','Только ID','Случайные 10'], c:1, e:['Нечитаемо и медленно.','Колонки под задачу плюс настройка — стандарт рабочих таблиц.','Недостаточно для работы.','Произвол.'], d:1},
   {t:'Пользователь применил 4 фильтра и не понимает, почему таблица пустая. Что должно быть в интерфейсе?', o:['Просто пустая таблица','Видимые чипы активных фильтров, пустое состояние с объяснением и кнопка «Сбросить фильтры»','Автоматический сброс фильтров','Всплывающее предупреждение'], c:1, e:['Тупик.','Прозрачность состояния фильтров — ключ к рабочим таблицам.','Пользователь потеряет свою работу.','Предупреждение не показывает, что именно применено.'], d:1},
   {t:'Массовое действие «удалить 300 заказов». Что обязательно?', o:['Выполнить сразу','Подтверждение с количеством и последствиями, возможность отменить, индикация прогресса и результата (сколько удалено, сколько не удалось)','Запретить массовые действия','Отправить e-mail'], c:1, e:['Необратимые массовые действия без подтверждения — катастрофа.','Подтверждение, отмена, прогресс и отчёт — стандарт для массовых операций.','Они нужны для эффективности.','Недостаточно.'], d:2},
   {t:'Чем отличается поиск от фильтра в таблице?', o:['Ничем','Поиск находит конкретный объект по известному признаку (номер, имя); фильтр сужает множество по категориям','Фильтр быстрее','Поиск только для текста'], c:1, e:['Разные задачи.','Разделение помогает проектировать оба инструмента правильно.','Нет.','Нет.'], d:1},
   {t:'Один экран «Заказ» видят менеджер (редактирует), курьер (меняет статус) и бухгалтер (читает). Как проектировать?', o:['Три отдельных экрана','Один экран с ролевыми состояниями: недоступные действия скрыты или заблокированы с объяснением, общая структура одинаковая','Показать всем всё','Спросить юристов'], c:1, e:['Дорого и расходится со временем.','Ролевые состояния на одном экране — обычная практика для B2B.','Опасно и перегружено.','Не по теме.'], d:2},
   {t:'Отчёт формируется 5 минут. Пользователь нажал «Сформировать» и ушёл. Что спроектировать?', o:['Блокирующий спиннер на 5 минут','Фоновую задачу со статусом в списке, уведомление по готовности и возможность продолжать работу','Сообщение «подождите»','Ничего, пусть ждёт'], c:1, e:['Блокировка на минуты — потеря работы.','Длительные операции проектируют как фоновые задачи со статусами и уведомлением.','Недостаточно.','Нет.'], d:3},
  ]},
]});
</script>
<script>
CH.push({id:'ui', title:'UI, дизайн-системы и доступность', lessons:[
 {id:'ui-1', title:'Дизайн-система как продукт', ask:true,
  open:{q:'Как вы работаете с дизайн-системой: когда берёте готовый компонент, когда добавляете вариант, когда предлагаете новый?', hint:['Система — продукт с внутренними пользователями','Критерий: меняется поведение или только вид','Как согласуете с владельцем и документируете']},
  summary:[
   'Дизайн-система — продукт с внутренними пользователями (дизайнеры и разработчики). Её ценность — скорость и консистентность, а не красота библиотеки.',
   'Слои: токены (цвет, типографика, отступы, радиусы) → базовые компоненты → паттерны и шаблоны. В Figma токены живут в Variables, компоненты — с вариантами и свойствами.',
   'Главный баланс — стандартизация против гибкости: слишком жёсткая система тормозит продукт, слишком мягкая превращается в хаос.',
   'Вклад в систему: описать проблему, показать случаи, предложить изменение, согласовать с владельцем, задокументировать. В большинстве вакансий ждут умения работать по системе; развивать её — скорее мидл+.',
  ], q:[
   {t:'Что такое токен в дизайн-системе?', o:['Готовый базовый компонент с вариантами состояний, например кнопка или поле','Набор правил использования компонента, описанный в документации системы','Именованное значение (цвет, размер, отступ), на которое ссылаются компоненты','Уникальный идентификатор компонента, по которому разработчик находит его в коде'], c:2, e:['Кнопка или поле — это компонент, следующий слой системы, который сам ссылается на токены.','Документация описывает правила использования, а токен — это конкретное именованное значение, а не текст.','Например, color.bg.primary вместо #0B7D5F: меняется значение токена — обновляются все компоненты, которые на него ссылаются.','Идентификатор помогает связать дизайн и код, но не хранит значения цвета, размера или отступа.'], d:1},
   {t:'В Figma вы задаёте цвет прямо hex-значением вместо переменной. Что это значит для системы?', o:['Ничего критичного: цвет совпадает с токеном, разработчик всё равно возьмёт hex','Компонент выпадет из тем и обновлений: при смене токена он не изменится','Это допустимо, если тот же hex указан в документации дизайн-системы','Риск только в handoff: в Dev Mode не будет имени цвета, а в коде всё одинаково'], c:1, e:['Внешне цвет тот же, но связь с системой оборвана, и при смене палитры этот элемент останется старым.','Тёмная тема, ребрендинг или правка токена не затронут этот компонент — он сломается первым.','Документация не создаёт связь: только переменная обновляет значение во всех местах автоматически.','Проблема не только в handoff: даже в макетах компонент перестанет переключаться между режимами и темами.'], d:1},
   {t:'Команда просит «ещё один синий» для акции. Как поступить?', o:['Добавить цвет локально в макет акции, а в систему внести позже, если он приживётся','Сразу завести новый примитив blue-650 в общей палитре, чтобы цвет был доступен всем','Выяснить, хватит ли accent или нужен семантический токен promo, и согласовать с владельцем','Самостоятельно подобрать ближайший оттенок из палитры, не отвлекая владельца системы'], c:2, e:['Локальные значения редко возвращаются в систему и размножаются по макетам, создавая скрытый долг.','Примитив без роли не объясняет, где его использовать, и палитра разрастается оттенками без смысла.','Сначала задача, потом семантика токена и согласование — так система остаётся целой и при этом развивается.','Подбор оттенка в обход владельца даёт решение «на глаз» и не фиксирует потребность продукта в системе.'], d:2},
   {t:'Чем семантический токен отличается от примитивного?', o:['Семантический токен описывает цвета, а примитивный — размеры, отступы и радиусы','Примитив — это значение (blue-600), семантический — роль (action.primary), ссылающаяся на примитив','Примитивы используются в компонентах, а семантические — только в документации системы','Семантический — это алиас в коде для разработчиков, а примитивный — переменная дизайнеров в Figma'], c:1, e:['Оба слоя бывают и для цвета, и для размеров; разница в том, хранит токен значение или роль.','Двухслойная модель — основа тем и ребрендинга: меняется ссылка семантики, а компоненты не трогаются.','Наоборот: компоненты должны ссылаться на семантические токены, а примитивы остаются базовой палитрой.','Оба слоя общие для дизайна и кода; деление идёт по смыслу значения, а не по тому, кто им пользуется.'], d:2},
   {t:'Продакт просит «быстро» отступить от системы ради дедлайна: нестандартная кнопка на одном экране. Как ответить?', o:['Сделать нестандартную кнопку: один экран не повлияет на систему, а дедлайн важнее','Предложить решение из системы, а если нельзя — зафиксировать исключение с задачей на возврат','Отказать: любое отклонение от системы создаёт прецедент, и потом его не остановить','Сделать кнопку и сразу добавить её в библиотеку новым вариантом, чтобы в системе не было дубля'], c:1, e:['Разовые отступления без учёта копятся в долг: появляется дубль компонента и в макетах, и в коде.','Осознанное исключение с планом возврата сохраняет и дедлайн, и целостность системы — это зрелый ответ.','Категоричный отказ делает систему тормозом для продукта, хотя у бизнеса может быть веская причина.','Вариант ради одного экрана раздувает библиотеку; в систему попадают решения, нужные в нескольких местах.'], d:2},
   {t:'В системе 14 вариантов кнопки, дизайнеры всё равно рисуют свои. Что это говорит о системе?', o:['Дизайнеры не знают систему: нужен обязательный онбординг и проверка макетов на ревью','Система не решает реальные задачи или плохо описана: надо исследовать её пользователей','Вариантов всё ещё мало для всех кейсов: нужно собрать недостающие и добавить в библиотеку','Нужно закрыть отвязку компонентов в Figma, чтобы дизайнеры не могли рисовать своё'], c:1, e:['Онбординг может помочь, но без понимания причины он лечит симптом, а не то, почему система неудобна.','Система — это продукт: низкое использование — сигнал исследовать задачи внутренних пользователей.','Четырнадцать вариантов уже слишком много; добавление новых ещё сильнее запутает выбор.','Запреты не убирают потребность: дизайнеры найдут обходные пути, а система станет только хуже.'], d:3},
  ]},
 {id:'ui-2', title:'Доступность и визуальная база', ask:true,
  open:{q:'Какие требования доступности и платформенные правила вы учитываете по умолчанию в мобильном интерфейсе?', hint:['Контраст 4.5:1 для текста, 3:1 для крупного текста и UI','Цели для касания 44×44 pt / 48 dp, увеличенный шрифт','HIG и Material: навигация, жесты, системные компоненты']},
  summary:[
   'WCAG: контраст обычного текста не ниже 4.5:1, крупного текста (от 18 pt или 14 pt жирного) и элементов интерфейса — 3:1. Проверяйте плагином, а не на глаз.',
   'Цели для касания: 44×44 pt по рекомендациям Apple, 48×48 dp по Material; WCAG 2.2 требует минимум 24×24 CSS px. Информацию нельзя передавать только цветом.',
   'Типографика: 2–3 размера на экран, шкала и межстрочный интервал около 1.4–1.5 для текста. Сетка 8 pt (4 pt для мелких отступов) держит ритм.',
   'Поддержка увеличенного шрифта (Dynamic Type) и тёмной темы — норма. Знайте HIG и Material: где они расходятся (навигация назад, таб-бар, листы, жесты), и не переносите паттерны одной платформы на другую без причины.',
  ], q:[
   {t:'Минимальный контраст для обычного текста по WCAG AA?', o:['Не ниже 3:1','Не ниже 7:1','Не ниже 3.5:1','Не ниже 4.5:1'], c:3, e:['Порог 3:1 — для крупного текста и элементов интерфейса, обычному тексту этого мало.','Порог 7:1 — требование уровня AAA, оно строже базового уровня AA.','Значение 3.5:1 не фигурирует в WCAG и не дотягивает до порога для обычного текста.','Порог 4.5:1 — требование уровня AA для обычного текста; его проверяют плагином, а не на глаз.'], d:1},
   {t:'Поле формы с ошибкой выделено только красной рамкой. Что не так?', o:['Красный слишком агрессивен: лучше оранжевая рамка, она мягче и тоже заметна','Ошибка передаётся только цветом: нужны текст ошибки и иконка рядом с полем','Рамка слишком тонкая: нужно сделать её толще 2 px, чтобы ошибку заметили','Не хватает анимации встряхивания поля, чтобы привлечь внимание к ошибке'], c:1, e:['Смена оттенка не помогает: проблема в том, что смысл по-прежнему передаётся только цветом.','Люди с нарушением цветовосприятия не отличат рамку, а текст объяснит, что именно исправить.','Толщина рамки улучшает заметность, но не объясняет, в чём ошибка и как её исправить.','Анимация привлекает внимание на секунду, но не сообщает причину ошибки и мешает части пользователей.'], d:1},
   {t:'Рекомендуемый минимальный размер цели для касания в iOS?', o:['24×24 pt','48×48 pt','40×40 pt','44×44 pt'], c:3, e:['Размер 24×24 — минимум WCAG 2.2 в CSS-пикселях, а не рекомендация платформы Apple.','Размер 48×48 — рекомендация Material Design в dp для Android, а не Apple HIG.','Размер 40×40 часто встречается в вебе, но для iOS это меньше рекомендуемого минимума.','Apple Human Interface Guidelines рекомендуют цели для касания не меньше 44×44 pt.'], d:1},
   {t:'Пользователь включил крупный шрифт в настройках телефона, и у вас обрезался текст кнопок. Что делать?', o:['Зафиксировать размер шрифта в кнопках, чтобы системная настройка их не затрагивала','Проектировать под Dynamic Type: кнопки растут по контенту, текст переносится на строки','Сократить тексты кнопок до одного слова, чтобы они влезали при любом размере шрифта','Включить автоуменьшение текста (minimum scale factor), чтобы подпись всегда помещалась'], c:1, e:['Блокировка масштабирования ломает доступность и противоречит ожиданиям Apple о поддержке Dynamic Type.','Масштабируемый текст и гибкие контейнеры — норма; макеты стоит проверять на крупных размерах шрифта.','Короткие подписи помогают, но на крупных размерах и одно слово может не влезть в фиксированную кнопку.','Автоуменьшение возвращает мелкий текст и сводит на нет настройку, которую пользователь включил осознанно.'], d:2},
   {t:'Вы переносите Android-приложение на iOS. Что нельзя переносить «как есть»?', o:['Цветовую палитру: в iOS принято использовать системные цвета вместо брендовых','Системные паттерны: навигацию назад, drawer вместо таб-бара, системные диалоги и листы','Продуктовые иконки: их нужно перерисовать в SF Symbols, иначе приложение не пройдёт ревью','Тексты интерфейса: на iOS нужен другой тон голоса и отдельная редакция всех строк'], c:1, e:['Брендовые цвета остаются: iOS не требует системной палитры, она лишь даёт удобную основу.','Платформенные паттерны различаются, и пользователи iOS ожидают привычной навигации и системных компонентов.','SF Symbols удобны для системных действий, но продуктовые иконки можно оставить, ревью этого не требует.','Тон голоса задаёт продукт, а не платформа: тексты переносятся, меняются лишь названия системных действий.'], d:2},
   {t:'Дизайнер поставил серый текст подсказки #9A9A9A на белом (контраст ≈2.7:1), аргументируя «он второстепенный». Как оценить?', o:['Допустимо: для вспомогательного текста WCAG снижает порог, хватает около 2.5:1','Недопустимо: это тоже текст, нужен 4.5:1, а второстепенность задают размером и позицией','Допустимо, если подсказка набрана кеглем от 14 pt: для такого текста хватает порога 3:1','Недопустимо только в тёмной теме, а на белом фоне серый #9A9A9A читается достаточно'], c:1, e:['WCAG не делает исключений для второстепенного текста: любой значимый текст должен иметь не меньше 4.5:1.','Иерархию строят размером, весом и расположением, а читаемость текста не приносят в жертву.','Порог 3:1 действует для текста от 18 pt или 14 pt жирного, а 2.7:1 не дотягивает даже до него.','Контраст 2.7:1 недостаточен на любом фоне, и белый фон не делает светло-серый текст читаемым.'], d:3},
  ]},
 {id:'ui-3', title:'Паттерны, состояния и тексты', ask:false,
  open:{q:'Опишите все состояния экрана «История платежей» и тексты для них.', hint:['Пустое, загрузка, ошибка сети, частичные данные, заполненное, нет результатов по фильтру','Что говорит текст: что случилось, что делать','Кнопки называют действие']},
  summary:[
   'Экран живёт в состояниях: пустое, загрузка, ошибка, успех, частичные данные, нет сети. Проектируйте их сразу — это отличает мидла в handoff.',
   'Пустое состояние — не заглушка, а подсказка к первому действию. Ошибка объясняет, что случилось и что делать, без обвинения пользователя.',
   'Тексты интерфейса — часть дизайна: кнопка называет действие («Оплатить 1 290 ₽»), а не «ОК». Избегайте жаргона системы («токен не валиден»).',
   'Формы: по одному вопросу за раз, автозаполнение, подходящая клавиатура, валидация при потере фокуса, а не на каждом символе. Скелетоны и оптимистичный UI снижают ощущение ожидания.',
  ], q:[
   {t:'Какой текст ошибки лучше?', o:['«Ошибка 500: сервер временно недоступен. Обратитесь в поддержку, указав код ошибки»','«Что-то пошло не так. Мы уже работаем над этим, пожалуйста, повторите попытку позже»','«Перевод не отправлен: нет связи с банком. Деньги не списаны, попробуйте через минуту»','«Проверьте введённые данные и подключение к интернету, затем повторите отправку перевода»'], c:2, e:['Код и отсылка в поддержку перекладывают проблему на человека и не говорят, что с деньгами.','Вежливо, но непонятно, что случилось, списаны ли деньги и когда именно пробовать снова.','Текст говорит, что случилось, что с деньгами и что делать — это полная формула сообщения об ошибке.','Текст гадает о причине и намекает на ошибку пользователя, хотя проблема на стороне банка.'], d:1},
   {t:'Что должно быть в пустом состоянии списка «Избранное»?', o:['Иллюстрация с надписью «Здесь пока пусто», чтобы экран не выглядел сломанным','Подборка популярных товаров, чтобы заполнить пространство полезным контентом','Сообщение «Избранное пусто» и скелетоны карточек на месте будущего списка','Объяснение, как сюда попадают элементы, и кнопка к ближайшему действию'], c:3, e:['Иллюстрация смягчает пустоту, но не объясняет, как добавить элемент и что делать дальше.','Подборка может дополнять экран, но без объяснения пользователь не поймёт, как работает избранное.','Скелетоны означают загрузку, поэтому пользователь будет ждать контент, которого нет.','Пустое состояние обучает: объясняет механику и ведёт к первому действию, например в каталог.'], d:1},
   {t:'Когда лучше показывать ошибку валидации в поле e-mail?', o:['По каждому введённому символу, чтобы ошибка была видна сразу','После того как пользователь ушёл из поля (по потере фокуса)','Только при нажатии «Отправить», подсветив все ошибки разом','Только на сервере после отправки, чтобы не дублировать проверку'], c:1, e:['Проверка на каждый символ раздражает: ошибка горит, пока человек ещё не допечатал адрес.','Валидация по потере фокуса — стандарт: человек закончил ввод и сразу видит проблему.','При отправке уже поздно: человеку приходится возвращаться и искать, где именно ошибка.','Серверная проверка нужна, но без клиентской обратная связь приходит поздно и медленно.'], d:2},
   {t:'Что такое оптимистичный UI?', o:['Интерфейс, который скрывает технические ошибки и показывает пользователю только успех','Результат действия показывается сразу, до ответа сервера, и откатывается при ошибке','Подход, при котором интерфейс заранее подгружает данные, которые понадобятся следующими','Скелетон, который показывает структуру контента, пока данные загружаются с сервера'], c:1, e:['Оптимистичный UI не прячет ошибки: при сбое он откатывает изменение и сообщает об этом.','Так работают лайки, отправка сообщений и переключатели, где ответ сервера почти всегда успешен.','Предзагрузка данных — это prefetching, отдельная техника, а не оптимистичное обновление.','Скелетон снижает воспринимаемое ожидание, но не показывает результат действия заранее.'], d:2},
   {t:'Кнопка в диалоге удаления подписана «ОК» и «Отмена». Что улучшить?', o:['Покрасить «ОК» в красный и поменять кнопки местами, чтобы предупредить об опасности','Назвать действие: «Удалить» и «Оставить», чтобы было понятно без чтения текста','Заменить на «Да» и «Нет», а заголовок переформулировать в прямой вопрос «Удалить?»','Оставить «ОК» и «Отмена», но добавить в текст диалога описание последствий'], c:1, e:['Цвет помогает, но не заменяет смысл: «ОК» всё равно не говорит, что именно произойдёт.','Кнопки, которые называют действие, понятны даже без чтения текста — базовое правило UX-текстов.','«Да» и «Нет» по-прежнему требуют прочитать вопрос, и при беглом взгляде легко ошибиться.','Описание последствий полезно, но кнопки читают первыми, и «ОК» остаётся двусмысленным.'], d:1},
   {t:'Список загружается 3 секунды. Какой вариант лучше для ощущения скорости?', o:['Спиннер по центру экрана, чтобы было видно, что идёт загрузка','Прогресс-бар с процентами загрузки вверху пустого экрана','Скелетон в форме будущего контента и постепенная подгрузка','Сообщение «Загружаем историю…» с анимированной иллюстрацией'], c:2, e:['Спиннер сообщает о загрузке, но акцентирует ожидание и не показывает, что появится.','Проценты для списка обычно неточны, а пустой экран под ними всё равно выглядит пустым.','Скелетон снижает воспринимаемое ожидание и заранее показывает структуру контента.','Текст с иллюстрацией занимает внимание, но подчёркивает ожидание и не показывает структуру.'], d:2},
  ]},
]});
</script>
<script>
CH.push({id:'portfolio', title:'Портфолио и крафт', lessons:[
 {id:'portfolio-1', title:'Страница кейса: структура и что вырезать', ask:true,
  open:{q:'Опишите структуру страницы вашего главного кейса блок за блоком и объясните, что вы вырезали и почему.', hint:['Первый экран: проблема, роль, результат — за 10 секунд','Процесс: варианты, выбор, проверка; не все экраны подряд','Что убрали: учебное, без вклада, без ограничений']},
  summary:[
   'Первый экран кейса за 10 секунд отвечает: какой продукт, какая проблема, ваша роль, результат. Лид решает, читать ли дальше, по нему.',
   'Порядок блоков: контекст и проблема → цель и метрика → роль и ограничения → исследование → варианты и выбор → решение (ключевые экраны, не все) → результат → выводы.',
   'Вырезайте: учебные работы, фантазийные редизайны без ограничений, проекты с минимальным вкладом, экраны ради экранов. 3–5 кейсов, 500–800 слов текста на кейс.',
   'Покажите «живое»: ссылка на продукт или сторы, короткое видео, процесс работы с ИИ. Проверяемое ценится выше полированного.',
  ], q:[
   {t:'Что должно быть на первом экране страницы кейса?', o:['Крупный мокап главного экрана на устройстве и название проекта','Суть кейса: продукт, проблема, ваша роль и результат — коротко','Контекст компании: рынок, аудитория и история продукта','Таймлайн проекта, состав команды и список использованных инструментов'], c:1, e:['Мокап привлекает взгляд, но без контекста не говорит, какую проблему вы решали и с каким итогом.','Лид решает за 10 секунд, читать ли дальше, поэтому суть и результат должны быть видны сразу.','Контекст важен, но это второй блок: история компании не отвечает, что сделали именно вы.','Таймлайн и инструменты — детали, которые уместны ниже и не объясняют ценность кейса.'], d:1},
   {t:'Сколько экранов показать в кейсе про редизайн чекаута из 12 экранов?', o:['Все 12 экранов по порядку, чтобы лид увидел полный сценарий без пропусков','Три-пять ключевых, которые иллюстрируют решения, остальные — в прототипе','Один финальный экран с аннотациями, раз сценарий виден в прототипе','Все экраны до и после редизайна в виде парных сравнений по каждому шагу'], c:1, e:['Лента экранов утомляет и не объясняет, какие решения вы приняли и почему.','Экран в кейсе должен иллюстрировать решение, а полный сценарий можно дать ссылкой на прототип.','Одного экрана мало, чтобы понять логику изменений в многошаговом сценарии.','Двадцать четыре экрана сравнений ещё длиннее ленты и топят ключевые решения в деталях.'], d:1},
   {t:'У вас 9 кейсов: 3 рабочих с результатом, 4 учебных, 2 фантазийных редизайна. Что оставить для собеса на мидла?', o:['Все 9: большой объём показывает опыт и широту задач','3 рабочих и, возможно, 1 учебный с сильным процессом','3 рабочих и 2 редизайна, чтобы показать сильный визуал','Все рабочие и учебные, а фантазийные редизайны убрать'], c:1, e:['Слабые кейсы тянут общее впечатление вниз: лид оценивает по худшему, а не по объёму.','Лиды советуют 3–5 кейсов, убирая учебное и фантазийное, если в них нет сильного процесса.','Фантазийный редизайн без ограничений — первый кандидат на удаление, визуал видно и в рабочих кейсах.','Четыре учебных кейса размывают портфолио: для мидла важнее реальные задачи с результатом.'], d:2},
   {t:'Что из этого сильнее всего повышает доверие к кейсу?', o:['Подробный список всех артефактов: CJM, персоны, флоу и вайрфреймы','Ссылка на живой продукт, сторы или видео работы реальной фичи','Большое число детализированных мокапов на разных устройствах','Логотип известной компании и пометка о NDA на первом экране'], c:1, e:['Перечень артефактов показывает активность, но не доказывает, что решение дошло до пользователей.','Нанимающие проверяют, живой ли продукт: ссылка и видео делают ваш вклад проверяемым.','Мокапы показывают визуал, но их можно нарисовать и без реального продукта.','Логотип говорит о месте работы, но не подтверждает ваш личный вклад и результат.'], d:2},
   {t:'Кейс под NDA. Как показать его в портфолио?', o:['Выложить кейс целиком под паролем: закрытая страница не нарушает NDA','Обобщить: задача и процесс без деталей, изменённые данные, обезличенные фрагменты','Не показывать кейс в портфолио, а рассказать о нём только на собеседовании','Показать финальные экраны без логотипа и названия компании, а процесс опустить'], c:1, e:['Пароль не снимает ограничений: NDA запрещает раскрытие, и такая публикация — красный флаг.','Стандартная практика: мышление и процесс показать можно, а детали и данные — нельзя.','Без кейса в портфолио вы теряете сильный материал, хотя процесс можно показать обезличенно.','Экраны без логотипа узнаваемы и всё ещё под NDA, а процесс — как раз то, что можно показать.'], d:2},
   {t:'Лид прочитал кейс и спрашивает: «А где вы здесь ошиблись и что переделали?». В кейсе этого нет. Что это говорит о кейсе?', o:['Кейс хорош: в портфолио принято показывать лучший результат, а не черновики','Кейс выглядит отполированным: без ошибок и итераций он вызывает меньше доверия','В кейсе мало цифр: нужно добавить метрики, чтобы вопрос об ошибках не возникал','Это стандартный вопрос на стрессоустойчивость, к содержанию кейса он не относится'], c:1, e:['Лучший результат не отменяет пути: нанимающие хотят видеть, как вы находили и исправляли ошибки.','Нанимающие ценят путь с итерациями и ошибками выше, чем гладкую историю без сомнений.','Метрики важны, но не заменяют рассказ о том, что не сработало и как вы это поменяли.','Вопрос проверяет рефлексию и честность процесса, и пробел в кейсе тут виден сразу.'], d:3},
  ]},
 {id:'portfolio-2', title:'Крафт: что лид видит за две минуты', ask:true,
  open:{q:'Разберите вслух любой экран из своего портфолио по чек-листу: иерархия, типографика, сетка, отступы, цвет, состояния. Что бы вы исправили сегодня?', hint:['Один фокус внимания на экране, ясная иерархия','Шкала типографики 2–3 размера, ритм отступов','Честная самокритика с конкретикой']},
  summary:[
   'Что лид проверяет взглядом: есть ли один фокус внимания, читается ли иерархия без вчитывания, ровные ли ритм и выравнивание, не «плывут» ли отступы, уместен ли цвет.',
   'Типографика: ограниченная шкала (2–3 размера на экран), вес и размер задают иерархию, межстрочный интервал 1.4–1.5 для текста, не больше 60–75 символов в строке.',
   'Сетка и отступы: единая система (4/8 pt), выравнивание по колонкам, внутренние отступы меньше внешних (группировка по близости). Одинаковые элементы — одинаковые.',
   'Цвет: один акцент, нейтрали с оттенком, семантические цвета отдельно от бренда. Визуальный «шум» — иконки без смысла, лишние рамки и тени — первый признак слабого крафта. По опросу Figma 58% менеджеров ставят visual polish на первое место.',
  ], q:[
   {t:'На экране три одинаково яркие кнопки. Какая проблема?', o:['Нет фокуса: нужна одна первичная кнопка, остальные — вторичные','Кнопки нужно развести по разным цветам, чтобы их было проще различить','Кнопки нужно выстроить вертикально в один столбец во всю ширину','Проблемы нет, если все три действия одинаково важны для бизнеса'], c:0, e:['Иерархия действий — базовое правило крафта: пользователь должен сразу видеть главное действие.','Разные яркие цвета различают кнопки, но всё равно не показывают, какое действие главное.','Компоновка столбцом не решает проблему: одинаковый визуальный вес кнопок остаётся.','Даже равные для бизнеса действия конкурируют за внимание, и пользователь теряется.'], d:1},
   {t:'Какой принцип описывает «внутренние отступы меньше внешних»?', o:['Близость из гештальта: связанные элементы стоят ближе друг к другу','Общая область из гештальта: элементы внутри одной рамки или фона','Сходство из гештальта: одинаковые элементы воспринимаются группой','Принцип визуального ритма: повторение одинаковых интервалов в сетке'], c:0, e:['Группировка через расстояние — это закон близости: свои элементы ближе, чем чужие.','Общая область группирует через фон или рамку, а не через соотношение отступов.','Сходство группирует по форме и цвету, а не по расстоянию между элементами.','Ритм задаёт повторяемость интервалов, но не объясняет, почему внутренние меньше внешних.'], d:1},
   {t:'Сколько размеров текста разумно на одном мобильном экране?', o:['Один размер','Два–три размера','Четыре–пять размеров','Шесть–восемь размеров'], c:1, e:['С одним размером иерархию держат только вес и цвет, и её почти не видно.','Ограниченная шкала держит иерархию и ритм, а вес и цвет добавляют нюансы.','Четыре-пять размеров на одном экране уже размывают иерархию, разница между ними теряется.','Шесть-восемь размеров превращают экран в хаос: глаз не понимает, что главное.'], d:1},
   {t:'На макете карточки товара: тень, рамка, фон другого цвета и скругление одновременно. Что скажет лид?', o:['Хорошо: несколько признаков сразу делают карточку заметной на любом фоне','Избыточно: одного-двух признаков объекта хватает, остальное — визуальный шум','Нормально, если тень, рамка, фон и радиус взяты из токенов дизайн-системы','Лишняя только тень: рамка и фон нужны для контраста и доступности карточки'], c:1, e:['Карточка выделена четырьмя способами сразу, и это читается как шум, а не как акцент.','Экономия выразительных средств — признак крафта: объект узнаётся по одному-двум признакам.','Токены гарантируют согласованность значений, но не отменяют избыточность их сочетания.','Для контраста хватает фона или рамки, а держать оба вместе с тенью и радиусом избыточно.'], d:2},
   {t:'Лид открыл макет и видит отступы 13, 17, 22, 9 px между однотипными блоками. Что это говорит о дизайнере?', o:['Отступы подобраны оптически под контент, это допустимая тонкая настройка','Нет системы отступов и внимания к ритму: базовая ошибка крафта','Это мелочь: разработчик всё равно выровняет отступы по своей сетке','Пользователь этого не заметит, поэтому важна только сетка колонок'], c:1, e:['Оптическая подгонка бывает точечной, а разные отступы между однотипными блоками — это хаос.','Ритм и система отступов — первое, что видит лид, открывая макет.','Разработчик перенесёт значения из макета, и неряшливость попадёт прямо в продукт.','Пользователь может не осознать, но почувствует неряшливость, а лид увидит её сразу.'], d:1},
   {t:'Дизайнер защищает экран: «Я добавил иконки к каждому пункту меню, так живее». Пункты — «Настройки», «История», «Профиль», «Лимиты», «Документы», «Помощь». Как оценить?', o:['Хорошо: иконки ускоряют сканирование списка и улучшают узнаваемость пунктов','Сомнительно: у абстрактных понятий нет узнаваемых иконок, они добавят шум','Хорошо, если иконки взяты из одного набора и выдержаны в одном стиле','Плохо: иконки в меню всегда вредны и только перегружают интерфейс'], c:1, e:['Узнаваемость дают только конкретные понятия, а «Лимиты» и «Документы» иконкой не прочитаются.','Иконка должна нести смысл, иначе она становится шумом и добавляет когнитивную нагрузку.','Единый стиль важен, но не решает проблему смысла у абстрактных пунктов меню.','Категоричность неверна: иконки помогают у конкретных понятий вроде «Настроек» или «Помощи».'], d:3},
  ]},
 {id:'portfolio-3', title:'Файл Figma: порядок, переменные, компоненты', ask:false,
  open:{q:'Как устроен ваш рабочий файл Figma: страницы, компоненты, переменные, прототип? Что лид увидит, открыв его на тестовом?', hint:['Страницы: процесс, финал, компоненты; понятные имена фреймов','Auto Layout, компоненты из системы, переменные для цветов и отступов','Прототип ключевого сценария']},
  summary:[
   'Что лид увидит за две минуты в файле: структуру страниц, имена фреймов, Auto Layout, привязку к стилям и переменным, компоненты вместо отвязанных копий, порядок слоёв.',
   'Variables: примитивы и семантика, режимы (светлая/тёмная тема, плотность, платформа). Переменные для отступов и радиусов тоже, не только для цветов.',
   'Компоненты: свойства (boolean, instance swap, text), варианты для состояний, слоты. Не плодите варианты там, где хватает свойства.',
   'Прототип ключевого сценария с переходами и состояниями — ожидание большинства вакансий; продвинутое прототипирование (переменные, условия) — плюс, не требование.',
  ], q:[
   {t:'Что из этого лид заметит первым, открыв файл тестового?', o:['Количество страниц и вариантов, которые показывают объём проделанной работы','Беспорядок: фреймы «Frame 148», слои без Auto Layout, цвета вне стилей','Обложку файла и оформление титульной страницы с названием проекта','Сложность прототипа: число переходов, анимаций и интерактивных компонентов'], c:1, e:['Объём не говорит о качестве, и по количеству страниц лид ничего о вас не поймёт.','Порядок в файле — первое впечатление, по словам нанимающих, и он показывает дисциплину.','Обложка приятна, но лид сразу проходит дальше, к структуре и макетам.','Прототип смотрят позже, а неряшливая структура видна с первых секунд.'], d:1},
   {t:'Для чего нужны режимы (modes) переменных в Figma?', o:['Для хранения состояний компонента вроде hover, pressed и disabled вместо вариантов','Для переключения набора значений: светлая и тёмная тема, плотность, платформа','Для разделения переменных на примитивы и семантику в отдельных коллекциях','Для переключения между режимами дизайна и Dev Mode при передаче макетов'], c:1, e:['Состояния компонента задают варианты, а режимы переключают значения переменных целиком.','Один компонент получает несколько тем и плотностей без дублирования вариантов.','Слои примитивов и семантики разделяют коллекциями, а режимы — это разные значения в коллекции.','Dev Mode — режим интерфейса Figma, к режимам переменных он отношения не имеет.'], d:1},
   {t:'Кнопка должна бывать с иконкой и без, с тремя размерами и четырьмя состояниями. Как это собрать?', o:['Один набор вариантов на все сочетания размера, состояния и иконки — 24 штуки','Варианты для размера и состояния, boolean для иконки и instance swap для её замены','Отдельный компонент на каждый размер, внутри варианты состояний и иконки','Один базовый вариант, а размеры и состояния менять оверрайдами в макетах'], c:1, e:['Комбинаторный взрыв: каждое новое свойство умножает число вариантов и усложняет поддержку.','Свойства вместо лишних вариантов — стандарт компонентной работы в Figma.','Три отдельных компонента дублируют логику, и правка состояния потребует трёх изменений.','Ручные оверрайды не связаны с системой и разъедутся при первом же обновлении.'], d:2},
   {t:'Какой минимальный набор страниц в файле тестового задания?', o:['Одна страница, где процесс и финал разложены слева направо по шагам','«Процесс» с вариантами, «Финал» с чистыми макетами и «Компоненты»','Отдельная страница на каждый экран сценария, чтобы лиду было удобно','Только «Финал»: процесс лучше оставить в черновиках, чтобы не путать'], c:1, e:['На одной странице лид долго ищет финал, а процесс смешивается с результатом.','Простая структура помогает лиду быстро увидеть и результат, и ход вашей мысли.','Страница на каждый экран дробит сценарий, и связь между шагами теряется.','Без процесса лиду не видно, как вы пришли к решению, а на тестовом это важно.'], d:1},
   {t:'Вы отвязали компонент от библиотеки, чтобы «быстро поправить». Какой риск?', o:['Риска нет, пока внешне элемент совпадает с библиотекой, а в коде он тот же','Он перестанет получать обновления системы, а в код уйдёт нестандартный элемент','Только локальный риск: файл станет тяжелее, а прототип будет медленнее','Риск лишь в том, что Figma пометит слой предупреждением при ревью файла'], c:1, e:['Совпадение внешнего вида временное: при первом обновлении библиотеки элемент разойдётся с ней.','Отвязка — долг и для системы, и для разработки: правки придётся искать вручную.','Вес файла почти не меняется, а главный риск — потеря связи с системой.','Figma не блокирует отвязку и не требует её согласовать, поэтому такие элементы легко пропустить на ревью.'], d:2},
   {t:'В вакансии написано «продвинутое прототипирование». Что это обычно означает в 2026?', o:['Кликабельный прототип по всем экранам сценария с переходами Smart Animate','Прототипы с переменными, условиями и вводом данных — в Figma, ProtoPie или Figma Make','Сложные микроанимации и моушен-дизайн интерфейса в After Effects или Rive','Сборку рабочего прототипа на React самим дизайнером перед передачей в разработку'], c:1, e:['Переходы между экранами — базовое прототипирование, его ждут почти во всех вакансиях.','Так это описывают в вакансиях: логика, состояния и ввод данных для проверки гипотез.','Моушен-дизайн — отдельный навык, и в вакансиях его обычно называют прямо.','Код от дизайнера встречается редко и описывается как отдельное требование, а не прототипирование.'], d:2},
  ]},
]});

<script>
CH.push({id:'process', title:'Команда, процессы и handoff', lessons:[
 {id:'process-1', title:'Discovery, delivery и роли', ask:true,
  open:{q:'Опишите, как выглядит ваша неделя в продуктовой команде: где discovery, где delivery, с кем и как синхронизируетесь.', hint:['Discovery: исследования, гипотезы, прототипы','Delivery: макеты, handoff, ревью реализации','Ритуалы: планирование, критика, демо; прозрачность статусов']},
  summary:[
   'Dual-track: discovery (понять проблему, проверить гипотезы дешёвыми прототипами) идёт параллельно delivery (довести проверенное до релиза). Дизайнер живёт в обоих треках.',
   'Продакт отвечает за «что и зачем» и за метрики, дизайнер — за «как» в сценарии и интерфейсе, разработчик — за реализуемость и сроки. Аналитик и исследователь — партнёры, а не обслуживающий персонал.',
   'Приносите партнёров рано: разработчика — на этапе вариантов, чтобы знать стоимость; аналитика — до запуска, чтобы заложить события.',
   'Прозрачность статусов и сроков — то, что команды отмечают как главное в работе с дизайнером. Мидл в небольшой команде также помогает джунам и объясняет дизайн не-дизайнерам.',
  ], q:[
   {t:'Что такое discovery в продуктовой команде?', o:['Поиск багов перед релизом','Презентация продукта инвесторам','Этап понимания проблемы и проверки гипотез до разработки','Рефакторинг дизайн-системы'], c:2, e:['Это QA.','Нет.','Discovery — про «что и зачем делать», до delivery.','Нет.'], d:1},
   {t:'Когда лучше всего привлечь разработчика к задаче?', o:['После финальных макетов','На этапе вариантов, чтобы понимать стоимость каждого','Никогда, это зона продакта','На демо'], c:1, e:['Поздно: дорогие варианты уже отрисованы.','Ранняя оценка стоимости экономит итерации.','Нет.','Поздно.'], d:1},
   {t:'Продакт просит «к пятнице три экрана», а вы видите, что задача не определена. Что делает мидл?', o:['Рисует три экрана','Отказывается до появления ТЗ','За 15 минут уточняет цель и метрику, предлагает, что реально к пятнице, а что требует discovery','Делает один экран и молчит'], c:2, e:['Это исполнитель, не мидл.','Ожидание ТЗ — признак джуна.','Уточнение и честный план — так действует мидл.','Молчание ломает доверие.'], d:2},
   {t:'Зачем звать аналитика до запуска фичи?', o:['Чтобы он похвалил дизайн','Чтобы заложить события и метрики, без которых результат нельзя будет измерить','Это формальность','Аналитик нужен только после запуска'], c:1, e:['Нет.','Без событий «до» не будет данных «после».','Нет.','После запуска уже поздно собирать то, чего нет.'], d:1},
   {t:'К вам пришёл джун с вопросом «какой отступ поставить». Как ответит мидл, который хочет, чтобы джун рос?', o:['«16»','Объяснит правило (система отступов, близость) и покажет, где это в дизайн-системе, чтобы в следующий раз джун решил сам','Отправит к лиду','Сделает за него'], c:1, e:['Решает один случай.','Наставничество — передача правила, а не ответа; это спрашивают и у мидла.','Перекладывание.','Не растит.'], d:2},
   {t:'В команде нет исследователя, продакт считает discovery «тратой времени». Как мидл встроит проверку гипотез?', o:['Смирится и будет рисовать по ТЗ','Предложит дешёвые форматы: коридорные тесты за час, 3 коротких интервью, прототип в Figma Make, и покажет на одной задаче, сколько ошибок это поймало до разработки','Уволится','Будет спорить на каждом планировании'], c:1, e:['Так теряется ценность дизайнера.','Доказать пользу на примере — единственный работающий путь.','Крайность.','Споры без доказательств не работают.'], d:3},
  ]},
 {id:'process-2', title:'Критика, фидбек и защита решений', ask:true,
  open:{q:'Как вы принимаете критику дизайна от продакта, который «просто так видит»? Приведите пример.', hint:['Вернуть разговор к цели и пользователю, отделив вкус от задачи','Предложить проверить данными или тестом','Без обороны, с благодарностью за контекст']},
  summary:[
   'Дизайн-критика — ритуал: автор формулирует цель и вопрос, участники говорят о проблемах, а не о решениях, автор решает, что брать.',
   'Защищайте решение данными и инсайтами, а не «так красивее». Если данных нет — предложите, как их получить.',
   'Фидбек «мне не нравится» переводите в задачу: «Что именно мешает цели? Какой сценарий ломается?».',
   'Умение сказать «нет» с альтернативой — навык мидла. Умение принять чужое лучшее решение — тоже.',
  ], q:[
   {t:'На критике коллега говорит: «Сделай кнопку оранжевой». Как ответить?', o:['Сделать оранжевой','Сказать, что он не дизайнер','Спросить, какую проблему он видит: заметность, иерархию, соответствие системе — и обсудить её','Проигнорировать'], c:2, e:['Исполнение без понимания проблемы.','Токсично.','От решения к проблеме — так работает критика.','Игнор ломает отношения.'], d:1},
   {t:'Какой аргумент в защиту решения самый сильный?', o:['«Мне так нравится»','«У конкурента так же»','«Лид одобрил»','«В тесте 5 из 6 участников не нашли фильтр в старом варианте, в новом — нашли все»'], c:3, e:['Вкус — не аргумент.','Конкурент — слабый аргумент без контекста.','Ссылка на авторитет.','Данные — сильнейший аргумент.'], d:1},
   {t:'Вы не согласны с решением продакта, но решение принято. Что дальше?', o:['Саботировать, делая медленно','Зафиксировать своё мнение и риски письменно, предложить метрику для проверки и работать на результат','Пожаловаться лиду','Уволиться'], c:1, e:['Нет.','«Не согласен, но делаю» с фиксацией рисков — зрелая позиция.','Эскалация — не первый шаг.','Нет.'], d:2},
   {t:'Как правильно открыть свою работу на дизайн-критике?', o:['«Вот макеты, что думаете?»','Назвать цель, ограничения, стадию и конкретный вопрос, на который нужен фидбек','Сразу защищаться','Показать только финал'], c:1, e:['Без рамки фидбек будет про всё и ни о чём.','Рамка фокусирует критику на полезном.','Нет.','Процесс тоже полезен для критики.'], d:1},
   {t:'Стейкхолдер на демо говорит: «Слишком много белого, добавьте жизни». Какой ответ продуктивнее?', o:['«Хорошо, добавим иллюстрации»','Уточнить, что стоит за ощущением: не видит главного действия, не хватает информации, не узнаёт бренд — и предложить проверить гипотезу','«Белое — это тренд»','Промолчать'], c:1, e:['Исполнение без диагноза.','Перевод ощущения в проверяемую проблему.','Спор о вкусах.','Нет.'], d:2},
   {t:'Разработчик на ревью предлагает решение, которое объективно лучше вашего. Что делает мидл?', o:['Настаивает на своём, чтобы не потерять авторитет','Принимает решение, говорит об этом вслух и фиксирует авторство идеи за разработчиком','Молча берёт идею как свою','Отклоняет, потому что он не дизайнер'], c:1, e:['Авторитет строится на честности.','Умение принять лучшее решение — часть зрелости.','Так теряют доверие.','Хорошие идеи приходят отовсюду.'], d:2},
  ]},
 {id:'process-3', title:'Handoff и авторский надзор', ask:false,
  open:{q:'Разработчик говорит, что ваш сценарий невозможно сделать в срок. Что вы делаете?', hint:['Понять, что именно дорого, и зачем это пользователю','Упрощённая версия без потери смысла, фазирование','Зафиксировать договорённость и что откладываем']},
  summary:[
   'Готовый к разработке макет: все состояния, edge cases, адаптивы, тексты, поведение (анимации, переходы), компоненты из системы, понятные названия слоёв.',
   'Дизайн-ревью реализации до релиза — обязанность дизайнера: сверьте отступы, состояния, тексты. Инспектор в браузере и базовое понимание HTML/CSS ускоряют разговор.',
   'Разработчик — пользователь вашего файла: оставьте примечания, где важна логика, и будьте доступны для вопросов.',
   'Не требуйте пиксель-перфект там, где это не влияет на пользователя. Приоритизируйте правки по влиянию.',
  ], q:[
   {t:'Что должно быть в макете, который вы считаете готовым к разработке?', o:['Только основной экран','Макет и устное пояснение','Состояния, edge cases, адаптивы, тексты, поведение','Скриншот'], c:2, e:['Мало.','Устное забудется.','Полный набор — то, что называют dev-ready.','Нет.'], d:1},
   {t:'Разработчик реализовал экран с отступами 12 вместо 16 px. Что делать?', o:['Молчать, мелочь','Переделать всё самому в коде','Написать в общий чат с претензией','Оценить влияние: если ломается ритм и система — правка с приоритетом; если нет — отметить на будущее'], c:3, e:['Копится долг.','Не ваша зона, не масштабируется.','Публичные претензии портят отношения.','Приоритизация правок по влиянию — зрелый подход.'], d:2},
   {t:'Зачем дизайнеру базовое понимание HTML/CSS?', o:['Чтобы верстать продукт','Чтобы говорить с разработчиками на одном языке и понимать стоимость решений','Это обязательное требование всех вакансий','Незачем'], c:1, e:['Верстать не требуется.','Общий язык и оценка стоимости — в этом смысл.','Встречается в части вакансий, не везде.','Помогает.'], d:1},
   {t:'Разработчик: «Эту анимацию делать 3 дня». Что спросит мидл?', o:['«Почему так долго?»','«Что именно дорого? Можно ли сделать упрощённую версию, которая сохранит смысл — например, без физики, но с переходом?»','«Тогда убираем»','«Сделайте как-нибудь»'], c:1, e:['Звучит как претензия.','Поиск версии, которая сохраняет ценность при меньшей цене.','Без выяснения ценности.','Нет.'], d:2},
   {t:'Что такое авторский надзор?', o:['Контроль за тем, чтобы никто не менял ваши макеты','Проверка реализации дизайнером до релиза: состояния, отступы, тексты, поведение','Подпись в футере','Надзор за джунами'], c:1, e:['Нет.','В вакансиях это называют именно так.','Нет.','Нет.'], d:1},
   {t:'Фича вышла, в проде пропало пустое состояние, которого не было в макете. Чья это ошибка и что делать?', o:['Разработчика, он должен был догадаться','Дизайнера: состояние не было спроектировано; завести задачу, спроектировать, проверить реализацию и добавить состояния в чек-лист handoff','Тестировщика','Ничья'], c:1, e:['Разработчик делает по макету.','Ответственность за состояния — на дизайнере; выводы в чек-лист.','QA проверяет по макету.','Есть чья.'], d:3},
  ]},
]});
